name: Publish tested 4.28.10 beta to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.28.10]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.28.10
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify successful merged-main build and identical PR tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request

          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          source_sha = '15af992914f1966d50d92d58c80b910db9d2d865'
          source_tree = '967e314548bb1642ccc4f5d98ddab353361a3731'
          pr_head_sha = '13ae6d1c319e102b7182ef690680b79baa7d721b'

          run = get('actions/runs/34797249120')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == source_sha

          pr = get('pulls/132')
          assert pr['merged'] and pr['merge_commit_sha'] == source_sha
          assert pr['head']['sha'] == pr_head_sha

          for sha in (run['head_sha'], pr['merge_commit_sha'], pr_head_sha):
              assert get('git/commits/' + sha)['tree']['sha'] == source_tree
          CHECK

      - name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34797249120
          github-token: ${{ github.token }}
          path: dist

      - name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          run-id: 34797249120
          github-token: ${{ github.token }}
          path: regression

      - name: Verify tested bytes, metadata, dependencies, and regressions
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          import xml.etree.ElementTree as ET

          jar = Path('dist/siegeoverhaul-4.28.10.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'c9cd4aaae1eddc447eaae7114b2b9f7833e4e1749f2e101f3ffbcfbf98ad34df'

          with zipfile.ZipFile(jar) as archive:
              data = tomllib.loads(archive.read('META-INF/mods.toml').decode())
          mod = data['mods'][0]
          assert mod['modId'] == 'siegeoverhaul' and mod['version'] == '4.28.10'
          assert mod['displayTest'] == 'MATCH_VERSION'

          dependencies = {entry['modId']: entry for entry in data['dependencies']['siegeoverhaul']}
          for mod_id in ('recruits', 'workers', 'smallships', 'siegeweapons'):
              assert dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['recruits']['versionRange'] == '[1.15.2,)'
          assert dependencies['workers']['versionRange'] == '[2.0.3,)'
          for mod_id in ('corpse', 'magistuarmory', 'musketmod'):
              assert not dependencies[mod_id]['mandatory'], mod_id

          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          reports = list(Path('regression').rglob('TEST-*.xml'))
          assert reports, 'No regression reports found'
          for report in reports:
              result = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(result.get(key, 0))
          assert totals == {'tests': 269, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          print('Verified', jar.name, digest, totals)
          CHECK

      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.28.10.jar
          name: The Siege Overhaul v4.28.10 beta - Clearer Treasury Notices
          version: v4.28.10
          version-type: beta
          changelog: |
            ## 4.28.10 beta

            - Give faction Treasury chat a gold [Treasury] prefix, green deposits and red deductions, with signed amounts and thousands separators.
            - Use singular wording for one emerald. Combine same-tick transactions into one chat message while keeping gains and deductions separate.

            Minecraft 1.20.1 Forge, Java 17. REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Corpse, Epic Knights, and ewewukek's Musket Mod remain optional.

            Validation: merged-main Java 17 Forge build, 269 passing regression tests, zero failures/errors/skipped. Exact tested reobfuscated JAR from Build run 34797249120, SHA-256 c9cd4aaae1eddc447eaae7114b2b9f7833e4e1749f2e101f3ffbcfbf98ad34df. No interactive Minecraft playtesting or in-game performance benchmark. Beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
          fail-mode: fail

      - name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os

          result = {
              'version': '4.28.10',
              'file_id': os.environ['RELEASE_FILE_ID'],
              'url': os.environ['RELEASE_URL'],
              'source': '15af992914f1966d50d92d58c80b910db9d2d865',
              'build_run': 34797249120,
              'sha256': 'c9cd4aaae1eddc447eaae7114b2b9f7833e4e1749f2e101f3ffbcfbf98ad34df',
          }
          assert result['file_id'] and result['url'], 'CurseForge did not return an upload receipt'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Accepted upload (moderation/public availability separate): ' + json.dumps(result) + '\n')
          RECEIPT


