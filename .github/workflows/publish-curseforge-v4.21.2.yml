name: Publish tested 4.21.2 beta to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.21.2]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.21.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify successful merged-main build and identical PR tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request

          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          source_sha = '0ac533c26905e231ae3bf34e2dd452e1694ba592'
          source_tree = '04984df7c001070fdf673196c863ea0db7a7c3e6'
          pr_head_sha = '16192ae89ca90eb15ff9bbc71e56ec7799f894b5'
          run_id = 34702475400

          run = get(f'actions/runs/{run_id}')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == source_sha

          pr = get('pulls/108')
          assert pr['merged'] and pr['merge_commit_sha'] == source_sha
          assert pr['head']['sha'] == pr_head_sha

          for sha in (run['head_sha'], pr['merge_commit_sha'], pr_head_sha):
              assert get('git/commits/' + sha)['tree']['sha'] == source_tree

          artifacts = {a['name']: a for a in get(f'actions/runs/{run_id}/artifacts')['artifacts']}
          jar = artifacts['Faction-Raids-Forge-1.20.1']
          tests = artifacts['regression-test-results']
          assert jar['id'] == 10300229851
          assert jar['digest'] == 'sha256:f075a685e3b4122af0be9f798f20dedb7766ca25411f87baf71d947120048c86'
          assert tests['id'] == 10300444420
          assert tests['digest'] == 'sha256:1e88328ddfd6e273009985fe1ca7a76ba3f265135ff75e0af84aa48890590375'
          CHECK

      - name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34702475400
          github-token: ${{ github.token }}
          path: dist

      - name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          run-id: 34702475400
          github-token: ${{ github.token }}
          path: regression

      - name: Verify tested bytes, metadata, dependencies, and regressions
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          import xml.etree.ElementTree as ET

          jar = Path('dist/siegeoverhaul-4.21.2.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '75356c49f28099ba8f0b96d266f7b65f197527dd13560c7ff3b7fa544dc4553e'

          with zipfile.ZipFile(jar) as archive:
              data = tomllib.loads(archive.read('META-INF/mods.toml').decode())
          mod = data['mods'][0]
          assert mod['modId'] == 'siegeoverhaul' and mod['version'] == '4.21.2'
          assert mod['displayTest'] == 'MATCH_VERSION'

          dependencies = {entry['modId']: entry for entry in data['dependencies']['siegeoverhaul']}
          for mod_id in ('recruits', 'workers', 'smallships', 'siegeweapons'):
              assert dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['recruits']['versionRange'] == '[1.15.2,)'
          assert dependencies['workers']['versionRange'] == '[2.0.3,)'
          for mod_id in ('corpse', 'magistuarmory', 'musketmod'):
              assert not dependencies[mod_id]['mandatory'], mod_id

          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          reports = list(Path('regression').rglob('TEST-*.xml'))
          assert reports, 'No regression reports found'
          for report in reports:
              result = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(result.get(key, 0))
          assert totals == {'tests': 240, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          print('Verified', jar.name, digest, totals)
          CHECK

      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.21.2.jar
          name: The Siege Overhaul v4.21.2 beta - Config Editor Reliability
          version: v4.21.2
          version-type: beta
          changelog: |
            ## 4.21.2 beta

            - Fixed the in-game configuration editor saving Forge list settings as one incompatible string. Civilian allowlists, first-wave siege engines, allowed raider factions, and allowed casus belli now remain proper lists.
            - List settings use a readable comma-separated editor. Blank input produces an empty list, and the legacy bracketed display is accepted for a smooth upgrade.
            - Existing long lists are loaded without silent truncation and retain space for further edits.
            - Gameplay balance, save data, emerald prices, and dependency requirements are unchanged.
            - The Command Center's existing **Leave Feedback** button opens the Siege Overhaul CurseForge comments page through Minecraft's normal link-confirmation screen.

            Minecraft 1.20.1 Forge, Java 17. REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Corpse, Epic Knights, and ewewukek's Musket Mod remain optional.

            Validation: merged-main Java 17 Forge build, 240 passing regression tests, zero failures/errors/skipped. Exact tested reobfuscated JAR from Build #293 (run 34702475400), SHA-256 75356c49f28099ba8f0b96d266f7b65f197527dd13560c7ff3b7fa544dc4553e. No interactive Minecraft playtesting or in-game performance benchmark. Beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
          fail-mode: fail

      - name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os

          result = {
              'version': '4.21.2',
              'file_id': os.environ['RELEASE_FILE_ID'],
              'url': os.environ['RELEASE_URL'],
              'source': '0ac533c26905e231ae3bf34e2dd452e1694ba592',
              'source_tree': '04984df7c001070fdf673196c863ea0db7a7c3e6',
              'build_run': 34702475400,
              'sha256': '75356c49f28099ba8f0b96d266f7b65f197527dd13560c7ff3b7fa544dc4553e',
          }
          assert result['file_id'] and result['url'], 'CurseForge did not return an upload receipt'
          print(json.dumps(result, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Accepted upload (moderation/public availability separate): ' + json.dumps(result, sort_keys=True) + '\n')
          RECEIPT
