name: Native Perimeter Completion QA

# Separate long real-AI acceptance; baseline HUD/server suites remain independent.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-perimeter-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-perimeter-client:
    # Long full-completion coverage is opt-in when a specific risk warrants it.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Check out exact integrated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install standard virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Prepare new isolated perimeter directory
        run: |
          set -euo pipefail
          test ! -e build/native-perimeter-qa/client
          test ! -e build/native-perimeter-qa/evidence
          python3 -B -m unittest discover -s scripts/tests -p 'test_prepare_native_client_defaults.py'
          python3 scripts/prepare-native-client-defaults.py --mode perimeter-completion --smallships-version 2.0.0-b1.4
          mkdir -p build/native-perimeter-qa/evidence
          cp build/native-perimeter-qa/client/.native-smallships-defaults.json build/native-perimeter-qa/evidence/smallships-default-config-provenance.json
          printf 'onboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nmaxFps:30\nvsync:false\n' > build/native-perimeter-qa/client/options.txt
          git rev-parse HEAD > build/native-perimeter-qa/evidence/source-commit.txt
          java -version 2> build/native-perimeter-qa/evidence/java-version.txt
      - name: Run full native perimeter with real client and integrated server
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -euo pipefail
            glxinfo -B | tee build/native-perimeter-qa/evidence/opengl.txt
            timeout --signal=TERM --kill-after=60s 32m ./gradlew --no-daemon --console=plain --max-workers=2 -PnativeQa=true -PnativeQaMode=perimeter-completion runClient 2>&1 | tee build/native-perimeter-qa/evidence/client-console.log
          '
      - name: Verify exact completed-ring evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/native-perimeter-qa/evidence')
          data = json.loads((root / 'result.json').read_text())
          assert data['mode'] == 'perimeter-completion', data
          assert data['status'] == 'passed', data
          assert data['completedBlocks'] == 572, data
          assert data['treasuryDebit'] == 64, data
          assert data['materialCounts'] == {'minecraft:cobblestone': 352, 'minecraft:oak_planks': 220}, data
          assert data['nativeCompletionObserved'] and data['completedCaptureTerrainCompiled'], data
          assert 0 < data['constructionSeconds'] <= 1200, data
          assert data['screenshots'] == ['01-native-completed-perimeter.png'], data
          content = (root / data['screenshots'][0]).read_bytes()
          assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) > 4096
          versions = data['loadedModVersions']
          assert versions['workers'] == '2.0.3' and versions['recruits'] == '1.15.2', versions
          assert versions['minecraft'] == '1.20.1' and versions['forge'] == '47.4.16', versions
          for mod in ['workers', 'recruits', 'smallships', 'siegeweapons']:
              assert len(data['loadedCompanionArtifacts'][mod]['sha256']) == 64, mod
          final = data['finalDiagnostics']
          assert final['placed'] == 572 and final['treasury'] == 1936, final
          assert final['placedCobble'] == 352 and final['placedOak'] == 220, final
          for key in ['chestCobble', 'chestOak', 'builderCobble', 'builderOak', 'looseCobble', 'looseOak']:
              assert final[key] == 0, (key, final)
          print('Exact full-perimeter native completion passed. Review the actual framebuffer and diagnostics.')
          PY
      - name: Collect diagnostics without companion JARs or worlds
        if: always()
        run: |
          mkdir -p build/native-perimeter-qa/evidence/logs
          if [ -d build/native-perimeter-qa/client/logs ]; then
            find build/native-perimeter-qa/client/logs -maxdepth 1 -type f -name '*.log' -exec cp {} build/native-perimeter-qa/evidence/logs/ \;
          fi
          if [ -d build/native-perimeter-qa/client/crash-reports ]; then
            cp -R build/native-perimeter-qa/client/crash-reports build/native-perimeter-qa/evidence/
          fi
      - name: Upload actual framebuffer and diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-perimeter-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-perimeter-qa/evidence/
          if-no-files-found: error
          retention-days: 7
