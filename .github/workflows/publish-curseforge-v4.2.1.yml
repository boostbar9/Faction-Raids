name: Publish tested 4.2.1 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.2.1]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.2.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34181829733
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.2.1.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '33ed5266012da6032242b868e5c2e1085b13dab3f8b486ab8770a6c24a844418'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.2.1'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.2.1.jar
          name: The Siege Overhaul v4.2.1 beta - Claimed Camp Footholds
          version: v4.2.1
          version-type: beta
          changelog: |
            ## 4.2.1 beta - Claimed Camp Footholds

            Fix failed camp searches that nevertheless announced a camp and advanced preparation. Scouts now search roughly 160-544 blocks from the core, loading one candidate neighborhood at a time with expiring chunk tickets. Keep the core and established camp active while the defending faction is online. Tickets expire after five seconds without refresh and are released at siege end; no permanent force-loaded claims or synchronous terrain generation.

            Preparation and assault wait until a real camp exists. Previously failed 4.2.0 camps retry automatically. Successful native 25-chunk Recruits claim registration precedes camp construction; supplied builders, siege engines and guards initialize there before the full preparation countdown starts. Existing camp crews are not duplicated. Claim spacing, other players' land and world borders remain respected.

            Ordinary tall grass and flowers no longer cause an otherwise suitable camp site to fail. Water, crops, structures and steep terrain remain protected. Search state survives restart. Logs and chat show actual scouting/claim status; camp claims are named for their attacking faction and coordinates are announced after success. Native Recruits map fog-of-war still applies.

            Includes 4.2.0 faction/rank armor trims, back banners, core claim conquest and timed recapture. Minecraft 1.20.1 Forge, Java 17. REQUIRED: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons on server and clients. Install matching Siege Overhaul versions.

            Validation: clean Java 17 build and all 76 tests passed, zero failures or skips. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.2.1', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.2.1 beta: {result['url']}\n")
          RECEIPT
