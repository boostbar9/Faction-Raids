name: Publish tested 4.8.1 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.8.1]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.8.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34197002220
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.8.1.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '8a5f03125904612c0a14f0a158bbeef0849d4b55e48be415fa12845e186f346c'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.8.1'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.8.1.jar
          name: The Siege Overhaul v4.8.1 beta - Smoother Enemy Movement
          version: v4.8.1
          version-type: beta
          changelog: |
            ## 4.8.1 beta
            
            - Preserve useful travel paths while raiders make progress, including sideways detours around walls. Retry stationary routes after two seconds or when navigation finishes.
            - Keep native combat targets in control of movement instead of redirecting them toward the core.
            - Stable local role squads of up to six retain membership across chunk boundaries. Distant stragglers regroup locally.
            - Longer marching waypoints renew near arrival; rear ranks no longer receive backward marching slots. Formation decisions update once per second while useful walking orders stay intact.
            - Formations still apply only in defender territory and release for combat, ladders and collisions. No movement teleportation added.
            
            REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Minecraft 1.20.1 Forge, Java 17. Match Siege Overhaul versions.
            
            Validation: Java 17 clean build and 128 regression tests passed. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.8.1', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.8.1 beta: {result['url']}\n")
          RECEIPT
