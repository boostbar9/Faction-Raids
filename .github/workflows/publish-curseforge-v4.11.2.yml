name: Publish tested 4.11.2 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.11.2]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.11.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34375851783
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.11.2.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '717cedac56fa551b0019bf0d1894fd9c37b4ca60235a0d9ee46f6f9bf681b7d5'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.11.2'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          for mod in ['corpse', 'magistuarmory', 'musketmod']:
              assert not dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.11.2.jar
          name: The Siege Overhaul v4.11.2 beta - Long Siege Reliability
          version: v4.11.2
          version-type: beta
          changelog: |
            ## 4.11.2 beta

            - Reuse unoccupied siege-owned artillery after confirmed crew death in a previous wave. Replacement engineers deploy at the War Gate and walk to their equipment; no vehicle teleporting or increased fleet cap.
            - Player-mounted artillery is protected from reuse and siege cleanup. Unknown crew deaths in older saves remain untouched.
            - Returning engineers no longer receive conflicting infantry orders or marching formations.
            - Assault paths recover from prolonged circling while retaining short detours.
            - Camp builders try eight bounded alternative upgrade sites, protecting player blocks and excluded claims.
            - Recover active uncast retreat votes after reconnecting or reopening the core, without resetting the deadline. Automatic reminders are deduplicated.
            - Bank transfers show the actual amount and balance. Practice sieges show zero upcoming bank reward. Mystery-box contents remain hidden.

            Minecraft 1.20.1 Forge, Java 17. REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Matching Siege Overhaul versions required. Corpse, Epic Knights and ewewukek's Musket Mod remain optional.

            Validation: clean Java 17 Forge build, 212 passing regression tests, zero failures/errors/skipped. Exact tested reobfuscated artifact. No interactive Minecraft playtest. Native pathfinding and older unclassified equipment remain limitations. Beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.11.2', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.11.2 beta: {result['url']}\n")
          RECEIPT
