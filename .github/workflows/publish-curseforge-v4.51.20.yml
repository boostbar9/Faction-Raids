# Release-only workflow; exact artifact and source-tree checks run before upload.
name: Publish tested 4.51.20 beta to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.51.20]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.51.20
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prevent duplicate release uploads
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request, urllib.parse
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          current = int(os.environ['GITHUB_RUN_ID'])
          params = urllib.parse.urlencode({'branch': 'publish/curseforge-v4.51.20', 'event': 'push', 'per_page': 100})
          runs = get('actions/runs?' + params)['workflow_runs']
          already_published = False
          for run in runs:
              if run['id'] == current or run['name'] != os.environ['GITHUB_WORKFLOW']:
                  continue
              for job in get('actions/runs/' + str(run['id']) + '/jobs')['jobs']:
                  if any(step['name'] == 'Publish to CurseForge' and step['conclusion'] == 'success' for step in job['steps']):
                      already_published = True
          if int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')) > 1:
              for attempt in range(1, int(os.environ['GITHUB_RUN_ATTEMPT'])):
                  for job in get(f'actions/runs/{current}/attempts/{attempt}/jobs')['jobs']:
                      if any(step['name'] == 'Publish to CurseForge' and step['conclusion'] == 'success' for step in job['steps']):
                          already_published = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(not already_published).lower() + '\n')
          print('Prior upload found; skipping duplicate.' if already_published else 'No prior successful upload; publishing once.')
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Verify successful tested build and identical merged tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          tested_sha = '1bc353ca7942d615512ed031521249b769f781ae'
          merged_sha = 'c19e53dc529f0010a2ee7ffdcc0e5619de8d61cd'
          source_tree = '7109e7857542fb37f61f80ab16cdba542e88afbd'
          run = get('actions/runs/37084313087')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_sha'] == merged_sha
          pr = get('pulls/251')
          assert pr['merged'] and pr['merge_commit_sha'] == merged_sha and pr['head']['sha'] == tested_sha
          assert get('branches/main')['commit']['sha'] == merged_sha
          for sha in (run['head_sha'], pr['merge_commit_sha'], tested_sha):
              assert get('git/commits/' + sha)['tree']['sha'] == source_tree
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 37084313087
          github-token: ${{ github.token }}
          path: dist

      - if: steps.guard.outputs.publish == 'true'
        name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          run-id: 37084313087
          github-token: ${{ github.token }}
          path: regression

      - if: steps.guard.outputs.publish == 'true'
        name: Verify tested bytes, metadata, dependencies, and regressions
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          import xml.etree.ElementTree as ET
          jar = Path('dist/siegeoverhaul-4.51.20.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'c77ca88cd3cfb5b10cb392846cc01c99e2dd6732c4dd49f62aadaf8a6919b56e'
          Path('verified-sha256.txt').write_text(digest)
          with zipfile.ZipFile(jar) as archive:
              assert archive.testzip() is None
              entries = set(archive.namelist())
              for entry in (
                  'com/devfarinsky/siegeoverhaul/camp/CampTerrain.class',
                  'com/devfarinsky/siegeoverhaul/camp/CampGround.class',
                  'com/devfarinsky/siegeoverhaul/client/WorkersProjectionVisibility.class',
                  'com/devfarinsky/siegeoverhaul/client/ProjectionCulling.class',
                  'com/devfarinsky/siegeoverhaul/compat/WorkersProjectionView.class',
              ):
                  assert entry in entries, entry
              terrain = archive.read('com/devfarinsky/siegeoverhaul/camp/CampTerrain.class')
              assert b'foundation' in terrain
              data = tomllib.loads(archive.read('META-INF/mods.toml').decode())
          mod = data['mods'][0]
          assert mod['modId'] == 'siegeoverhaul' and mod['version'] == '4.51.20'
          assert mod['displayTest'] == 'MATCH_VERSION'
          dependencies = {entry['modId']: entry for entry in data['dependencies']['siegeoverhaul']}
          for mod_id in ('recruits', 'workers', 'smallships', 'siegeweapons'):
              assert dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['recruits']['versionRange'] == '[1.15.2,)'
          assert dependencies['workers']['versionRange'] == '[2.0.3,)'
          for mod_id in ('ftbchunks', 'openpartiesandclaims', 'corpse', 'magistuarmory', 'musketmod', 'curios'):
              assert not dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['curios']['versionRange'] == '[5.14.1,6)'
          assert not any(n.startswith('top/theillusivec4/curios/') for n in entries)
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          reports = list(Path('regression').rglob('TEST-*.xml'))
          assert reports
          for report in reports:
              result = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(result.get(key, 0))
          assert totals == {'tests': 922, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          matches = [report for report in reports
                     if report.name == 'TEST-com.devfarinsky.siegeoverhaul.camp.CampTerrainTest.xml']
          assert len(matches) == 1
          assert int(ET.parse(matches[0]).getroot().get('tests')) == 50
          expected_suites = {
              'com.devfarinsky.siegeoverhaul.camp.CampLoadingTest': 4,
              'com.devfarinsky.siegeoverhaul.client.ProjectionCullingTest': 7,
              'com.devfarinsky.siegeoverhaul.compat.WorkersProjectionViewTest': 4,
          }
          suite_counts = {ET.parse(report).getroot().get('name'): int(ET.parse(report).getroot().get('tests')) for report in reports}
          for name, count in expected_suites.items():
              assert suite_counts[name] == count, name
          print('Verified', jar.name, digest, totals)
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.51.20.jar
          name: The Siege Overhaul v4.51.20 beta - Stable Wall Projections and Camp Search
          version: v4.51.20
          version-type: beta
          changelog: |
            # 4.51.20 beta

            - Enabled wall projections stay visible when their fixed footprint is on screen, even if the shovel marker is off screen.
            - Difficult-site scouts accept untouched natural-rock footing and shallow pond bottoms without gaining permission to excavate rock or replace crafted foundations.
            - All 25 expanded scout terrain surveys now stay inside the guaranteed loaded three-by-three chunk neighborhood.
            - Forge build and 922 automated tests passed. No interactive Minecraft playtest performed.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            ftb-chunks-forge(optional)
            open-parties-and-claims(optional)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
            curios(optional)
          fail-mode: fail

      - if: steps.guard.outputs.publish == 'true'
        name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os, hashlib
          from pathlib import Path
          digest = hashlib.sha256(Path('dist/siegeoverhaul-4.51.20.jar').read_bytes()).hexdigest()
          assert digest == Path('verified-sha256.txt').read_text()
          result = {
              'version': '4.51.20',
              'file_id': os.environ['RELEASE_FILE_ID'],
              'url': os.environ['RELEASE_URL'],
              'reviewed_source': '1bc353ca7942d615512ed031521249b769f781ae',
              'tested_source': 'c19e53dc529f0010a2ee7ffdcc0e5619de8d61cd',
              'merged_source': 'c19e53dc529f0010a2ee7ffdcc0e5619de8d61cd',
              'source_tree': '7109e7857542fb37f61f80ab16cdba542e88afbd',
              'build_run': 37084313087,
              'tests': 922,
              'sha256': digest,
          }
          assert result['file_id'] and result['url']
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Accepted upload (moderation/public availability separate): ' + json.dumps(result) + '\n')
          RECEIPT


