# Release-only workflow; exact artifact and source-tree checks run before upload.
name: Publish tested 4.51.18 beta to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.51.18]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.51.18
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prevent duplicate release uploads
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request, urllib.parse
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          current = int(os.environ['GITHUB_RUN_ID'])
          params = urllib.parse.urlencode({'branch': 'publish/curseforge-v4.51.18', 'event': 'push', 'per_page': 100})
          runs = get('actions/runs?' + params)['workflow_runs']
          already_published = False
          for run in runs:
              if run['id'] == current or run['name'] != os.environ['GITHUB_WORKFLOW']:
                  continue
              for job in get('actions/runs/' + str(run['id']) + '/jobs')['jobs']:
                  if any(step['name'] == 'Publish to CurseForge' and step['conclusion'] == 'success' for step in job['steps']):
                      already_published = True
          if int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')) > 1:
              for attempt in range(1, int(os.environ['GITHUB_RUN_ATTEMPT'])):
                  for job in get(f'actions/runs/{current}/attempts/{attempt}/jobs')['jobs']:
                      if any(step['name'] == 'Publish to CurseForge' and step['conclusion'] == 'success' for step in job['steps']):
                          already_published = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('publish=' + str(not already_published).lower() + '\n')
          print('Prior upload found; skipping duplicate.' if already_published else 'No prior successful upload; publishing once.')
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Verify successful tested build and identical merged tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          tested_sha = '1c8a9a9931adf53ba1092d57d51ad4232770b54b'
          merged_sha = '54651be1292115bf923ce9bc8b8de2282248254a'
          source_tree = 'ce6124243e0491ca09afbc1f4cb344cbb841ad36'
          run = get('actions/runs/37016716152')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_sha'] == merged_sha
          pr = get('pulls/249')
          assert pr['merged'] and pr['merge_commit_sha'] == merged_sha and pr['head']['sha'] == tested_sha
          assert get('branches/main')['commit']['sha'] == merged_sha
          for sha in (run['head_sha'], pr['merge_commit_sha'], tested_sha):
              assert get('git/commits/' + sha)['tree']['sha'] == source_tree
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 37016716152
          github-token: ${{ github.token }}
          path: dist

      - if: steps.guard.outputs.publish == 'true'
        name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          run-id: 37016716152
          github-token: ${{ github.token }}
          path: regression

      - if: steps.guard.outputs.publish == 'true'
        name: Verify tested bytes, metadata, dependencies, and regressions
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          import xml.etree.ElementTree as ET
          jar = Path('dist/siegeoverhaul-4.51.18.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '3ed3c64e42c9f00f2b245142da3acee4e33ef36821a2927a6ca8f0129cb8a3a1'
          Path('verified-sha256.txt').write_text(digest)
          with zipfile.ZipFile(jar) as archive:
              assert archive.testzip() is None
              entries = set(archive.namelist())
              for entry in (
                  'com/devfarinsky/siegeoverhaul/RaidNetwork.class',
                  'com/devfarinsky/siegeoverhaul/RaidNetwork$CoreDetails.class',
                  'com/devfarinsky/siegeoverhaul/RaidNetwork$ArmyMarkers.class',
                  'com/devfarinsky/siegeoverhaul/RaidNetwork$DashboardSync.class',
                  'com/devfarinsky/siegeoverhaul/RaidNetwork$PacketText.class',
              ):
                  assert entry in entries, entry
              assert b'clone' in archive.read('com/devfarinsky/siegeoverhaul/RaidNetwork$CoreDetails.class')
              dashboard = archive.read('com/devfarinsky/siegeoverhaul/RaidNetwork$DashboardSync.class')
              assert b'readCount' in dashboard and b'readableBytes' in dashboard
              data = tomllib.loads(archive.read('META-INF/mods.toml').decode())
          mod = data['mods'][0]
          assert mod['modId'] == 'siegeoverhaul' and mod['version'] == '4.51.18'
          assert mod['displayTest'] == 'MATCH_VERSION'
          dependencies = {entry['modId']: entry for entry in data['dependencies']['siegeoverhaul']}
          for mod_id in ('recruits', 'workers', 'smallships', 'siegeweapons'):
              assert dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['recruits']['versionRange'] == '[1.15.2,)'
          assert dependencies['workers']['versionRange'] == '[2.0.3,)'
          for mod_id in ('ftbchunks', 'openpartiesandclaims', 'corpse', 'magistuarmory', 'musketmod', 'curios'):
              assert not dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['curios']['versionRange'] == '[5.14.1,6)'
          assert not any(n.startswith('top/theillusivec4/curios/') for n in entries)
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          reports = list(Path('regression').rglob('TEST-*.xml'))
          assert reports
          for report in reports:
              result = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(result.get(key, 0))
          assert totals == {'tests': 905, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          for class_name in ('CoreDetailsTest', 'DashboardCollectionsTest'):
              matches = [report for report in reports if report.name == 'TEST-com.devfarinsky.siegeoverhaul.' + class_name + '.xml']
              assert len(matches) == 1, class_name
              assert int(ET.parse(matches[0]).getroot().get('tests')) == 5, class_name
          print('Verified', jar.name, digest, totals)
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.51.18.jar
          name: The Siege Overhaul v4.51.18 beta - Packet Validation and Snapshots
          version: v4.51.18
          version-type: beta
          changelog: |
            # 4.51.18 beta

            - Dashboard list counts are validated against the received payload before allocating entries.
            - Treasury ledger packets defensively copy input and output arrays to keep snapshots stable.
            - Army map faction names truncate without splitting supplementary Unicode characters.
            - Packet layout and protocol 17 remain unchanged.
            - Forge build and 905 automated tests passed. No interactive Minecraft playtest performed.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            ftb-chunks-forge(optional)
            open-parties-and-claims(optional)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
            curios(optional)
          fail-mode: fail

      - if: steps.guard.outputs.publish == 'true'
        name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os, hashlib
          from pathlib import Path
          digest = hashlib.sha256(Path('dist/siegeoverhaul-4.51.18.jar').read_bytes()).hexdigest()
          assert digest == Path('verified-sha256.txt').read_text()
          result = {
              'version': '4.51.18',
              'file_id': os.environ['RELEASE_FILE_ID'],
              'url': os.environ['RELEASE_URL'],
              'reviewed_source': '1c8a9a9931adf53ba1092d57d51ad4232770b54b',
              'tested_source': '54651be1292115bf923ce9bc8b8de2282248254a',
              'merged_source': '54651be1292115bf923ce9bc8b8de2282248254a',
              'source_tree': 'ce6124243e0491ca09afbc1f4cb344cbb841ad36',
              'build_run': 37016716152,
              'tests': 905,
              'sha256': digest,
          }
          assert result['file_id'] and result['url']
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Accepted upload (moderation/public availability separate): ' + json.dumps(result) + '\n')
          RECEIPT


