name: Publish tested 4.9.2 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.9.2]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.9.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34202924926
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.9.2.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '7209efeec3360ff46f951c97ab45a4da1772af255f4110be363eeb233c656a8f'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.9.2'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.9.2.jar
          name: The Siege Overhaul v4.9.2 beta - Core Menu Polish and Updated Guide
          version: v4.9.2
          version-type: beta
          changelog: |
            ## 4.9.2 beta
            
            - Includes the modern core menu from 4.9.1: selected tabs, custom buttons, responsive cards, server-synchronized emerald balance and reward previews.
            - Cache enchanted loot previews during screen initialization instead of recreating them every rendered frame.
            - Keep reward tooltips off purchase buttons so confirmation remains visible.
            - Replace the obsolete bed-based description in Minecraft's mod list. Update README and add copy-ready CurseForge Markdown covering claimed cores, required companion mods, starter bags, hero magic, loot boxes, capture rules and restoration limits.
            - Network protocol remains 11. Update server and clients together.
            
            REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Minecraft 1.20.1 Forge, Java 17. Match Siege Overhaul versions.
            
            Validation: Java 17 clean build and 136 regression tests passed. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.9.2', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.9.2 beta: {result['url']}\n")
          RECEIPT
