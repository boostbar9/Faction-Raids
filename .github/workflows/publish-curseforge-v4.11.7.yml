name: Publish tested 4.11.7 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.11.7]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.11.7
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34387857177
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.11.7.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'a8361ed47303d0e1a6b3dd6ab03019fb7534484bbb18c85b1eb47f88fbfa7977'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.11.7'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          for mod in ['corpse', 'magistuarmory', 'musketmod']:
              assert not dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.11.7.jar
          name: The Siege Overhaul v4.11.7 beta - Names and Worker Kits
          version: v4.11.7
          version-type: beta
          changelog: |
            ## 4.11.7 beta

            - New ordinary core recruits have simple first names, including Bobby and Fernan.
            - Farmers start with a diamond hoe, water bucket, 32 wheat seeds and food. Other core workers receive role-specific diamond tools, supplies and food; couriers keep cargo space.
            - One-time kits preserve existing equipment and do not refill on reload. No hiring-price or dependency changes.
            - Normal work areas, routes, recipes and project-specific construction materials still need setup. Existing hired NPCs keep their names and inventories.

            Minecraft 1.20.1 Forge, Java 17. REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Matching Siege Overhaul versions required. Corpse, Epic Knights and ewewukek's Musket Mod remain optional.

            Validation: clean Java 17 Forge build, 227 passing regression tests, zero failures/errors/skipped. Exact tested reobfuscated artifact. No interactive Minecraft playtest. No in-game visual or long-session performance playtest was performed. Beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.11.7', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.11.7 beta: {result['url']}\n")
          RECEIPT
