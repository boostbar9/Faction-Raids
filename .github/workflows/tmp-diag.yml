name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  actions: read
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/diag-native-qa
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12092481194
          run-id: 39009005776
          github-token: ${{ github.token }}
          path: qa
      - run: |
          set +e
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('qa').rglob('result.json'):
              d=json.loads(p.read_text())
              for key in ('blockerDiagnostics','finalDiagnostics','diagnosticFailure','failure'):
                  if key not in d: continue
                  v=d[key]
                  if isinstance(v,dict): v={k:x for k,x in v.items() if k in ('pathNodes','builderPosition','nativeTarget','pathTarget','selfClearanceTarget','inventorySlots')}
                  t=json.dumps(v)
                  for i in range(0,min(len(t),9000),950): print(f"::error title={key}{i}::{t[i:i+950]}")
          PY
