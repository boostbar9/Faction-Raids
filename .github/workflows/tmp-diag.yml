name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marker-site-cover
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set +e
          ./gradlew clean build --console=plain > out.txt 2>&1
          echo "exit $?"
          python3 - <<'PY2'
          lines=open('out.txt').read().splitlines()
          start=next((i for i,l in enumerate(lines) if 'Task :compileJava' in l),0)
          body='\n'.join(l for l in lines[start:] if l.strip() and 'Running' not in l)
          chunks=[body[i:i+900] for i in range(0,min(len(body),8000),900)]
          for n,c in enumerate(chunks): print(f"::error title=c{n}::"+c.replace('\n',' %0A '))
          PY2
