name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  actions: read
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/diag-native-qa
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12092481194
          run-id: 39009005776
          github-token: ${{ github.token }}
          path: qa
      - run: |
          mkdir -p out
          find qa -type f | sed 's/^/FILE /' > out/files.txt
          for f in $(find qa -name '*.log'); do
            grep -nE "Native territory perimeter QA|WARN|ERROR|Paused|Waiting|Exception" "$f" | grep -v "ResourceLocation\|netty\|setAccessible\|Reflection" | tail -150 > "out/$(basename $f).tail.txt" || true
          done
          find qa -name 'result.json' -exec cp {} out/ \;
          git config user.name diag-bot; git config user.email diag@example.invalid
          git add out && git commit -qm "diag out" && git push -q origin HEAD:tmp/diag-native-qa
