name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12093698477
          run-id: 39013629984
          github-token: ${{ github.token }}
          path: qa
      - run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for p in pathlib.Path('qa').rglob('*.xml'):
              try: root=ET.parse(p).getroot()
              except Exception: continue
              for tc in root.iter('testcase'):
                  for f in list(tc.findall('failure'))+list(tc.findall('error')):
                      msg=(f.get('message') or '')[:300].replace('\n',' ')
                      where=[l.strip() for l in (f.text or '').splitlines() if 'devfarinsky' in l][:4]
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::{msg} | {' | '.join(where)}"[:900])
          PY
