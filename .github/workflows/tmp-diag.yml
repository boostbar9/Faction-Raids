name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marker-site-cover
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set +e
          ./gradlew clean build --console=plain > out.txt 2>&1
          echo "exit $?"
          grep -nE "error:|warning: \[|FAILED|What went wrong|Exception|expected:|> " out.txt | head -60 | while IFS= read -r l; do echo "::error title=log::${l:0:900}"; done
          tail -40 out.txt
