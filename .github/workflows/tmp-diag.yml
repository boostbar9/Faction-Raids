name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12092787478
          run-id: 39010539674
          github-token: ${{ github.token }}
          path: qa
      - run: |
          set +e
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('qa').rglob('*.json'):
              d=json.loads(p.read_text())
              if not isinstance(d,dict): continue
              short={k:v for k,v in d.items() if not isinstance(v,(list,dict))}
              t=p.name+' '+json.dumps(short)
              for i in range(0,min(len(t),4000),900): print(f"::error title=r{i}::{t[i:i+900]}")
          PY
