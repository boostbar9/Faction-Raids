name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12089577489
          run-id: 39002843407
          github-token: ${{ github.token }}
          path: qa
      - run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          n=0
          for p in pathlib.Path('qa').rglob('TEST-*.xml'):
              s=ET.parse(p).getroot()
              for c in s.findall('testcase'):
                  for kind in ('failure','error'):
                      f=c.find(kind)
                      if f is not None and n<30:
                          n+=1
                          msg=(f.get('message') or '')[:300].replace('\n',' ')
                          body=(f.text or '').strip().splitlines()
                          trace=' | '.join(l.strip() for l in body[:12])[:900]
                          print(f"::error title={c.get('classname')}.{c.get('name')}::{msg} || {trace}")
          print('failures', n)
          PY
