name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/jobs/117324486991/logs > job.txt
          grep -nE "error:|warning: \[|FAILED|AssertionFailed|Exception|tests completed|\.java:[0-9]+: " job.txt | head -60 | while IFS= read -r l; do echo "::error title=build::${l:0:450}"; done
