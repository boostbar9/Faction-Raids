name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  actions: read
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12094173483
          run-id: 39013630734
          github-token: ${{ github.token }}
          path: qa
      - run: |
          set +e
          python3 - <<'PY'
          import json, pathlib
          for p in pathlib.Path('qa').rglob('result.json'):
              d=json.loads(p.read_text())
              print("::error title=failure::"+str(d.get('failure'))[:900])
              v=d.get('blockerDiagnostics') or {}
              t=json.dumps({k:x for k,x in v.items() if k not in ('footprintEntities','treasuryObservation','missingTargets','inventorySlots')})
              for i in range(0,min(len(t),9000),900): print(f"::error title=b{i}::{t[i:i+900]}")
          PY
          for f in $(find qa -name '*.log'); do grep -o '"placed":[0-9]*' "$f" | awk 'NR%15==1' | tr '\n' ' ' | sed 's/^/::warning title=progress::/'; echo; done
