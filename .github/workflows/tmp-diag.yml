name: Temporary QA diagnostics
on:
  push:
    branches: [tmp/diag-native-qa]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/marker-site-cover
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set +e
          ./gradlew clean build --console=plain > out.txt 2>&1
          echo "exit $?"
          python3 - <<'PY2'
          lines=open('out.txt').read().splitlines()
          keep=[]
          for i,l in enumerate(lines):
              if ' error:' in l or 'What went wrong' in l or 'FAILED' in l or 'Test ' in l and 'FAIL' in l: keep.extend(lines[i:i+6])
          body='\n'.join(keep) or '\n'.join(lines[-60:])
          chunks=[body[i:i+900] for i in range(0,min(len(body),8000),900)]
          for n,c in enumerate(chunks): print(f"::error title=c{n}::"+c.replace('\n',' %0A '))
          PY2
