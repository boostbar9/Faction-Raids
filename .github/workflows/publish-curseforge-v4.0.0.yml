name: Publish tested 4.0.0 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.0.0]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.0.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34174715936
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.0.0.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'd9d4517bf74b91bc45720cb612087bba1149c18fd070e6ad98bce712505a4913'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.0.0'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.0.0.jar
          name: The Siege Overhaul v4.0.0 beta - Siege Core and Army Muster
          version: v4.0.0
          version-type: beta
          changelog: |
            ## 4.0.0 beta - Siege Core and Army Muster

            New sieges target a player-placed Siege Core in the faction's Villager Recruits Overworld claim. Players receive a core on their next login; replacements can be crafted from eight iron ingots around an emerald block. One placed core per faction. Beds no longer select new raid targets.

            Right-click the core for three shared faction hire offers. Each slot rolls 80% recruit, 10% shieldman or 10% archer, refreshing every 15 minutes of server runtime. Each offer can be hired once per rotation. Native hiring prices, currency and unit limits apply. Breaking/replacing a core or restarting the server does not reset stock.

            Default preparation lasts 12 minutes: four establishing the camp, four fortifying a timber palisade with supplied native Workers jobs, and four mustering the first wave in formation. Then the army attacks. Configure siegePreparationMinutes to change the duration. Workers still sleep at night and interrupted jobs can leave incomplete structures.

            Completed builders stay visible at camp. Native ballista and catapult operators receive ammunition after preparation; defeated operators are not replaced. Legacy automatic ram/tower settings select ballistae because native AI operators are unavailable for those vehicles. Raider catapults do not cause untracked terrain explosions.

            The core is an occupation objective, not a block-health system. It cannot move during a siege. Losing its claim or forcibly removing it ends the siege without rewards. Existing active raids keep their saved objective and phase. No safe camp site means no camp structures or equipment; the siege announces that limitation.

            REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Minecraft 1.20.1 Forge, Java 17. Match Siege Overhaul versions on all clients and the server.

            Validation: Java 17 clean build and all 59 regression tests passed. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.0.0', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.0.0 beta: {result['url']}\n")
          RECEIPT
