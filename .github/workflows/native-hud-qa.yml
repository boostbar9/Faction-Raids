name: Native HUD QA

# Explicitly opt-in real client rendering; no release or repository mutation.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: native-hud-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-hud-client:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'native-hud-qa'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Check out exact integrated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install virtual display and software OpenGL from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Prepare fresh isolated HUD instance
        run: |
          set -euo pipefail
          test ! -e build/native-hud-qa/client
          test ! -e build/native-hud-qa/evidence
          python3 -B -m unittest discover -s scripts/tests -p 'test_prepare_native_client_defaults.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_native_hud_qa.py'
          python3 scripts/prepare-native-client-defaults.py --mode hud --smallships-version 2.0.0-b1.4
          mkdir -p build/native-hud-qa/evidence
          cp build/native-hud-qa/client/.native-smallships-defaults.json build/native-hud-qa/evidence/smallships-default-config-provenance.json
          printf 'onboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nmaxFps:30\nvsync:false\n' > build/native-hud-qa/client/options.txt
          git rev-parse HEAD > build/native-hud-qa/evidence/source-commit.txt
          java -version 2> build/native-hud-qa/evidence/java-version.txt
      - name: Compile and warm the exact native runtime online
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 20m ./gradlew --no-daemon --console=plain --max-workers=2 -PnativeQa=true -PnativeQaMode=hud prepareNativeQaClient 2>&1 | tee build/native-hud-qa/evidence/preparation-console.log
      - name: Run actual HUD pages, native previews and input checks offline
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' bash -c '
            set -euo pipefail
            glxinfo -B | tee build/native-hud-qa/evidence/opengl.txt
            timeout --signal=TERM --kill-after=10s 10m ./gradlew --offline --no-daemon --console=plain --max-workers=2 -PnativeQa=true -PnativeQaMode=hud runClient 2>&1 | tee build/native-hud-qa/evidence/client-console.log
          '
      - name: Verify exact HUD framebuffer and interaction contract
        run: python3 scripts/verify-native-hud.py
      - name: Collect diagnostic logs without worlds or vendor JARs
        if: always()
        run: |
          mkdir -p build/native-hud-qa/evidence/logs
          if [ -d build/native-hud-qa/client/logs ]; then
            find build/native-hud-qa/client/logs -maxdepth 1 -type f -name '*.log' -exec cp {} build/native-hud-qa/evidence/logs/ \;
          fi
          if [ -d build/native-hud-qa/client/crash-reports ]; then
            cp -R build/native-hud-qa/client/crash-reports build/native-hud-qa/evidence/
          fi
      - name: Upload actual framebuffers and diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-hud-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-hud-qa/evidence/
          if-no-files-found: error
          retention-days: 7
