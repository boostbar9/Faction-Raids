          """Bind the full native evidence bytes and replay exact bounded receipt contracts.

          All validator sources below are embedded local copies, never fetched or executed
          from an artifact. Remote source identity is checked separately before download.
          """
          import hashlib
          import json
          import os
          from pathlib import Path
          import re


          def evidence_manifest(root):
              assert root.is_dir() and not root.is_symlink(), str(root)
              entries = []
              for path in sorted(root.rglob('*')):
                  assert not path.is_symlink(), 'Evidence symlink: ' + str(path)
                  if path.is_dir():
                      continue
                  assert path.is_file(), 'Unexpected evidence entry: ' + str(path)
                  raw = path.read_bytes()
                  entries.append({'path': path.relative_to(root).as_posix(), 'size': len(raw),
                                  'sha256': hashlib.sha256(raw).hexdigest()})
              assert entries, 'Empty native evidence'
              digest = hashlib.sha256(json.dumps(entries, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              return digest, entries


          def validator(text, name):
              namespace = {'__name__': 'embedded_' + name}
              exec(compile(text, '<reviewed-' + name + '-validator>', 'exec'), namespace)
              return namespace['verify']

          HUD_SOURCE = '#!/usr/bin/env python3\n"""Fail closed on incomplete actual HUD framebuffer/interaction receipts (stdlib only)."""\nimport json\nfrom pathlib import Path\nimport struct\nimport sys\n\n\nPAGES = [\'army\', \'loot\', \'treasury\', \'territory\', \'building\', \'civilians\', \'intel\']\nPLANS = [\'barricade\', \'watchtower\', \'gatehouse\', \'wall\', \'corner\', \'stairs\']\nMATRICES = [\'compact-scale2\', \'compact-scale3\', \'roomy-scale2\', \'roomy-scale1\']\nSTATES = [\'army-unavailable\', \'treasury-empty\', \'construction-loading\', \'construction-empty\',\n          \'civilians-capacity\', \'loot-confirmation\', \'intel-keyboard-e\', \'intel-no-results\',\n          \'intel-scrolled\', \'intel-keyboard-focus\', \'codex-core\', \'codex-how-to-play\',\n          \'codex-journal\', \'settings\', \'settings-no-results\', \'settings-scrolled\', \'hero-visuals\', \'native-inspection\']\n\n\ndef expected_screenshots():\n    names = []\n    for prefix in MATRICES:\n        names.extend(f\'{prefix}-{page}.png\' for page in PAGES)\n        names.extend(f\'{prefix}-{section}.png\' for section in [\n            \'building-structures\', \'building-construction\', \'intel-enemy-lore\', \'intel-how-to-play\'])\n        names.extend(f\'{prefix}-plan-{plan}.png\' for plan in PLANS)\n    for prefix in MATRICES[:2]:\n        names.extend(f\'{prefix}-{state}.png\' for state in STATES)\n    names.extend([\'roomy-scale1-native-inspection.png\', \'resized-intel-preserved.png\'])\n    return set(names)\n\n\ndef verify(root):\n    data = json.loads((root / \'result.json\').read_text())\n    assert data[\'mode\'] == \'hud\' and data[\'status\'] == \'passed\', data.get(\'failure\', data)\n    assert data[\'completedSteps\'] == data[\'plannedSteps\'] and data[\'plannedSteps\'] > 100\n    assert len(data[\'assertions\']) >= 25, data[\'assertions\']\n    versions = {\'minecraft\': \'1.20.1\', \'forge\': \'47.4.16\', \'workers\': \'2.0.3\',\n                \'recruits\': \'1.15.2\', \'smallships\': \'2.0.0-b1.4\', \'siegeweapons\': \'0.2.5\'}\n    for mod, version in versions.items():\n        assert data[\'loadedModVersions\'][mod] == version, mod\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        artifact = data[\'loadedCompanionArtifacts\'][mod]\n        assert len(artifact[\'sha256\']) == 64 and \'remapped\' in artifact[\'kind\'], mod\n    assert data[\'notCovered\'] and \'client-menu\' in data[\'coverage\']\n    expected = expected_screenshots()\n    assert len(data[\'screenshots\']) == len(expected) and set(data[\'screenshots\']) == expected, (\n        \'Missing\', sorted(expected - set(data[\'screenshots\'])), \'Extra\', sorted(set(data[\'screenshots\']) - expected))\n    views = {view[\'screenshot\']: view for view in data[\'views\']}\n    assert len(views) == len(expected) and set(views) == expected\n    for name in sorted(expected):\n        raw = (root / name).read_bytes()\n        assert raw.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and raw[12:16] == b\'IHDR\' and len(raw) > 4096, name\n        width, height = struct.unpack(\'>II\', raw[16:24])\n        view = views[name]\n        viewport = view[\'viewport\']\n        size = (1440, 960) if name.startswith(\'roomy-\') else (960, 720)\n        scale = 1 if name.startswith(\'roomy-scale1\') else 3 if \'scale3\' in name or name.startswith(\'resized-\') else 2\n        assert (width, height) == size == (viewport[\'framebufferWidth\'], viewport[\'framebufferHeight\']), name\n        assert (viewport[\'guiWidth\'], viewport[\'guiHeight\']) == (width // scale, height // scale), name\n        assert viewport[\'requestedGuiScale\'] == scale and view[\'nonblankSamples\'] > 50, name\n        assert view[\'fixture\'] and view[\'widgets\'], name\n        for widget in view[\'widgets\']:\n            assert 0 <= widget[\'x\'] < viewport[\'guiWidth\'] and 0 <= widget[\'y\'] < viewport[\'guiHeight\'], (name, widget)\n            assert widget[\'width\'] > 0 and widget[\'height\'] > 0, (name, widget)\n            assert widget[\'x\'] + widget[\'width\'] <= viewport[\'guiWidth\'] + .1, (name, widget)\n            assert widget[\'y\'] + widget[\'height\'] <= viewport[\'guiHeight\'] + .1, (name, widget)\n            assert not widget[\'focused\'] or widget[\'active\'], (name, widget)\n        for i, a in enumerate(view[\'widgets\']):\n            for b in view[\'widgets\'][i + 1:]:\n                assert (a[\'x\'] >= b[\'x\'] + b[\'width\'] or b[\'x\'] >= a[\'x\'] + a[\'width\']\n                        or a[\'y\'] >= b[\'y\'] + b[\'height\'] or b[\'y\'] >= a[\'y\'] + a[\'height\']), (name, a, b)\n        if name in {f\'{prefix}-army.png\' for prefix in MATRICES}:\n            assert len(view[\'nativePortraits\']) == 4, name\n            assert all(value.startswith(\'com.talhanation.\') for value in view[\'nativePortraits\']), name\n        if name.endswith(\'-territory.png\'):\n            assert view[\'territoryAvailability\'] == {\'ownershipMask\': 5, \'active\': 1, \'retained\': 1, \'unavailableButtons\': 2}, name\n            unavailable = [widget for widget in view[\'widgets\'] if widget[\'label\'] == \'Unavailable\']\n            assert len(unavailable) == 2 and all(not widget[\'active\'] for widget in unavailable), name\n        if \'-plan-\' in name:\n            assert view[\'selectedPlan\'].lower() == name.removesuffix(\'.png\').split(\'-plan-\')[1], name\n            cards = view[\'nativeBlueprintCards\']\n            assert any(card[\'plan\'] == view[\'selectedPlan\'] for card in cards), name\n            assert all(card[\'sourceBlueprintMatches\'] and card[\'blockModels\'] > 0 and card[\'caption\'] for card in cards), name\n        if \'native-inspection\' in name:\n            assert view[\'nativeStructurePreviewCount\'] == 1, name\n    required = [\'Native OS E key\', \'Native Ctrl+Tab\', \'Native Ctrl+Shift+Tab\', \'Native Escape\',\n                \'Actual 1440x960 to 960x720\', \'Hired, unavailable, insufficient\', \'without a purchase\',\n                \'Codex Journal\', \'focus across sync\', \'Settings empty-filter\']\n    for phrase in required:\n        assert any(phrase in assertion for assertion in data[\'assertions\']), phrase\n    source = (root / \'source-commit.txt\').read_text().strip()\n    assert len(source) == 40 and all(char in \'0123456789abcdef\' for char in source), source\n    print(f\'Verified {len(expected)} actual HUD framebuffers and bounded interaction receipts. Visual review remains required.\')\n    return data\n\n\nif __name__ == \'__main__\':\n    verify(Path(sys.argv[1] if len(sys.argv) > 1 else \'build/native-hud-qa/evidence\'))\n'

          ECONOMY_SOURCE = '#!/usr/bin/env python3\n"""Fail-closed checks for the bounded real-server economy receipt in Native Building QA."""\nimport json\nfrom pathlib import Path\nimport sys\nimport uuid\n\n\ndef verify(data):\n    gameplay = data[\'gameplay\']\n    assert data[\'status\'] == gameplay[\'status\'] == \'passed\', data\n    assert gameplay[\'manualTreasuryDebit\'] == 8 and gameplay[\'manualPaidTreasury\'] == 992, gameplay\n    assert gameplay[\'perimeterTreasuryDebit\'] == 64, gameplay\n    assert gameplay[\'completedManualRestart\'][\'treasury\'] == 992, gameplay\n    economy = gameplay[\'economy\']\n    assert economy[\'status\'] == \'passed\', economy\n    assert \'Controlled cleared-wave states\' in economy[\'scope\'], economy\n    assert \'production processRaid\' in economy[\'scope\'] and \'No raid combat was fought.\' in economy[\'scope\'], economy\n    territory = economy[\'territory\']\n    assert territory[\'unownedRejected\'] == territory[\'ownedRejected\'] == [0, 1], territory\n    assert territory[\'unavailableTreasuryDebit\'] == 0 and territory[\'personalInventoryUnchanged\'] is True, territory\n    assert territory[\'fixtureFunding\'] == 1500 and territory[\'workingPrices\'] == [900, 600], territory\n    assert territory[\'savedOwnershipMask\'] == 15 and territory[\'activeCount\'] == territory[\'retainedCount\'] == 2, territory\n    practice = economy[\'practice\']\n    assert practice == {\'wave\': 5, \'handlerPasses\': 2, \'boxes\': 0, \'treasuryDebitOrCredit\': 0}, practice\n    checkpoint = economy[\'checkpoint\']\n    assert checkpoint[\'wave\'] == 5 and checkpoint[\'boxes\'] == 1, checkpoint\n    assert checkpoint[\'beforeAnyBallot\'] is True and checkpoint[\'waitReplayNoDuplicate\'] is True, checkpoint\n    assert type(checkpoint[\'rolledTier\']) is int and 0 <= checkpoint[\'rolledTier\'] <= 3, checkpoint\n    assert type(checkpoint[\'treasuryReward\']) is int and checkpoint[\'treasuryReward\'] >= 0, checkpoint\n    assert checkpoint[\'treasury\'] == 992 + checkpoint[\'treasuryReward\'], checkpoint\n    reload = economy[\'diskReload\']\n    assert reload[\'ownershipMask\'] == 15 and reload[\'activeCount\'] == reload[\'retainedCount\'] == 2, reload\n    for field in [\'newSavedDataAndRaidInstances\', \'exactPlayerInventory\', \'exactCurrentWaveReceipt\', \'replayNoDuplicate\']:\n        assert reload[field] is True, (field, reload)\n    full = economy[\'fullInventory\']\n    assert full[\'wave\'] == 6 and full[\'filledMainSlots\'] == 36, full\n    assert full[\'droppedBoxes\'] == 1 and full[\'inventoryBoxes\'] == 0 and full[\'replayNoDuplicate\'] is True, full\n    assert type(full[\'rolledTier\']) is int and 0 <= full[\'rolledTier\'] <= 3, full\n    assert full[\'item\'] == \'siegeoverhaul:loot_box_\' + [\'common\', \'uncommon\', \'rare\', \'epic\'][full[\'rolledTier\']], full\n    assert str(uuid.UUID(full[\'dropEntity\'])) == full[\'dropEntity\'], full\n    return economy\n\n\nif __name__ == \'__main__\':\n    verify(json.loads(Path(sys.argv[1]).read_text()))\n    print(\'Native economy receipt passed: controlled cleared-wave server cases, not a fought raid.\')\n'

          BUILDING_SOURCE = '"""Offline replay of native-building-qa.yml receipt contract; original runtime-only filesystem assertions remain required in the source workflow."""\n\ndef verify(root):\n    import json, struct\n    from pathlib import Path\n    data = json.loads((root / \'result.json\').read_text())\n    audit = json.loads((root / \'native-bytecode-audit.json\').read_text())\n    assert audit[\'status\'] == \'passed\' and audit[\'noVendorJarsUploaded\'], audit\n    assert sum(len(v[\'classes\']) for v in audit[\'artifacts\'].values()) == 18, audit\n    assert data[\'status\'] == \'passed\', data\n    viewport = data[\'viewportSetup\']\n    assert viewport[\'framebufferWidth\'] == viewport[\'windowWidth\'] == 960, viewport\n    assert viewport[\'framebufferHeight\'] == viewport[\'windowHeight\'] == 720, viewport\n    for name in [\'nativeInspectionScale3\', \'buildingScale3\']:\n        compact = data[\'guiScaleEvidence\'][name]\n        assert compact[\'framebufferWidth\'] == 960 and compact[\'framebufferHeight\'] == 720, compact\n        assert compact[\'requestedGuiScale\'] == 3 and compact[\'guiWidth\'] == 320 and compact[\'guiHeight\'] == 240, compact\n    assert data[\'gameplay\'][\'status\'] == \'passed\', data.get(\'gameplay\')\n    gameplay = data[\'gameplay\']\n    assert gameplay[\'completedManualBlocks\'] == 83 and data[\'perimeterTemplateBlocks\'] == 572, data\n    assert gameplay[\'manualHollowGeometry\'] == {\'targets\': 83, \'cobblestone\': 58, \'oakPlanks\': 25,\n        \'cavityCells\': 27, \'cavityReservedAtAcceptance\': True, \'airPlacementTargets\': 0}, gameplay\n    assert gameplay[\'cavityObstructionPaused\'] and gameplay[\'cavityObstructionRestartVerified\'], gameplay\n    assert gameplay[\'nativeDeckOverCavityVerified\'] and gameplay[\'finalCavityAirCells\'] == 27, gameplay\n    assert gameplay[\'unchangedCavityFootingColumns\'] == 9, gameplay\n    completed = gameplay[\'completedManualRestart\']\n    assert completed[\'verified\'] and completed[\'preAiExactInventoryValues\'] and completed[\'preAiEqualSplitMirror\'], completed\n    assert completed[\'singleValuePreservingRebind\'] and completed[\'constructionDetached\'] and completed[\'reservationRetired\'], completed\n    assert completed[\'placedBlocks\'] == 83 and completed[\'cavityAirCells\'] == 27, completed\n    projection = data[\'gameplay\'][\'perimeterProjection\']\n    assert projection[\'alwaysShownThreshold\'] == 1024 and projection[\'activeTargets\'] > 0, projection\n    assert projection[\'defaultAlwaysShown\'] == (projection[\'activeTargets\'] <= 1024), projection\n    assert projection[\'wholeTargets\'] >= projection[\'activeTargets\'], projection\n    assert data[\'gameplay\'][\'authenticatedProjectionHide\'] and data[\'gameplay\'][\'authenticatedProjectionShow\'], data\n    canceled = data[\'gameplay\'][\'canceledWholePerimeter\']\n    assert canceled[\'globalTargets\'] == projection[\'wholeTargets\'] and canceled[\'stageCount\'] >= 1 and canceled[\'treasury\'] == 1936, canceled\n    expected = [\n        \'01-marker-focused.png\', \'02-native-inspection-scale2.png\',\n        \'03-native-inspection-scale3.png\', \'04-projection-unfocused.png\',\n        \'05-projection-focus-only.png\', \'06-projection-marker-behind-camera.png\',\n        \'07-marker-occluded.png\', \'08-marker-after-world-reload.png\',\n        \'09-building-auto-perimeter.png\', \'10-building-place-structure.png\',\n        \'11-building-construction.png\', \'12-building-construction-compact.png\',\n        \'13-native-perimeter-template.png\',\n        \'14-production-free-perimeter-review.png\', \'15-production-paid-native-marker.png\',\n        \'16-live-core-building-auto.png\', \'17-live-core-construction.png\',\n        \'18-completed-manual-wall-and-builder.png\',\n    ]\n    assert data[\'screenshots\'] == expected, data[\'screenshots\']\n    for name in expected:\n        content = (root / name).read_bytes()\n        assert content.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(content) > 4096, name\n        assert struct.unpack(\'>II\', content[16:24]) == (960, 720), name\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert mod in data[\'loadedModVersions\'], mod\n        artifact = data[\'loadedCompanionArtifacts\'][mod]\n        assert len(artifact[\'sha256\']) == 64, artifact\n    assert data[\'loadedModVersions\'][\'minecraft\'] == \'1.20.1\', data\n    assert data[\'loadedModVersions\'][\'forge\'] == \'47.4.16\', data\n    print(\'Actual native-client fixture passed. See screenshots for visual review and result.json for exclusions.\')\n    return data\n'

          SERVER_SOURCE = '"""Offline replay of native-building-server-qa.yml receipt contract; original runtime-only filesystem assertions remain required in the source workflow."""\n\ndef verify(root):\n    import json\n    from pathlib import Path\n    data = json.loads((root / \'result.json\').read_text())\n    assert data[\'status\'] == \'passed\', data\n    assert data[\'testsExecuted\'] == 1, data\n    assert data[\'physicalDistribution\'] == \'DEDICATED_SERVER\', data\n    assert data[\'logicalSide\'] == \'SERVER\', data\n    assert data[\'serverClass\'] == \'net.minecraft.gametest.framework.GameTestServer\', data\n    assert data[\'connectedPlayers\'] == 0, data\n    assert data[\'fixtureActor\'] == \'net.minecraftforge.common.util.FakePlayer; no authenticated network client\', data\n    assert \'real multiplayer connection/authentication remains unverified\' in data[\'limitation\'], data\n    expected = [\n        \'physical-dedicated-classloading\',\n        \'real-native-factories-and-queues\',\n        \'sealed-native-packets-and-move-overloads\',\n        \'native-nbt-roundtrip-and-defensive-copies\',\n        \'unloaded-blueprint-remains-unloaded\',\n        \'clearance-and-world-saveddata-disk-roundtrip\',\n        \'fakeplayer-direct-handler-authorization-and-cancel\',\n        \'offline-native-inventory-authority-and-loss-recovery\',\n    ]\n    assert data[\'checks\'] == expected, data\n    console = (root / \'server-console.log\').read_text()\n    assert console.count(\'SIEGE_NATIVE_SERVER_QA_COMPLETED tests=1 checks=8\') == 1, console[-5000:]\n    authority = data[\'inventoryAuthority\']\n    assert authority[\'ownerConnected\'] is False, authority\n    assert authority[\'profileCacheSource\'] == \'Explicit isolated GameProfileCache dependency; GameTest server cache remains absent\', authority\n    assert \'cached UUID identity\' in authority[\'productionEntryWithoutProfileCache\'], authority\n    assert authority[\'profileRepositoryLookups\'] == 0, authority\n    assert authority[\'coreAnchorDiskRoundTrip\'] == \'passed\', authority\n    assert authority[\'scoreboardDiskRoundTrip\'] == \'passed\', authority\n    assert authority[\'nativeRosterMembersBeforeDisk\'] == 1, authority\n    assert authority[\'nativeRosterMembersAfterDisk\'] == 0, authority\n    for allowed in [\'offline-native-owner-valid\', \'native-manager-disk-reload-valid\', \'membership-restored\',\n                    \'native-roster-name-restored\', \'native-roster-uuid-restored\', \'identity-conflicts-restored\',\n                    \'scoreboard-restored\', \'worker-owner-restored\', \'source-claim-restored\',\n                    \'original-core-restored\', \'valid-context-restored\']:\n        assert authority[\'outcomes\'][allowed] == \'allowed\', (allowed, authority)\n    for denied in [\'removed-native-member\', \'stale-native-roster-name\', \'conflicting-native-roster-uuid\',\n                   \'stale-cached-profile-name\', \'scoreboard-transferred\', \'worker-owner-transferred\',\n                   \'foreign-source-claim\', \'unloaded-source-denied\', \'original-core-lost\', \'original-anchor-lost\']:\n        assert authority[\'outcomes\'][denied].startswith(\'Paused:\'), (denied, authority)\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert mod in data[\'loadedModVersions\'], mod\n        assert len(data[\'loadedCompanionArtifacts\'][mod][\'sha256\']) == 64, mod\n    for mod, version in {\'minecraft\': \'1.20.1\', \'forge\': \'47.4.16\', \'workers\': \'2.0.3\', \'recruits\': \'1.15.2\'}.items():\n        assert data[\'loadedModVersions\'][mod] == version, data\n    print(\'Required Forge GameTest passed on the physical dedicated distribution. Real multiplayer remains unverified.\')\n    return data\n'

          CAMP_SOURCE = '"""Exact offline replay of the native-camp-qa.yml receipt contract."""\n\ndef verify(root):\n    import json\n    from pathlib import Path\n    data = json.loads((root / \'result.json\').read_text())\n    assert data[\'mode\'] == \'camp-spawn\' and data[\'status\'] == \'passed\', data\n    audit = json.loads((root / \'native-bytecode-audit.json\').read_text())\n    assert audit[\'status\'] == \'passed\' and audit[\'noVendorJarsUploaded\'], audit\n    assert sum(len(v[\'classes\']) for v in audit[\'artifacts\'].values()) == 18, audit\n    versions = data[\'loadedModVersions\']\n    for mod, version in {\'minecraft\': \'1.20.1\', \'forge\': \'47.4.16\', \'workers\': \'2.0.3\',\n                         \'recruits\': \'1.15.2\', \'smallships\': \'2.0.0-b1.4\', \'siegeweapons\': \'0.2.5\'}.items():\n        assert versions[mod] == version, versions\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert len(data[\'loadedCompanionArtifacts\'][mod][\'sha256\']) == 64, mod\n    scenarios = data[\'scenarios\']\n    assert len(scenarios) == 3, scenarios\n    assert [case[\'scenario\'] for case in scenarios] == [\'natural-flat\', \'controlled-shallow-water-forest\', \'controlled-rocky-water-forest\']\n    for index, case in enumerate(scenarios):\n        assert case[\'status\'] == \'passed\' and case[\'nativeClaimChunks\'] == 25, case\n        capture = case[\'framebufferCapture\']\n        assert all(capture[key] for key in [\'worldReady\', \'observerReady\', \'coreReceived\', \'terrainCompiled\', \'cameraReady\']), capture\n        assert 0 <= capture[\'elapsedSeconds\'] < 30 and capture[\'changedPixelSamples\'] > 50, capture\n        assert capture[\'framebufferAttempts\'] > capture[\'blankFrames\'], capture\n        assert case[\'terraformFallback\'] == bool(index) and case[\'crewStarted\'], case\n        assert case[\'enemyCore\'] and case[\'claimId\'] != \'null\', case\n        assert case[\'workers\'] and case[\'guards\'], case\n        assert len(case[\'guards\']) == case[\'registeredGuardRoleCount\'], case\n        assert case[\'ordinaryTicksSinceEstablishment\'] >= 60, case\n        assert case[\'unregisteredGuardRoles\'] == [\'assassin\'], case\n        recovered = [guard for guard in case[\'guards\'] if guard[\'type\'] == \'recruits:scout\' and guard[\'scoutSpawnTailRecovered\']]\n        assert len(recovered) == 2 and len(case[\'guards\']) == 5, case\n        for unit in case[\'workers\'] + case[\'guards\']:\n            assert not unit[\'noAi\'] and unit[\'faction\'] == case[\'expectedEnemyFaction\'], unit\n        assert case[\'nativeJobOwnershipVerified\'] and case[\'nativeJobOwner\'] != case[\'guardOwner\'], case\n        assert case[\'nativeWorkAreaAccessVerified\'] and case[\'nativeBuilderStorageEnabled\'], case\n        for worker in case[\'workers\']:\n            assert worker[\'owner\'] == case[\'nativeJobOwner\'] and worker[\'owned\'] and not worker[\'listening\'], worker\n        for guard in case[\'guards\']:\n            assert guard[\'owner\'] == case[\'guardOwner\'] == \'fac10000-4a1d-4e75-8a1d-000000000001\', guard\n        assert all(case[\'nativeJobAreas\'][key] == case[\'nativeJobOwner\']\n                   for key in [\'buildOwner\', \'storageOwner\', \'supplyOwner\']), case\n        assert all(unit[\'type\'].startswith(\'recruits:\') for unit in case[\'guards\']), case\n        assert case[\'protectedCellCount\'] >= 6144 and case[\'protectedChests\'] >= 2, case\n        assert case[\'entry\'].startswith(\'Actual non-op client /siegeoverhaul start\'), case\n    hostile = scenarios[1][\'controlledHostileTerrain\']\n    assert hostile[\'waterDepth\'] == 3 and hostile[\'dryLandingWidth\'] == 3 and hostile[\'fixtureWrites\'] < 300\n    assert scenarios[1][\'hostileTerrainPrepared\'], scenarios[1]\n    assert all(scenarios[1][\'recordedOriginalTerrainCounts\'][block] > 0\n               for block in [\'minecraft:water\', \'minecraft:oak_log\', \'minecraft:oak_leaves\']), scenarios[1]\n    rocky = scenarios[2]\n    assert rocky[\'controlledHostileTerrain\'][\'rockyRise\'] and rocky[\'controlledHostileTerrain\'][\'fixtureWrites\'] < 300, rocky\n    assert rocky[\'raisedCampPlane\'] and rocky[\'unchangedRockSupportVerified\'], rocky\n    assert rocky[\'campPlaneAboveOriginalSurface\'] == 1 and rocky[\'protectedCellCount\'] >= 6147, rocky\n    assert all(rocky[\'recordedOriginalTerrainCounts\'][block] > 0\n               for block in [\'minecraft:water\', \'minecraft:oak_log\', \'minecraft:oak_leaves\']), rocky\n    expected = [\'01-established-flat-camp.png\', \'02-established-shallow-water-forest-camp.png\', \'03-established-rocky-water-forest-camp.png\']\n    assert data[\'screenshots\'] == expected, data[\'screenshots\']\n    for name in expected:\n        content = (root / name).read_bytes()\n        assert content.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(content) > 4096, name\n    print(\'All three actual camp-establishment scenarios passed. Review raw framebuffers and bounded fixture coverage.\')\n    return data\n\n# Publisher-only strict shape overlay. Source verifier above remains unchanged.\nverify_source_receipt = verify\n\n"""Publisher-only complete typed Camp Spawn receipt check; source verifier stays unchanged."""\nfrom collections import Counter\nimport hashlib\nimport json\nimport math\nimport re\nimport uuid\n\nCAMP_SHOTS=[\'01-established-flat-camp.png\',\'02-established-shallow-water-forest-camp.png\',\'03-established-rocky-water-forest-camp.png\']\nCAMP_SCENARIOS=[\'natural-flat\',\'controlled-shallow-water-forest\',\'controlled-rocky-water-forest\']\nCAMP_ROLES=[\'bowman\',\'scout\',\'crossbowman\',\'bowman\',\'scout\',\'assassin\']\nCAMP_AUDIT_CLASSES={\n \'recruits\': [\'com.talhanation.recruits.\'+v for v in [\'entities.ai.RecruitUpkeepPosGoal\',\'entities.ai.RecruitUpkeepEntityGoal\',\'entities.AbstractRecruitEntity\',\'entities.AbstractInventoryEntity\',\'inventory.RecruitSimpleContainer\',\'world.RecruitsClaimManager\',\'world.RecruitsClaim\',\'entities.ScoutEntity\',\'entities.BowmanEntity\',\'entities.ai.navigation.RecruitPathNavigation\',\'pathfinding.AsyncGroundPathNavigation\',\'init.ModEntityTypes\']],\n \'workers\':[\'com.talhanation.workers.\'+v for v in [\'entities.ai.GetNeededItemsFromStorage\',\'entities.ai.DepositItemsToStorage\',\'entities.ai.RecruitStorageUpkeepGoal\',\'entities.ai.AbstractChestGoal\',\'entities.ai.BuilderWorkGoal\',\'entities.AbstractWorkerEntity\']]}\n\n\ndef camp_load(path):\n    def pairs(items):\n        value={}\n        for key,child in items:\n            assert key not in value, (\'duplicate JSON field\',key)\n            value[key]=child\n        return value\n    def reject(value):raise AssertionError(\'Non-finite JSON value: \'+value)\n    assert path.is_file() and not path.is_symlink(), (\'Missing/unsafe receipt\',str(path))\n    data=json.loads(path.read_text(),object_pairs_hook=pairs,parse_constant=reject)\n    def finite(value):\n        if type(value) is float:assert math.isfinite(value)\n        elif type(value) is dict:\n            for child in value.values():finite(child)\n        elif type(value) is list:\n            for child in value:finite(child)\n    finite(data)\n    return data\n\n\ndef camp_boolean(value,expected=None):\n    assert type(value) is bool and (expected is None or value is expected), (\'Expected actual boolean\',value,expected)\n\n\ndef camp_integer(value,minimum=0,maximum=2**63-1):\n    assert type(value) is int and minimum<=value<=maximum, (\'Expected bounded integer\',value)\n    return value\n\n\ndef camp_number(value,minimum=0,maximum=float(\'inf\')):\n    assert type(value) in (int,float) and math.isfinite(value) and minimum<=value<maximum, (\'Invalid finite number\',value)\n\n\ndef camp_string(value,empty=False):\n    assert type(value) is str and (empty or value.strip()) and value!=\'null\', (\'Invalid text\',value)\n    return value\n\n\ndef camp_uuid(value):\n    assert type(value) is str and str(uuid.UUID(value))==value, (\'Invalid UUID\',value)\n    return value\n\n\ndef camp_digest(value):\n    assert type(value) is str and re.fullmatch(r\'[0-9a-f]{64}\',value), (\'Invalid digest\',value)\n    return value\n\n\ndef camp_pos(value,short=False):\n    pattern=r\'(-?\\d+), (-?\\d+), (-?\\d+)\' if short else r\'BlockPos\\{x=(-?\\d+), y=(-?\\d+), z=(-?\\d+)\\}\'\n    match=re.fullmatch(pattern,camp_string(value));assert match, (\'Invalid block position\',value)\n    return tuple(int(v) for v in match.groups())\n\n\ndef camp_vec(value):\n    value=camp_string(value);assert value.startswith(\'(\') and value.endswith(\')\'),value\n    parts=value[1:-1].split(\', \');assert len(parts)==3\n    values=tuple(float(v) for v in parts);assert all(math.isfinite(v) for v in values)\n    return values\n\n\ndef verify_shape(root):\n    assert root.is_dir() and not root.is_symlink()\n    data=camp_load(root/\'result.json\')\n    assert data[\'mode\']==\'camp-spawn\' and data[\'status\']==\'passed\'\n    assert data[\'screenshots\']==CAMP_SHOTS and type(data[\'screenshots\']) is list\n    assert type(data[\'scenarios\']) is list and len(data[\'scenarios\'])==3\n    for index,case in enumerate(data[\'scenarios\']):\n        assert case[\'scenario\']==CAMP_SCENARIOS[index] and case[\'status\']==\'passed\'\n        assert camp_integer(case[\'stage\'])==2;camp_integer(case[\'gameTime\'])\n        assert camp_string(case[\'nativeClaimAvailability\'],empty=True)==\'\'\n        camp_pos(case[\'campPosition\']);camp_uuid(case[\'claimId\'])\n        camp_integer(case[\'searchStep\'],0,200);camp_integer(case[\'searchElapsedTicks\'],0,4800)\n        assert type(case[\'searchCandidate\']) is str\n        if case[\'searchCandidate\']!=\'null\':camp_pos(case[\'searchCandidate\'])\n        camp_boolean(case[\'terraformFallback\'],index>0);camp_boolean(case[\'hostileTerrainPrepared\'],index>0)\n        camp_boolean(case[\'searchAbandoned\'],False)\n        for key in [\'crewStarted\',\'nativeJobOwnershipVerified\',\'nativeWorkAreaAccessVerified\',\'nativeBuilderStorageEnabled\']:camp_boolean(case[key],True)\n        for key in [\'nativeClaimChunks\',\'registeredGuardRoleCount\',\'ordinaryTicksSinceEstablishment\',\'protectedCellCount\',\'protectedChests\']:camp_integer(case[key])\n        assert case[\'nativeClaimChunks\']==25 and case[\'registeredGuardRoleCount\']==5\n        camp_number(case[\'elapsedSeconds\']);camp_string(case[\'entry\']);camp_string(case[\'constructionScope\']);camp_string(case[\'constructionPause\'],empty=True)\n        core=camp_pos(case[\'enemyCore\'],short=True)\n        native_owner=camp_uuid(case[\'nativeJobOwner\']);guard_owner=camp_uuid(case[\'guardOwner\'])\n        assert guard_owner==\'fac10000-4a1d-4e75-8a1d-000000000001\' and native_owner!=guard_owner\n        areas=case[\'nativeJobAreas\'];assert type(areas) is dict and set(areas)=={\'build\',\'storage\',\'buildOwner\',\'storageOwner\',\'supplyOwner\'}\n        assert camp_uuid(areas[\'build\'])!=camp_uuid(areas[\'storage\'])\n        for key in [\'buildOwner\',\'storageOwner\',\'supplyOwner\']:assert camp_uuid(areas[key])==native_owner\n        assert case[\'requestedGuardRoles\']==CAMP_ROLES and case[\'unregisteredGuardRoles\']==[\'assassin\']\n        assert type(case[\'workers\']) is list and case[\'workers\'] and type(case[\'guards\']) is list and len(case[\'guards\'])==5\n        faction=camp_string(case[\'expectedEnemyFaction\']);assert faction==\'siegeoverhaul_wilds_marauders\'\n        unique=set();team_tags=set()\n        for kind,owner in [(\'workers\',native_owner),(\'guards\',guard_owner)]:\n            for unit in case[kind]:\n                ident=camp_uuid(unit[\'uuid\']);assert ident not in unique,\'Duplicate native entity UUID\';unique.add(ident)\n                assert camp_uuid(unit[\'owner\'])==owner and camp_string(unit[\'faction\'])==faction\n                camp_boolean(unit[\'noAi\'],False);camp_boolean(unit[\'alive\'],True);camp_boolean(unit[\'scoutSpawnTailRecovered\'])\n                camp_vec(unit[\'position\']);camp_string(unit[\'workerTeamTag\'],empty=True);camp_string(unit[\'guardTeamTag\'],empty=True)\n                camp_boolean(unit[\'owned\']);camp_boolean(unit[\'listening\'])\n                if kind==\'workers\':\n                    assert unit[\'type\']==\'workers:builder\';camp_boolean(unit[\'owned\'],True);camp_boolean(unit[\'listening\'],False)\n                    camp_boolean(unit[\'scoutSpawnTailRecovered\'],False);team_tags.add(camp_string(unit[\'workerTeamTag\']))\n                else:\n                    assert unit[\'type\'] in {\'recruits:bowman\',\'recruits:scout\',\'recruits:crossbowman\'}\n                    camp_boolean(unit[\'scoutSpawnTailRecovered\'],unit[\'type\']==\'recruits:scout\');team_tags.add(camp_string(unit[\'guardTeamTag\']))\n            mirror=case[\'workerEntities\' if kind==\'workers\' else \'guardEntities\']\n            assert type(mirror) is list and len(mirror)==len(case[kind])\n            assert {camp_uuid(v[\'uuid\']):v for v in mirror}=={v[\'uuid\']:v for v in case[kind]},\'Native entity mirror differs\'\n        assert len(team_tags)==1 and next(iter(team_tags)).startswith(\'team:\')\n        assert Counter(v[\'type\'] for v in case[\'guards\'])==Counter({\'recruits:bowman\':2,\'recruits:scout\':2,\'recruits:crossbowman\':1})\n        terrain=case[\'recordedOriginalTerrainCounts\']\n        assert type(terrain) is dict and set(terrain)=={\'minecraft:water\',\'minecraft:oak_log\',\'minecraft:oak_leaves\'}\n        for count in terrain.values():camp_integer(count,1 if index>0 else 0)\n        if index!=2:\n            assert not {\'raisedCampPlane\',\'unchangedRockSupportVerified\',\'campPlaneAboveOriginalSurface\'}.intersection(case)\n        if index==0:\n            assert \'controlledHostileTerrain\' not in case\n        if index==2:\n            camp_boolean(case[\'raisedCampPlane\'],True);camp_boolean(case[\'unchangedRockSupportVerified\'],True)\n            assert camp_integer(case[\'campPlaneAboveOriginalSurface\'])==1\n        if index>0:\n            hostile=case[\'controlledHostileTerrain\']\n            camp_boolean(hostile[\'rockyRise\'],index==2)\n            for key in [\'waterDepth\',\'dryLandingWidth\',\'fixtureWrites\']:camp_integer(hostile[key])\n            assert hostile[\'waterDepth\']==hostile[\'dryLandingWidth\']==3 and 0<hostile[\'fixtureWrites\']<300\n            camp_integer(hostile[\'surface\'],-2**31,2**31-1);camp_string(hostile[\'terrain\'])\n            for key in [\'scout\',\'intendedFallbackCenter\',\'unclaimedProtectedChest\']:camp_pos(hostile[key],short=True)\n            if index==2:camp_pos(hostile[\'unchangedRockSupport\'],short=True)\n        capture=case[\'framebufferCapture\']\n        assert capture[\'screenshot\']==CAMP_SHOTS[index] and type(capture[\'screenshot\']) is str\n        for key in [\'worldReady\',\'observerReady\',\'coreReceived\',\'terrainCompiled\',\'cameraReady\']:camp_boolean(capture[key],True)\n        for key in [\'changedPixelSamples\',\'framebufferAttempts\',\'blankFrames\']:camp_integer(capture[key])\n        camp_number(capture[\'elapsedSeconds\'],0,30)\n        expected=camp_vec(capture[\'expectedObserver\']);actual=camp_vec(capture[\'clientPosition\']);camp_vec(capture[\'cameraPosition\'])\n        assert sum((a-b)**2 for a,b in zip(expected,actual))<.01\n        assert camp_pos(capture[\'campCore\'])==core\n        path=root/CAMP_SHOTS[index]\n        assert path.is_file() and not path.is_symlink() and path.resolve().parent==root.resolve()\n    for mod in [\'workers\',\'recruits\',\'smallships\',\'siegeweapons\']:\n        artifact=data[\'loadedCompanionArtifacts\'][mod]\n        camp_digest(artifact[\'sha256\']);camp_string(artifact[\'fileName\']);assert \'remapped\' in camp_string(artifact[\'kind\'])\n    audit=camp_load(root/\'native-bytecode-audit.json\')\n    assert audit[\'status\']==\'passed\';camp_boolean(audit[\'noVendorJarsUploaded\'],True);camp_string(audit[\'scope\'])\n    assert type(audit[\'artifacts\']) is dict and set(audit[\'artifacts\'])==set(CAMP_AUDIT_CLASSES)\n    for mod,expected_classes in CAMP_AUDIT_CLASSES.items():\n        artifact=audit[\'artifacts\'][mod];loaded=data[\'loadedCompanionArtifacts\'][mod]\n        assert camp_digest(artifact[\'sha256\'])==loaded[\'sha256\'] and artifact[\'fileName\']==loaded[\'fileName\']\n        classes=artifact[\'classes\'];assert type(classes) is list and len(classes)==len(expected_classes)\n        assert [entry[\'class\'] for entry in classes]==expected_classes\n        for entry in classes:\n            filename=entry[\'class\'].rsplit(\'.\',1)[1]+\'.javap.txt\';assert entry[\'file\']==filename\n            path=root/\'native-bytecode\'/filename;assert path.is_file() and not path.is_symlink()\n            assert path.resolve().parent==(root/\'native-bytecode\').resolve()\n            assert hashlib.sha256(path.read_bytes()).hexdigest()==camp_digest(entry[\'sha256\'])\n    return data\n\n\ndef verify(root):\n    verify_shape(root)\n    return verify_source_receipt(root)\n'

          CAMP_LIFECYCLE_SOURCE = '#!/usr/bin/env python3\n"""Strict receipt contract for the actual opt-in integrated-client lifecycle run.\n\nThis is reusable unchanged as scripts/verify-native-camp-lifecycle-evidence.py.\nIt validates recorded evidence; actual pixels and source assertions need review.\n"""\nimport json\nimport math\nfrom pathlib import Path\nimport re\nimport struct\nimport sys\nimport uuid\n\nSHOTS = [\'01-bounded-campless-fallback.png\', \'02-recovered-native-camp.png\']\nSCENARIOS = [\'no-safe-land-reload-fallback\', \'recovery-only-island\']\nGUARD_OWNER = \'fac10000-4a1d-4e75-8a1d-000000000001\'\nREASONS = {\'CLAIM_SETUP\', \'CLAIM_SAFETY\', \'UNLOADED\', \'SURFACE\', \'NAVAL_SPACE\', \'RELIEF\',\n           \'FLUID\', \'PROTECTED_BLOCKS\', \'BUDGET\', \'NO_LAND_EXIT\', \'CLAIM_CREATE\', \'TERRAIN_APPLY\'}\n\n\ndef integer(value, minimum=0, maximum=2**63-1):\n    assert type(value) is int and minimum <= value <= maximum, (\'invalid integer\', value)\n    return value\n\n\ndef boolean(value, expected=None):\n    assert type(value) is bool and (expected is None or value is expected), (\'invalid boolean\', value, expected)\n    return value\n\n\ndef text(value):\n    assert type(value) is str and value.strip() and value != \'null\', (\'invalid text\', value)\n    return value\n\n\ndef identifier(value):\n    assert type(value) is str and str(uuid.UUID(value)) == value, (\'invalid UUID\', value)\n    return value\n\n\ndef pairs(items):\n    result = {}\n    for key, value in items:\n        assert key not in result, (\'duplicate JSON key\', key)\n        result[key] = value\n    return result\n\n\ndef reject_constant(value):\n    raise AssertionError(\'Non-finite JSON constant: \' + value)\n\n\ndef load(path):\n    assert path.is_file() and not path.is_symlink(), (\'missing/unsafe receipt\', str(path))\n    data = json.loads(path.read_text(), object_pairs_hook=pairs, parse_constant=reject_constant)\n    def finite(value):\n        if type(value) is float:\n            assert math.isfinite(value), \'Non-finite JSON number\'\n        elif type(value) is dict:\n            for child in value.values(): finite(child)\n        elif type(value) is list:\n            for child in value: finite(child)\n    finite(data)\n    return data\n\n\ndef compound(value):\n    """Read top-level SNBT fields without flattening quoted/nested compounds.\n\n    Only the known primitive and compound fields emitted by RaidState authority\n    are interpreted below. Duplicate fields and unbalanced structures fail.\n    """\n    text(value)\n    assert value.startswith(\'{\') and value.endswith(\'}\'), \'Expected SNBT compound\'\n    body = value[1:-1]; fields = []; stack = []; quoted = None; escaped = False; start = 0\n    for i, char in enumerate(body):\n        if quoted:\n            if escaped: escaped = False\n            elif char == \'\\\\\': escaped = True\n            elif char == quoted: quoted = None\n        elif char in (\'"\', "\'"): quoted = char\n        elif char in \'{[\': stack.append(char)\n        elif char in \'}]\':\n            assert stack and stack.pop() == {\'}\':\'{\', \']\':\'[\'}[char], \'Unbalanced SNBT\'\n        elif char == \',\' and not stack:\n            fields.append(body[start:i]); start = i + 1\n    assert not stack and quoted is None and not escaped, \'Unbalanced SNBT\'\n    if body: fields.append(body[start:])\n    result = {}\n    for field in fields:\n        key, sep, raw = field.partition(\':\');key=key.strip();raw=raw.strip()\n        assert sep and re.fullmatch(r\'[A-Za-z][A-Za-z0-9_]*\', key) and raw and key not in result, \'Malformed or duplicate SNBT field\'\n        result[key] = raw\n    return result\n\n\ndef snbt_int(value, suffix=\'\'):\n    assert type(value) is str and re.fullmatch(r\'-?(?:0|[1-9][0-9]*)\' + suffix, value), (\'Invalid SNBT integer\', value)\n    return int(value[:-len(suffix)] if suffix else value)\n\n\ndef snbt_string(value):\n    if value.startswith(\'"\'):\n        parsed = json.loads(value)\n        assert type(parsed) is str\n        return parsed\n    # Minecraft\'s simple strings need no quoting; quoted forms use either quote.\n    if value.startswith("\'"):\n        assert value.endswith("\'")\n        out = \'\'; escaped = False\n        for char in value[1:-1]:\n            if escaped:\n                assert char in ("\'", \'\\\\\'), \'Invalid SNBT escape\'\n                out += char; escaped = False\n            elif char == \'\\\\\': escaped = True\n            else: out += char\n        assert not escaped\n        return out\n    assert re.fullmatch(r\'[A-Za-z0-9._+\\-]+\', value), \'Invalid SNBT string\'\n    return value\n\n\ndef diagnostics(value, exhausted):\n    assert type(value) is dict and set(value) == {\'exhausted\', \'counts\'}, \'Invalid typed diagnostics\'\n    boolean(value[\'exhausted\'], exhausted)\n    counts=value[\'counts\'];assert type(counts) is dict and set(counts) <= REASONS\n    for count in counts.values(): integer(count, 1, 10000)\n    return value\n\n\ndef authority(value):\n    keys={\'teamKey\',\'defensePoint\',\'factionId\',\'recovery\',\'retryTicks\',\'searchStep\',\'searchTicks\',\'searchElapsedTicks\',\n          \'searchCandidate\',\'terraformFallback\',\'searchAbandoned\',\'preparationTicks\',\'preparationTotalTicks\',\n          \'wave\',\'pendingWaveSpawns\',\'diagnostics\'}\n    assert type(value) is dict and set(value)==keys, \'Incomplete typed saved search authority\'\n    for key in [\'teamKey\',\'defensePoint\',\'factionId\']:text(value[key])\n    boolean(value[\'recovery\'],True);boolean(value[\'terraformFallback\'],True);boolean(value[\'searchAbandoned\'],False)\n    integer(value[\'retryTicks\'],1,1200)\n    for key in [\'searchStep\',\'searchTicks\',\'searchElapsedTicks\',\'wave\',\'pendingWaveSpawns\']:\n        assert integer(value[key])==0, (\'Reload must occur during pre-search cooldown\',key)\n    assert value[\'searchCandidate\'] is None, \'Cooldown must not select a candidate\'\n    assert integer(value[\'preparationTicks\'])==integer(value[\'preparationTotalTicks\'])==3600\n    diagnostics(value[\'diagnostics\'],False)\n    return value\n\n\ndef reconcile_authority_snbt(raw, value):\n    fields=compound(raw)\n    string_keys={\'Team\':\'teamKey\',\'DefensePoint\':\'defensePoint\',\'FactionId\':\'factionId\'}\n    bool_keys={\'CampSearchRecovery\':\'recovery\',\'CampTerraformed\':\'terraformFallback\',\'CampSearchAbandoned\':\'searchAbandoned\'}\n    int_keys={\'CampSearchRetryTicks\':\'retryTicks\',\'CampSearchStep\':\'searchStep\',\'CampSearchTicks\':\'searchTicks\',\n              \'CampSearchElapsedTicks\':\'searchElapsedTicks\',\'PreparationTicks\':\'preparationTicks\',\n              \'PreparationTotal\':\'preparationTotalTicks\',\'Wave\':\'wave\',\'PendingWaveSpawns\':\'pendingWaveSpawns\'}\n    assert set(fields)==set(string_keys)|set(bool_keys)|set(int_keys)|{\'CampSearchDiagnostics\'}, \'Unexpected/missing authority SNBT field\'\n    for key,field in string_keys.items():assert snbt_string(fields[key])==value[field],key\n    for key,field in bool_keys.items():assert snbt_int(fields[key],\'b\')==int(value[field]),key\n    for key,field in int_keys.items():assert snbt_int(fields[key])==value[field],key\n    recorded=compound(fields[\'CampSearchDiagnostics\']);counts=value[\'diagnostics\'][\'counts\']\n    assert set(recorded)==set(counts)|{\'Exhausted\'}\n    assert snbt_int(recorded[\'Exhausted\'],\'b\')==int(value[\'diagnostics\'][\'exhausted\'])\n    for key,count in counts.items():assert snbt_int(recorded[key])==count,key\n\n\ndef verify(root):\n    root=Path(root)\n    assert root.is_dir() and not root.is_symlink(), \'Unsafe evidence root\'\n    data=load(root/\'result.json\')\n    assert type(data) is dict and data[\'mode\']==\'camp-lifecycle\' and data[\'status\']==\'passed\'\n    config=data[\'fixtureConfiguration\']\n    assert type(config) is dict and set(config)=={\'siegePreparationMinutes\',\'waterDepth\',\'scoutingTimersChanged\',\'recoveryTimersChanged\',\'raidFieldsWritten\'}\n    assert integer(config[\'siegePreparationMinutes\'])==3 and integer(config[\'waterDepth\'])==24\n    for key in [\'scoutingTimersChanged\',\'recoveryTimersChanged\',\'raidFieldsWritten\']:boolean(config[key],False)\n    versions=data[\'loadedModVersions\']\n    for mod,version in {\'minecraft\':\'1.20.1\',\'forge\':\'47.4.16\',\'workers\':\'2.0.3\',\'recruits\':\'1.15.2\',\'smallships\':\'2.0.0-b1.4\',\'siegeweapons\':\'0.2.5\'}.items():\n        assert versions[mod]==version,mod\n    for mod in [\'workers\',\'recruits\',\'smallships\',\'siegeweapons\']:\n        artifact=data[\'loadedCompanionArtifacts\'][mod]\n        assert type(artifact[\'sha256\']) is str and re.fullmatch(r\'[0-9a-f]{64}\',artifact[\'sha256\']),mod\n    assert data[\'screenshots\']==SHOTS and type(data[\'screenshots\']) is list\n    cases=data[\'scenarios\'];assert type(cases) is list and len(cases)==2\n    assert [case[\'scenario\'] for case in cases]==SCENARIOS\n    for index,case in enumerate(cases):\n        assert case[\'status\']==\'passed\' and text(case[\'entry\']).startswith(\'Actual non-op client /siegeoverhaul start\')\n        for key in [\'sawNaturalSearch\',\'sawEarthworksSearch\',\'sawRecoveryCooldown\',\'sawWiderRecovery\',\'restorationExcludedProtectedCells\']:\n            boolean(case[key],True)\n        integer(case[\'searchTicksWithoutWaveOrAttackers\'],101)\n        cooldown=integer(case[\'cooldownTicksWithoutWaveOrAttackers\'],1200)\n        assert type(case[\'passes\']) is dict and set(case[\'passes\'])=={\'natural\',\'earthworks\',\'recovery\'}\n        for budget in case[\'passes\'].values():\n            assert type(budget) is dict and set(budget)=={\'maxCandidates\',\'maxElapsedTicks\'}\n            integer(budget[\'maxCandidates\'],1,200);integer(budget[\'maxElapsedTicks\'],1,4800)\n        integer(case[\'protectedCellCount\'],6144);integer(case[\'protectedChests\'],2)\n        integer(case[\'wave\'],1);integer(case[\'totalSpawned\'],1)\n        recovery_at=integer(case[\'recoveryCooldownAtGameTime\'])\n        search_at=integer(case[\'firstRecoverySearchAtGameTime\'])\n        wave_at=integer(case[\'firstWaveAtGameTime\'])\n        assert search_at-recovery_at>=1200 and cooldown<=search_at-recovery_at, \'Wider search began before full observed cooldown\'\n        assert wave_at>search_at, \'First wave preceded wider search\'\n        boolean(case[\'campSearchAbandoned\'],index==0)\n        boolean(case[\'realWorldReload\'],index==0);boolean(case[\'savedSearchAuthorityVerified\'],index==0)\n        shot=case[\'framebuffer\'];assert type(shot) is dict\n        assert type(shot[\'file\']) is str and shot[\'file\']==SHOTS[index], \'Scenario must use its exact unique framebuffer basename\'\n        integer(shot[\'readyFrames\'],8);integer(shot[\'attempts\'],1);integer(shot[\'changedPixelSamples\'],51)\n        elapsed=shot[\'elapsedSeconds\'];assert type(elapsed) in (int,float) and math.isfinite(elapsed) and 0<=elapsed<30\n        path=root/SHOTS[index]\n        assert path.is_file() and not path.is_symlink() and path.resolve().parent==root.resolve(), \'Unsafe/missing framebuffer\'\n        content=path.read_bytes()\n        assert content.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(content)>4096 and content[12:16]==b\'IHDR\'\n        width,height=struct.unpack(\'>II\',content[16:24])\n        assert 0<width<=8192 and 0<height<=8192, \'Invalid framebuffer dimensions\'\n        state=case[\'finalState\'];assert type(state) is dict\n        assert integer(state[\'scenario\'],0,1)==index and integer(state[\'gameTime\'])>=wave_at\n        boolean(state[\'searchRecovery\'],True);boolean(state[\'terraformFallback\'],True)\n        boolean(state[\'searchAbandoned\'],index==0);boolean(state[\'crewStarted\'],index==1)\n        assert integer(state[\'retryTicks\'])==0\n        integer(state[\'searchStep\'],0,200);integer(state[\'searchElapsedTicks\'],0,4800)\n        assert type(state[\'searchCandidate\']) is str\n        assert integer(state[\'wave\'],1)==case[\'wave\'] and integer(state[\'totalSpawned\'],1)==case[\'totalSpawned\']\n        integer(state[\'raiders\']);integer(state[\'pendingWaveSpawns\'])\n        assert integer(state[\'preparationTotalTicks\'])==3600\n        integer(state[\'preparationTicks\'],0,0 if index==0 else 1200)\n        assert type(state[\'campPosition\']) is str and ((state[\'campPosition\']==\'null\') if index==0 else bool(re.fullmatch(r\'BlockPos\\{x=-?\\d+, y=-?\\d+, z=-?\\d+\\}\',state[\'campPosition\'])))\n        assert text(state[\'diagnostics\'])==text(case[\'campSearchDiagnostics\'])\n        final_diagnostics=compound(state[\'diagnostics\'])\n        assert snbt_int(final_diagnostics[\'Exhausted\'],\'b\')==int(index==0)\n    impossible,recovery=cases\n    assert integer(impossible[\'establishedAtGameTime\'],-1)==-1\n    assert integer(impossible[\'fallbackAtGameTime\'])>=impossible[\'firstRecoverySearchAtGameTime\']\n    assert impossible[\'firstWaveAtGameTime\']-impossible[\'fallbackAtGameTime\']>=3600\n    saved=authority(impossible[\'savedSearchAuthority\']);loaded=authority(impossible[\'loadedSearchAuthority\'])\n    assert saved==loaded, \'Saved and loaded search authority differ\'\n    reconcile_authority_snbt(impossible[\'reloadedAuthority\'],loaded)\n    saved_at=integer(impossible[\'savedSearchAuthorityGameTime\'])\n    loaded_at=integer(impossible[\'loadedSearchAuthorityGameTime\'])\n    assert saved_at==loaded_at and impossible[\'recoveryCooldownAtGameTime\']<=saved_at<impossible[\'firstRecoverySearchAtGameTime\'], \'Reload game time changed or escaped cooldown\'\n    assert integer(recovery[\'fallbackAtGameTime\'],-1)==-1\n    assert recovery[\'firstRecoverySearchAtGameTime\']<=integer(recovery[\'establishedAtGameTime\'])<recovery[\'firstWaveAtGameTime\']\n    island=recovery[\'recoveryIsland\'];assert type(island) is dict\n    assert integer(island[\'width\'])==57 and integer(island[\'soilDepth\'])==24 and integer(island[\'fixtureWrites\'])==57*57*24+4\n    boolean(island[\'originalCandidatesCannotFitCore\'],True)\n    assert integer(island[\'recoveryCooldownAtGameTime\'])==recovery[\'recoveryCooldownAtGameTime\'], \'Duplicated cooldown times disagree\'\n    assert integer(island[\'completedAtGameTime\'])<island[\'recoveryCooldownAtGameTime\']\n    camp=recovery[\'nativeCamp\'];assert type(camp) is dict\n    assert integer(camp[\'nativeClaimChunks\'])==25\n    identifier(camp[\'claimId\']);identifier(camp[\'nativeJobOwner\']);assert camp[\'nativeJobOwner\']!=GUARD_OWNER\n    assert re.fullmatch(r\'-?\\d+, -?\\d+, -?\\d+\',text(camp[\'enemyCore\'])), \'Missing actual enemy-core coordinates\'\n    boolean(camp[\'preservedEdgesRescue\'],True);boolean(camp[\'warGateReadyAtCrewCheck\'])\n    assert integer(camp[\'ordinaryTicksSinceEstablishment\'],60)<=recovery[\'firstWaveAtGameTime\']-recovery[\'establishedAtGameTime\']\n    faction=text(camp[\'expectedEnemyFaction\'])\n    assert type(camp[\'workers\']) is list and camp[\'workers\'] and type(camp[\'guards\']) is list and len(camp[\'guards\'])==5\n    identities=set()\n    for kind in [\'workers\',\'guards\']:\n        for unit in camp[kind]:\n            ident=identifier(unit[\'uuid\']);assert ident not in identities, \'Duplicate native entity identity\';identities.add(ident)\n            boolean(unit[\'noAi\'],False);assert text(unit[\'faction\'])==faction\n            owner=identifier(unit[\'owner\']);assert owner==(camp[\'nativeJobOwner\'] if kind==\'workers\' else GUARD_OWNER)\n            if kind==\'workers\':assert unit[\'type\']==\'workers:builder\'\n            else:assert type(unit[\'type\']) is str and re.fullmatch(r\'recruits:[a-z_]+\',unit[\'type\'])\n    audit=load(root/\'native-bytecode-audit.json\')\n    assert audit[\'status\']==\'passed\';boolean(audit[\'noVendorJarsUploaded\'],True)\n    assert type(audit[\'artifacts\']) is dict and audit[\'artifacts\']\n    assert all(type(value[\'classes\']) is list for value in audit[\'artifacts\'].values())\n    assert sum(len(value[\'classes\']) for value in audit[\'artifacts\'].values())==18\n    return data\n\n\nif __name__==\'__main__\':\n    if len(sys.argv)!=2:raise SystemExit(\'usage: verify-native-camp-lifecycle-evidence.py EVIDENCE_DIRECTORY\')\n    verify(Path(sys.argv[1]))\n    print(\'Strict bounded recovery/reload/native-camp and first-wave receipts verified. Recovery first-wave muster does not imply completed preparation or combat. Review framebuffers separately.\')\n'


          def main():
              summary = {'protocol': 20, 'native_gates': {}}
