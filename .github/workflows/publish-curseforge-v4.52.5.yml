jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require complete immutable 4.52.5 pins
        run: |
          python3 - <<'CHECK'
          """Fail locally before any API read unless every immutable 4.52.5 pin is filled."""
          import os
          import re


          def main():
              assert os.environ['GITHUB_REPOSITORY'] == 'boostbar9/Faction-Raids'
              assert os.environ['GITHUB_REF'] == 'refs/heads/publish/curseforge-v4.52.5'
              assert os.environ['GITHUB_EVENT_NAME'] == 'push'
              for key in ('REVIEWED_SOURCE_SHA', 'MERGED_SOURCE_SHA', 'SOURCE_TREE_SHA', 'HUD_CHECKOUT_SHA', 'BUILDING_CHECKOUT_SHA', 'SERVER_CHECKOUT_SHA', 'CAMP_CHECKOUT_SHA', 'LIFECYCLE_CHECKOUT_SHA'):
                  assert re.fullmatch(r'[0-9a-f]{40}', os.environ[key]), 'Unfilled source pin: ' + key
              for key in ('ARTIFACT_SHA256', 'REGRESSION_SUITE_SHA256', 'HUD_EVIDENCE_SHA256', 'BUILDING_EVIDENCE_SHA256', 'SERVER_EVIDENCE_SHA256', 'CAMP_EVIDENCE_SHA256', 'LIFECYCLE_EVIDENCE_SHA256'):
                  assert re.fullmatch(r'[0-9a-f]{64}', os.environ[key]), 'Unfilled digest pin: ' + key
              for key in ('PULL_REQUEST_NUMBER', 'REVIEWED_BUILD_RUN_ID', 'REVIEWED_JAR_ARTIFACT_ID',
                          'REVIEWED_REGRESSION_ARTIFACT_ID', 'BUILD_RUN_ID',
                          'BUILD_RUN_ATTEMPT', 'JAR_ARTIFACT_ID', 'REGRESSION_ARTIFACT_ID',
                          'REGRESSION_TEST_COUNT', 'REGRESSION_SUITE_COUNT', 'REVIEWED_BUILD_RUN_ATTEMPT',
                          'HUD_RUN_ID', 'HUD_RUN_ATTEMPT', 'HUD_ARTIFACT_ID',
                          'BUILDING_RUN_ID', 'BUILDING_RUN_ATTEMPT', 'BUILDING_ARTIFACT_ID',
                          'SERVER_RUN_ID', 'SERVER_RUN_ATTEMPT', 'SERVER_ARTIFACT_ID',
                          'CAMP_RUN_ID', 'CAMP_RUN_ATTEMPT', 'CAMP_ARTIFACT_ID',
                          'LIFECYCLE_RUN_ID', 'LIFECYCLE_RUN_ATTEMPT', 'LIFECYCLE_ARTIFACT_ID'):
                  assert re.fullmatch(r'[1-9][0-9]*', os.environ[key]), 'Unfilled or invalid pin: ' + key
              assert os.environ['BUILD_RUN_ID'] != os.environ['REVIEWED_BUILD_RUN_ID'], 'PR Build is not a merged-main release Build'
              artifact_ids = [os.environ[key] for key in (
                  'REVIEWED_JAR_ARTIFACT_ID', 'REVIEWED_REGRESSION_ARTIFACT_ID',
                  'JAR_ARTIFACT_ID', 'REGRESSION_ARTIFACT_ID')]
              assert len(set(artifact_ids)) == 4, 'PR/main JAR/XML artifact IDs must all be distinct'
              assert len({os.environ[key] for key in ('BUILD_RUN_ID', 'REVIEWED_BUILD_RUN_ID', 'HUD_RUN_ID', 'BUILDING_RUN_ID', 'SERVER_RUN_ID', 'CAMP_RUN_ID', 'LIFECYCLE_RUN_ID')}) == 7, 'All seven gate runs must be distinct'
              assert len(set(artifact_ids + [os.environ[prefix + '_ARTIFACT_ID'] for prefix in ('HUD', 'BUILDING', 'SERVER', 'CAMP', 'LIFECYCLE')])) == 9, 'All nine artifact IDs must be distinct'
              assert int(os.environ['REGRESSION_TEST_COUNT']) >= int(os.environ['REGRESSION_SUITE_COUNT'])
              print('All 4.52.5 immutable pins are filled; live source/artifact checks still required.')


          if __name__ == '__main__':
              main()
          CHECK

      - name: Prevent duplicate release uploads
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          """One-use upload guard. GitHub reads only; no CurseForge credentials."""
          import json
          import os
          import urllib.parse
          import urllib.request


          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def pages(path, key, params=None):
              seen = 0
              total = None
              for page in range(1, 11):
                  query = urllib.parse.urlencode(dict(params or {}, per_page=100, page=page))
                  response = get(path + '?' + query)
                  if (not isinstance(response, dict) or not isinstance(response.get(key), list)
                          or type(response.get('total_count')) is not int):
                      raise RuntimeError('Missing or malformed history metadata; inspect before publishing.')
                  if total is None:
                      total = response['total_count']
                  elif total != response['total_count']:
                      raise RuntimeError('History changed during inspection; inspect before publishing.')
                  items = response[key]
                  seen += len(items)
                  yield from items
                  if len(items) < 100:
                      if seen != total:
                          raise RuntimeError('Incomplete history returned; inspect before publishing.')
                      return
              raise RuntimeError('History exceeded the bounded scan; inspect before publishing.')


          def classify(step):
              """Success means accepted; skipped/definitely unstarted means no attempt."""
              if step.get('conclusion') == 'success':
                  return 'accepted'
              if step.get('conclusion') == 'skipped':
                  return 'not_started'
              if (step.get('status') in ('queued', 'pending')
                      and not step.get('started_at') and not step.get('completed_at')
                      and step.get('conclusion') is None):
                  return 'not_started'
              # Failed/canceled/timed-out, in-progress, or incomplete/unknown metadata
              # cannot prove that CurseForge did not accept a request.
              return 'ambiguous'


          def definitely_unstarted(item):
              return (item.get('conclusion') == 'skipped'
                      or (item.get('status') in ('queued', 'pending')
                          and not item.get('started_at') and not item.get('run_started_at')
                          and not item.get('completed_at') and item.get('conclusion') is None))


          def classify_job(job):
              if not isinstance(job, dict):
                  return 'ambiguous'
              steps = job.get('steps')
              if not isinstance(steps, list) or any(not isinstance(step, dict) for step in steps):
                  return 'not_started' if definitely_unstarted(job) else 'ambiguous'
              uploads = [step for step in steps if step.get('name') == 'Publish to CurseForge']
              if len(uploads) != 1:
                  return 'not_started' if not uploads and definitely_unstarted(job) else 'ambiguous'
              return classify(uploads[0])


          def main():
              current = int(os.environ['GITHUB_RUN_ID'])
              current_attempt = int(os.environ.get('GITHUB_RUN_ATTEMPT', '1'))
              accepted = []
              ambiguous = []
              runs = list(pages('actions/workflows/publish-curseforge-v4.52.5.yml/runs', 'workflow_runs', {
                  'branch': 'publish/curseforge-v4.52.5', 'event': 'push'}))
              # The running attempt may not yet appear in list results. Always inspect
              # its prior attempts explicitly, and every attempt of earlier runs.
              inspect = {(current, attempt): None for attempt in range(1, current_attempt)}
              for run in runs:
                  if (not isinstance(run, dict) or type(run.get('id')) is not int
                          or type(run.get('run_attempt')) is not int or run['run_attempt'] < 1):
                      raise RuntimeError('Incomplete run identity/attempt history; inspect before publishing.')
                  if run['id'] == current:
                      continue
                  if run.get('path', '').split('@', 1)[0] != '.github/workflows/publish-curseforge-v4.52.5.yml':
                      raise RuntimeError('Unexpected or missing publisher workflow identity; inspect before publishing.')
                  inspect.update({(run['id'], attempt): run
                                  for attempt in range(1, run['run_attempt'] + 1)})
              for run_id, attempt in sorted(inspect):
                  jobs = list(pages(f'actions/runs/{run_id}/attempts/{attempt}/jobs', 'jobs'))
                  run_metadata = inspect[(run_id, attempt)]
                  if not jobs and not (run_metadata and attempt == run_metadata['run_attempt']
                                       and definitely_unstarted(run_metadata)):
                      ambiguous.append({'run': run_id, 'attempt': attempt, 'reason': 'No job history returned'})
                  for job in jobs:
                      state = classify_job(job)
                      evidence = {'run': run_id, 'attempt': attempt,
                                  'job': job.get('id') if isinstance(job, dict) else None,
                                  'state': state}
                      if state == 'accepted':
                          accepted.append(evidence)
                      elif state == 'ambiguous':
                          ambiguous.append(evidence)
              if accepted:
                  publish = False
                  print('Prior successful upload found; skipping duplicate:', json.dumps(accepted))
                  print('Inspect its receipt and CurseForge public status separately.')
              elif ambiguous:
                  raise RuntimeError('An earlier upload may have been accepted. Inspect its logs, '
                                     'receipt and existing CurseForge files before any retry; '
                                     'there is no override flag. Evidence: ' + json.dumps(ambiguous))
              else:
                  publish = True
                  print('No prior successful or ambiguous upload attempt; publishing once.')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('publish=' + str(publish).lower() + '\n')


          if __name__ == '__main__':
              main()
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Verify successful tested build and identical merged tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          """Bind the exact merged Build, PR, current main and source tree."""
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.request


          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def verify_reviewed_run(prefix, name, path, artifacts):
              run_id = os.environ[prefix + '_RUN_ID']
              run = get('actions/runs/' + run_id)
              assert run['id'] == int(run_id)
              assert run['run_attempt'] == int(os.environ[prefix + '_RUN_ATTEMPT']), 'Reviewed gate attempt changed: ' + prefix
              assert run['status'] == 'completed' and run['conclusion'] == 'success', prefix
              assert run['event'] in ('pull_request', 'workflow_dispatch'), prefix
              assert run['head_sha'] == os.environ['REVIEWED_SOURCE_SHA'], 'Wrong final PR head: ' + prefix
              assert run['name'] == name and run['path'] == path, prefix
              assert run['repository']['full_name'] == run['head_repository']['full_name'] == 'boostbar9/Faction-Raids', prefix
              assert get('actions/workflows/' + str(run['workflow_id']))['path'] == path, prefix
              if run['event'] == 'pull_request':
                  associations = run['pull_requests']
                  assert isinstance(associations, list), 'Malformed run PR associations: ' + prefix
                  if not associations:
                      # GitHub may return an empty run association list after merge. Resolve
                      # the already exact-pinned head through its authoritative PR endpoint;
                      # do not accept a missing, truncated, foreign or mismatched association.
                      associations = get('commits/' + os.environ['REVIEWED_SOURCE_SHA'] + '/pulls?per_page=100')
                      assert isinstance(associations, list) and len(associations) < 100, 'Missing or truncated commit PR associations: ' + prefix
                      matches = [pr for pr in associations if pr['number'] == int(os.environ['PULL_REQUEST_NUMBER'])]
                      assert len(matches) == 1, 'Missing or ambiguous exact commit PR association: ' + prefix
                      associated = matches[0]
                      assert associated['head']['sha'] == os.environ['REVIEWED_SOURCE_SHA'], prefix
                      assert associated['base']['ref'] == 'main', prefix
                      assert associated['head']['repo']['full_name'] == associated['base']['repo']['full_name'] == 'boostbar9/Faction-Raids', prefix
                  else:
                      assert any(pr['number'] == int(os.environ['PULL_REQUEST_NUMBER']) and pr['head']['sha'] == os.environ['REVIEWED_SOURCE_SHA']
                                 for pr in associations), 'Missing exact PR association: ' + prefix
              response = get('actions/runs/' + run_id + '/artifacts?per_page=100')
              assert response['total_count'] == len(response['artifacts']), 'Truncated gate artifacts: ' + prefix
              selected = {}
              for artifact_name, artifact_id in artifacts.items():
                  matches = [item for item in response['artifacts'] if item['name'] == artifact_name]
                  assert len(matches) == 1, artifact_name
                  item = matches[0]
                  assert item['id'] == artifact_id and not item['expired'] and item['size_in_bytes'] > 0, artifact_name
                  assert item['workflow_run']['id'] == int(run_id), artifact_name
                  assert item['workflow_run']['head_sha'] == os.environ['REVIEWED_SOURCE_SHA'], artifact_name
                  selected[artifact_name] = artifact_id
              return {'run_id': int(run_id), 'run_attempt': run['run_attempt'], 'artifacts': selected}


          def main():
              assert re.fullmatch(r'[1-9][0-9]*', os.environ['PULL_REQUEST_NUMBER']), 'Unfilled PR identity'
              reviewed_sha = os.environ['REVIEWED_SOURCE_SHA']
              merged_sha = os.environ['MERGED_SOURCE_SHA']
              source_tree = os.environ['SOURCE_TREE_SHA']
              build_run = os.environ['BUILD_RUN_ID']
              for value in (reviewed_sha, merged_sha, source_tree):
                  assert re.fullmatch(r'[0-9a-f]{40}', value), 'Unfilled or invalid source pin'
              for key in ('BUILD_RUN_ID', 'BUILD_RUN_ATTEMPT', 'JAR_ARTIFACT_ID', 'REGRESSION_ARTIFACT_ID'):
                  assert re.fullmatch(r'[1-9][0-9]*', os.environ[key]), 'Unfilled or invalid pin: ' + key
              assert re.fullmatch(r'[0-9a-f]{64}', os.environ['ARTIFACT_SHA256']), 'Unfilled JAR digest'
              assert os.environ['GITHUB_REPOSITORY'] == 'boostbar9/Faction-Raids'
              run = get('actions/runs/' + build_run)
              assert run['id'] == int(build_run)
              assert run['run_attempt'] == int(os.environ['BUILD_RUN_ATTEMPT']), 'Build attempt changed; reconcile'
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              assert run['event'] == 'push' and run['head_branch'] == 'main'
              assert run['head_sha'] == merged_sha
              assert run['name'] == 'Build' and run['path'] == '.github/workflows/build.yml'
              assert run['repository']['full_name'] == 'boostbar9/Faction-Raids'
              assert run['head_repository']['full_name'] == 'boostbar9/Faction-Raids'
              workflow = get('actions/workflows/' + str(run['workflow_id']))
              assert workflow['path'] == '.github/workflows/build.yml'
              pr = get('pulls/' + os.environ['PULL_REQUEST_NUMBER'])
              assert pr['merged'] and pr['merge_commit_sha'] == merged_sha
              assert pr['head']['sha'] == reviewed_sha
              assert pr['base']['ref'] == 'main'
              assert pr['base']['repo']['full_name'] == 'boostbar9/Faction-Raids'
              assert pr['head']['repo']['full_name'] == 'boostbar9/Faction-Raids'
              main_sha = get('branches/main')['commit']['sha']
              assert main_sha == merged_sha, 'Main advanced; reconcile explicitly before upload'
              for sha in (reviewed_sha, merged_sha, run['head_sha'], main_sha):
                  assert get('git/commits/' + sha)['tree']['sha'] == source_tree
              tree = get('git/trees/' + source_tree + '?recursive=1')
              assert tree['sha'] == source_tree and not tree['truncated']
              paths = [entry['path'] for entry in tree['tree'] if entry['type'] == 'blob']
              # Both Build and all five native gates are tied to the final reviewed head.
              reviewed_build = verify_reviewed_run('REVIEWED_BUILD', 'Build', '.github/workflows/build.yml', {
                  'Faction-Raids-Forge-1.20.1': int(os.environ['REVIEWED_JAR_ARTIFACT_ID']),
                  'regression-test-results': int(os.environ['REVIEWED_REGRESSION_ARTIFACT_ID']),
              })
              native_gates = {}
              for prefix, name, workflow_path, artifact_prefix in (
                  ('HUD', 'Native HUD QA', '.github/workflows/native-hud-qa.yml', 'native-hud-qa'),
                  ('BUILDING', 'Native Building QA', '.github/workflows/native-building-qa.yml', 'native-building-qa'),
                  ('SERVER', 'Native Building Server QA', '.github/workflows/native-building-server-qa.yml', 'native-building-server-qa'),
                  ('CAMP', 'Native Camp Spawn QA', '.github/workflows/native-camp-qa.yml', 'native-camp-qa'),
                  ('LIFECYCLE', 'Native Camp Lifecycle QA', '.github/workflows/native-camp-lifecycle-qa.yml', 'native-camp-lifecycle-qa'),
              ):
                  artifact_name = artifact_prefix + '-' + os.environ[prefix + '_RUN_ID'] + '-' + os.environ[prefix + '_RUN_ATTEMPT']
                  native_gates[prefix.lower()] = verify_reviewed_run(prefix, name, workflow_path, {
                      artifact_name: int(os.environ[prefix + '_ARTIFACT_ID']),
                  })
                  checkout = os.environ[prefix + '_CHECKOUT_SHA']
                  assert get('git/commits/' + checkout)['tree']['sha'] == source_tree, 'Native checkout tree differs: ' + prefix
                  native_gates[prefix.lower()]['checkout_sha'] = checkout
                  native_gates[prefix.lower()]['evidence_sha256'] = os.environ[prefix + '_EVIDENCE_SHA256']
              # Ensure embedded receipt validators describe the final source workflows exactly.
              verifier_sources = {'.github/workflows/native-building-qa.yml': 'c8822280222aa9e099ea13cc9f1f2b3b9a9e4348e5b97b06634147ac3b9dad51', '.github/workflows/native-building-server-qa.yml': 'f90a54710538f5a90a61b422929eb6945233146bf0db34fb045b3e1ffe6a67ea', '.github/workflows/native-camp-lifecycle-qa.yml': 'ffd71b85846f77a50b4fb98a500ac3279a0c9ecc2e29391989b89014186a51ff', '.github/workflows/native-camp-qa.yml': '08268d03ec2dfa54eaba6d58a5380fbad527c02320c39ad9e59ad097fdbc9b62', '.github/workflows/native-hud-qa.yml': '64721639d8ecc38cd060e0d9e8afb849810fd6f76f9b54bd5a077ad6082cdaa7', 'scripts/verify-native-camp-lifecycle-evidence.py': 'e81b19c33694e8327416f5dac151da9fc5bb259ca51735bc48af782a799dd463', 'scripts/verify-native-economy.py': '0b1f83483bf1c6cd121617410b7dfa7150d355ad176b8484cc1ecbfaa19f3c71', 'scripts/verify-native-hud.py': '567f092608780983caabafe635dbbf661ccadf97a1f79bf837db927280c94c0c'}
              entries_by_path = {entry['path']: entry for entry in tree['tree'] if entry['type'] == 'blob'}
              for path, expected_digest in verifier_sources.items():
                  blob = get('git/blobs/' + entries_by_path[path]['sha'])
                  assert blob['encoding'] == 'base64', path
                  content = base64.b64decode(blob['content'], validate=False)
                  assert hashlib.sha256(content).hexdigest() == expected_digest, 'Receipt contract changed; regenerate and independently review publisher: ' + path

              source_roots = sorted(path[len('src/main/java/'):-len('.java')]
                                    for path in paths
                                    if path.startswith('src/main/java/') and path.endswith('.java'))
              assert source_roots and len(source_roots) == len(set(source_roots))
              excluded_roots = sorted(path.split('/java/', 1)[1][:-len('.java')]
                                      for path in paths
                                      if path.startswith(('src/test/java/', 'src/nativeQa/java/', 'src/nativeServerQa/java/'))
                                      and path.endswith('.java'))
              assert not set(source_roots).intersection(excluded_roots)
              artifacts = get('actions/runs/' + build_run + '/artifacts?per_page=100')
              assert artifacts['total_count'] == len(artifacts['artifacts']), 'Artifact list truncated'
              selected = {}
              expected_artifacts = {
                  'Faction-Raids-Forge-1.20.1': int(os.environ['JAR_ARTIFACT_ID']),
                  'regression-test-results': int(os.environ['REGRESSION_ARTIFACT_ID']),
              }
              for name, expected_id in expected_artifacts.items():
                  matches = [item for item in artifacts['artifacts'] if item['name'] == name]
                  assert len(matches) == 1, name
                  item = matches[0]
                  assert item['id'] == expected_id, 'Artifact identity changed: ' + name
                  assert not item['expired'] and item['size_in_bytes'] > 0
                  assert item['workflow_run']['id'] == int(build_run)
                  assert item['workflow_run']['head_sha'] == merged_sha
                  assert item['workflow_run']['head_branch'] == 'main'
                  selected[name] = item['id']
              manifest = {
                  'pull_request': int(os.environ['PULL_REQUEST_NUMBER']), 'reviewed_source': reviewed_sha, 'merged_source': merged_sha,
                  'source_tree': source_tree, 'build_run': int(build_run),
                  'build_attempt': run['run_attempt'], 'artifacts': selected,
                  'production_class_roots': source_roots, 'excluded_class_roots': excluded_roots,
                  'reviewed_build': reviewed_build, 'native_gates': native_gates,
              }
              Path('verified-source.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
              print('Verified exact pinned PR, successful merged-main Build, unchanged current main and source tree.')
              print('Artifact IDs:', json.dumps(selected, sort_keys=True))


          if __name__ == '__main__':
              main()
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
