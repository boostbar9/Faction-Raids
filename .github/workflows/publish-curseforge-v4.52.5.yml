# One-use exact-artifact publisher; do not merge this workflow into main.
# All 41 source, PR/main Build/artifact and regression pins stay invalid until reviewed.
# No checkout, rebuild, release tag, GitHub Release or updates.json mutation.
name: Publish tested 4.52.5 release to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.52.5]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.52.5
  cancel-in-progress: false

env:
  PULL_REQUEST_NUMBER: '264'
  REVIEWED_SOURCE_SHA: 'ff4a0fff75d7f8c4255cd135560e0353a47e24ef'
  MERGED_SOURCE_SHA: '6eb119764108d62163cf708f54c2c8e2de250cc5'
