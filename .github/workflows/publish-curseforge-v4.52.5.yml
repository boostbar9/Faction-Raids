  CAMP_RUN_ATTEMPT: '1'
  CAMP_ARTIFACT_ID: '11318901127'
  CAMP_CHECKOUT_SHA: '37d4aac6754e19e72c2a69886e0da8c057ce5463'
  CAMP_EVIDENCE_SHA256: '89c5ab5c4c1539a814417da7bfdb058b4fd02c724d5c0b91655c49ae7803bc92'
  LIFECYCLE_RUN_ID: '37244006864'
  LIFECYCLE_RUN_ATTEMPT: '1'
