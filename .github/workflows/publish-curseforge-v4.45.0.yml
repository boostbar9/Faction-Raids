name: Publish tested 4.45.0 beta to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.45.0]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.45.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify successful merged-main build and identical PR tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request

          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          source_sha = 'c861c407ed8ab7ae6ebcaa418e5dbe997b0a5b2e'
          source_tree = '03e606a7f957fc1ca94c483c814ee3bc2f2cf1c1'
          pr_head_sha = 'cf6f74815ebe055c3844797809221b9bf0abdfba'
          run = get('actions/runs/35476147435')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == source_sha
          pr = get('pulls/164')
          assert pr['merged'] and pr['merge_commit_sha'] == source_sha
          assert pr['head']['sha'] == pr_head_sha
          for sha in (run['head_sha'], pr['merge_commit_sha'], pr_head_sha):
              assert get('git/commits/' + sha)['tree']['sha'] == source_tree
          CHECK

      - name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 35476147435
          github-token: ${{ github.token }}
          path: dist

      - name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          run-id: 35476147435
          github-token: ${{ github.token }}
          path: regression

      - name: Verify tested bytes, metadata, dependencies, and regressions
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          import xml.etree.ElementTree as ET

          jar = Path('dist/siegeoverhaul-4.45.0.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'cd3b743947fa03d387e52b4d221c0fa9f3859b02d3a5da65b59c768f02c78d4a'
          Path('verified-sha256.txt').write_text(digest)
          with zipfile.ZipFile(jar) as archive:
              assert archive.testzip() is None
              assert 'com/devfarinsky/siegeoverhaul/narrative/OlympianHostIdentity.class' in archive.namelist()
              assert 'com/devfarinsky/siegeoverhaul/core/EnemyCore.class' in archive.namelist()
              assert 'com/devfarinsky/siegeoverhaul/core/HeroTraits.class' in archive.namelist()
              data = tomllib.loads(archive.read('META-INF/mods.toml').decode())
          mod = data['mods'][0]
          assert mod['modId'] == 'siegeoverhaul' and mod['version'] == '4.45.0'
          assert mod['displayTest'] == 'MATCH_VERSION'
          dependencies = {entry['modId']: entry for entry in data['dependencies']['siegeoverhaul']}
          for mod_id in ('recruits', 'workers', 'smallships', 'siegeweapons'):
              assert dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['recruits']['versionRange'] == '[1.15.2,)'
          assert dependencies['workers']['versionRange'] == '[2.0.3,)'
          for mod_id in ('ftbchunks', 'openpartiesandclaims', 'corpse', 'magistuarmory', 'musketmod'):
              assert not dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          reports = list(Path('regression').rglob('TEST-*.xml'))
          assert reports
          for report in reports:
              result = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(result.get(key, 0))
          assert totals == {'tests': 418, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          print('Verified', jar.name, digest, totals)
          CHECK

      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.45.0.jar
          name: The Siege Overhaul v4.45.0 beta - Distinct Olympian War Hosts
          version: v4.45.0
          version-type: beta
          changelog: |
            # 4.45.0 beta

            - Give every Olympian war host a real battlefield doctrine: Poseidon's broad tidal line, Ares' melee-heavy spearhead, Hephaestus' supplied siege column, Athena's captain-led shield square, and Artemis' ranged skirmish screen. Terrain and specialist safety can still override formation orders when needed.
            - Give each Strategos a distinct, five-second signature command at half health: Tidal Advance, War Cry, Forge Ward, Aegis Order, or Hunter's Mark. Effects are bounded, visible and non-destructive; they do not place water, spread fire, or alter terrain.
            - Bind enemy champions to the patron leading their invasion. The twenty existing hero roles are divided into four champions per host while preserving role IDs, rarity, prices, stats and mechanics. Untouched 4.44 names migrate; player-renamed heroes remain unchanged.
            - Give each host a recognizable command keep and progressive camp skyline using patron-specific palettes: prismarine waves, blackstone battlements, copper forge chimneys, a quartz acropolis, or a moss-and-birch hunting shrine.
            - Update Intel lore with each host's doctrine, camp silhouette, Strategos ability and counterplay. Existing faction IDs, active raids, saves, claims, diplomacy records, restoration tracking and dependency requirements remain compatible.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
          fail-mode: fail

      - name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os, hashlib
          from pathlib import Path
          digest = hashlib.sha256(Path('dist/siegeoverhaul-4.45.0.jar').read_bytes()).hexdigest()
          assert digest == Path('verified-sha256.txt').read_text()
          result = {
              'version': '4.45.0',
              'file_id': os.environ['RELEASE_FILE_ID'],
              'url': os.environ['RELEASE_URL'],
              'source': 'c861c407ed8ab7ae6ebcaa418e5dbe997b0a5b2e',
              'source_tree': '03e606a7f957fc1ca94c483c814ee3bc2f2cf1c1',
              'pr_head': 'cf6f74815ebe055c3844797809221b9bf0abdfba',
              'build_run': 35476147435,
              'tests': 418,
              'sha256': digest,
          }
          assert result['file_id'] and result['url']
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Accepted upload (moderation/public availability separate): ' + json.dumps(result) + '\n')
          RECEIPT
