name: Publish tested 4.9.1 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.9.1]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.9.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34201328035
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.9.1.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '08cc70ee426919165aabb78b87622638d985182233dbd96b2fdb922bbe55f85e'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.9.1'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.9.1.jar
          name: The Siege Overhaul v4.9.1 beta - Modern Core Menu
          version: v4.9.1
          version-type: beta
          changelog: |
            ## 4.9.1 beta
            
            - Modern core menu with custom painted buttons, selected tabs, dark layered panels, rounded card borders and color accents.
            - Larger responsive layout with roomier spacing, compact rows at small GUI sizes and truncation for long names.
            - Server-synchronized emerald balance in the header, plus an offer-refresh progress bar.
            - Loot boxes show actual reward item previews. Confirmation styling makes the second purchase click distinct.
            - Preserve keyboard focus and button narration, existing hero descriptions, reward odds and purchase validation.
            - Network protocol 11: update server and every client together.
            
            REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Minecraft 1.20.1 Forge, Java 17. Match Siege Overhaul versions.
            
            Validation: Java 17 clean build and 136 regression tests passed. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.9.1', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.9.1 beta: {result['url']}\n")
          RECEIPT
