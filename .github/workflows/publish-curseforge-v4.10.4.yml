name: Publish tested 4.10.4 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.10.4]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.10.4
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34296730896
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.10.4.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'f1d1242278dc2d6a8f5a8be0bc2d902132012dabecb9a39b310477ff87e4c0c3'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.10.4'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          assert not dependencies['corpse']['mandatory']
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.10.4.jar
          name: The Siege Overhaul v4.10.4 beta - Claim Protection Reliability
          version: v4.10.4
          version-type: beta
          changelog: |
            ## 4.10.4 beta

            - An installed optional claim provider API failure no longer silently removes claim-aware placement protection.
            - The failed provider blocks initial and subsequent claim queries, including bulk queries.
            - Claim diagnostics identify failed providers. Repair the provider and restart the server to clear this protective state.
            - Absent optional mods leave normal placement unchanged. This is a failure-handling fix, not a claim of expanded provider API compatibility.

            Minecraft 1.20.1 Forge, Java 17. REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Matching Siege Overhaul versions required. Corpse optional.

            Validation: clean Java 17 Forge build, 163 passing regression tests, zero skipped. No interactive Minecraft playtest; beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            corpse(optional)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.10.4', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.10.4 beta: {result['url']}\n")
          RECEIPT
