name: Publish tested 4.43.1 beta to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.43.1]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.43.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify successful merged-main build and identical PR tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request

          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          source_sha = '53ecfba863610c19b3658e99276d28c3c677b444'
          source_tree = '592765c4514945912d0ee1acbffa8f83b1f365f6'
          pr_head_sha = '3c4e81815beb5cf76b79228d854ce1e51b271868'

          run = get('actions/runs/35364332466')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == source_sha

          pr = get('pulls/159')
          assert pr['merged'] and pr['merge_commit_sha'] == source_sha
          assert pr['head']['sha'] == pr_head_sha

          for sha in (run['head_sha'], pr['merge_commit_sha'], pr_head_sha):
              assert get('git/commits/' + sha)['tree']['sha'] == source_tree
          CHECK

      - name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 35364332466
          github-token: ${{ github.token }}
          path: dist

      - name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          run-id: 35364332466
          github-token: ${{ github.token }}
          path: regression

      - name: Verify tested bytes, metadata, dependencies, and regressions
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          import xml.etree.ElementTree as ET

          jar = Path('dist/siegeoverhaul-4.43.1.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '7464d2c528cc2d44fddc156ba37904f6a5d6e648d49deb28ee68854bfa00c4dc'
          Path('verified-sha256.txt').write_text(digest)

          with zipfile.ZipFile(jar) as archive:
              assert archive.testzip() is None
              names = archive.namelist()
              assert 'com/devfarinsky/siegeoverhaul/core/EnemyCore.class' in names
              assert 'com/devfarinsky/siegeoverhaul/compat/RaiderDiplomacy.class' in names
              data = tomllib.loads(archive.read('META-INF/mods.toml').decode())
          mod = data['mods'][0]
          assert mod['modId'] == 'siegeoverhaul' and mod['version'] == '4.43.1'
          assert mod['displayTest'] == 'MATCH_VERSION'

          dependencies = {entry['modId']: entry for entry in data['dependencies']['siegeoverhaul']}
          for mod_id in ('recruits', 'workers', 'smallships', 'siegeweapons'):
              assert dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['recruits']['versionRange'] == '[1.15.2,)'
          assert dependencies['workers']['versionRange'] == '[2.0.3,)'
          for mod_id in ('corpse', 'magistuarmory', 'musketmod'):
              assert not dependencies[mod_id]['mandatory'], mod_id

          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          reports = list(Path('regression').rglob('TEST-*.xml'))
          assert reports, 'No regression reports found'
          for report in reports:
              result = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(result.get(key, 0))
          assert totals == {'tests': 403, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          print('Verified', jar.name, digest, totals)
          CHECK

      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.43.1.jar
          name: The Siege Overhaul v4.43.1 beta - Enemy Core and Diplomacy Reliability
          version: v4.43.1
          version-type: beta
          changelog: |
            # 4.43.1 beta

            - Keep enemy command-core keeps fully inside camp walls and protect their courtyard even when reinforcement-gate planning is unavailable.
            - Reject overlapping camp construction before roads or gates mutate the world, and reduce repeated claim/construction scans during core placement.
            - Reassert Villager Recruits enemy diplomacy during active sieges so mid-siege peace or alliance changes cannot pacify the attacking army.
            - Preserve existing enemy cores, capture progress, saves, and dependency requirements.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
          fail-mode: fail

      - name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os, hashlib
          from pathlib import Path

          digest = hashlib.sha256(Path('dist/siegeoverhaul-4.43.1.jar').read_bytes()).hexdigest()
          assert digest == Path('verified-sha256.txt').read_text()
          result = {
              'version': '4.43.1',
              'file_id': os.environ['RELEASE_FILE_ID'],
              'url': os.environ['RELEASE_URL'],
              'source': '53ecfba863610c19b3658e99276d28c3c677b444',
              'source_tree': '592765c4514945912d0ee1acbffa8f83b1f365f6',
              'pr_head': '3c4e81815beb5cf76b79228d854ce1e51b271868',
              'build_run': 35364332466,
              'tests': 403,
              'sha256': digest,
          }
          assert result['file_id'] and result['url'], 'CurseForge did not return an upload receipt'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Accepted upload (moderation/public availability separate): ' + json.dumps(result) + '\n')
          RECEIPT
