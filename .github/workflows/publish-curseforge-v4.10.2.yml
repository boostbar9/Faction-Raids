name: Publish tested 4.10.2 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.10.2]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.10.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34266244778
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.10.2.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'ca08a4bbfdc304bb5a5e9bb1244c901afceec588dc8717a50cc0dbb438b6560a'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.10.2'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.10.2.jar
          name: The Siege Overhaul v4.10.2 beta - War Gate Reliability
          version: v4.10.2
          version-type: beta
          changelog: |
            ## 4.10.2 beta

            - Rejected War Gate installations restore construction queues and try another site.
            - Successful gate assembly immediately marks restoration records for saving.
            - Malformed saved coordinates and invalid block IDs no longer crash guarded gate paths.
            - Missing gate centers fail safely instead of defaulting to world origin.
            - Gate cleanup preserves later player/mod block replacements while restoring original soil normally.

            Minecraft 1.20.1 Forge, Java 17. REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Install matching Siege Overhaul versions.

            Validation: clean Java 17 build and 157 passing regression tests, zero skipped. No interactive Minecraft playtest; beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.10.2', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.10.2 beta: {result['url']}\n")
          RECEIPT
