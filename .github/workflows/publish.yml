name: Publish release to CurseForge

# Fires whenever a GitHub Release is published (via `gh release create`
# or the Releases UI). Builds the mod fresh from the tagged source,
# then uploads the jar to CurseForge project 1364352
# ("The Siege Overhaul"). The GitHub release body is used verbatim as
# the changelog so we only maintain one changelog.
on:
  release:
    types: [published]
  # Manual re-run entry point in case the release-triggered run fails
  # partway (e.g. CurseForge is briefly down). Re-running from the
  # Actions tab republishes the same tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v3.0.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain build -x test

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/siegeoverhaul-*.jar
          name: ${{ github.event.release.name || inputs.tag }}
          version: ${{ github.event.release.tag_name || inputs.tag }}
          # Beta prereleases get uploaded as CurseForge "beta" so testers
          # can opt in without breaking modpacks pinned to stable.
          # Anything else ships as a full release.
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: forge
          game-versions: 1.20.1
          java: 17

          # Canonical dependency set for every uploaded jar. CurseForge
          # shows these as required / optional badges on the file listing
          # and gates the download page's compatibility checks on them.
          # Slugs use CurseForge project slugs (not mods.toml ids) so the
          # badges link to the right project pages.
          dependencies: |
            siegeweapons(required)
            small-ships(required)
            workers(required)
            recruits(required)
            ewewukeks-musket-mod(optional)
            epic-knights-armor-and-weapons(optional)
            corpse(optional)

          # Fail loudly if the jar glob matched nothing.
          fail-mode: fail
