name: Native Staged Stepped Perimeter QA

# Opt-in full stepped/gated acceptance. Actual production stage layout and applicable world restarts; no speed/refill changes.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: native-staged-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-staged-client:
    # Long full-completion coverage is opt-in when a specific risk warrants it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'native-staged-perimeter-qa'))
    runs-on: ubuntu-24.04
    timeout-minutes: 205
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Check out exact integrated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install standard virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Prepare new isolated perimeter directory
        run: |
          set -euo pipefail
          test ! -e build/native-staged-qa/client
          test ! -e build/native-staged-qa/evidence
          python3 -B -m unittest discover -s scripts/tests -p 'test_prepare_native_client_defaults.py'
          python3 scripts/prepare-native-client-defaults.py --mode staged-perimeter --smallships-version 2.0.0-b1.4
          mkdir -p build/native-staged-qa/evidence
          cp build/native-staged-qa/client/.native-smallships-defaults.json build/native-staged-qa/evidence/smallships-default-config-provenance.json
          printf 'onboardAccessibility:false\ntutorialStep:none\nrenderDistance:6\nsimulationDistance:6\nmaxFps:30\nvsync:false\n' > build/native-staged-qa/client/options.txt
          git rev-parse HEAD > build/native-staged-qa/evidence/source-commit.txt
          java -version 2> build/native-staged-qa/evidence/java-version.txt
      - name: Run full native staged stepped perimeter and applicable world restarts
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -euo pipefail
            glxinfo -B | tee build/native-staged-qa/evidence/opengl.txt
            timeout --signal=TERM --kill-after=60s 198m ./gradlew --no-daemon --console=plain --max-workers=2 -PnativeQa=true -PnativeQaMode=staged-perimeter runClient 2>&1 | tee build/native-staged-qa/evidence/client-console.log
          '
      - name: Audit exact loaded native API bytecode
        if: always()
        run: python3 scripts/audit-native-inventory-bytecode.py build/native-staged-qa/evidence
      - name: Verify complete staged authority and exact world evidence
        run: |
          python3 - <<'PYQA'
          import json
          from pathlib import Path
          root = Path('build/native-staged-qa/evidence')
          data = json.loads((root / 'result.json').read_text())
          audit = json.loads((root / 'native-bytecode-audit.json').read_text())
          assert audit['status'] == 'passed' and audit['noVendorJarsUploaded'], audit
          assert sum(len(v['classes']) for v in audit['artifacts'].values()) == 18, audit
          assert data['mode'] == 'staged-perimeter' and data['status'] == 'passed', data
          target_count = data['targetCount']
          materials = data['materialCounts']
          assert data['completedBlocks'] == target_count and data['treasuryDebit'] == 64, data
          assert sum(materials.values()) == target_count and materials['minecraft:dirt'] == data['fillTargets'] > 0, data
          assert data['nonLevelTransitionCount'] > 0 and data['transitionClearanceVerified'], data
          assert data['loweredSurfaceY'] in data['deckBaseLevels'] and data['flatSurfaceY'] in data['deckBaseLevels'], data
          step = data['terrainStepEvidence']
          assert step['loweredBandAtExpectedBase'] and step['transitionClearanceVerified'], step
          assert step['nonLevelTransitionCount'] == data['nonLevelTransitionCount'] and len(step['transitions']) > 0, step
          standing = data['completedStepStandingEvidence']
          assert standing['verified'] and standing['lowerCollisionFree'] and standing['higherCollisionFree'], standing
          assert standing['lowerFeetY'] == data['loweredSurfaceY'] + 4 and standing['higherFeetY'] == data['flatSurfaceY'] + 4, standing
          assert data['gateCount'] == 4 and len(data['gateCenters']) == 4, data
          assert data['nativeCompletionObserved'] and data['completedCaptureTerrainCompiled'], data
          assert data['completionAuthority'] in ['COMPLETE full durable project', 'COMPLETE compact terminal receipt'], data
          assert data['completionAuthorityNbt'] and len(data['manifestHash']) == 64, data
          assert 0 < data['constructionSeconds'] <= data['constructionLimitSeconds'] == 10800, data
          assert data['totalLimitSeconds'] == 11700 and data['territoryChunkCount'] == 25, data
          assert data['midStageRestartVerified'], data
          assert data['betweenStageRestartApplicable'] == (data['reviewedStageCount'] > 1), data
          assert data['betweenStageRestartVerified'] == data['betweenStageRestartApplicable'], data
          restarts = data['restarts']
          expected_restarts = ['mid-stage', 'between-stages'] if data['betweenStageRestartApplicable'] else ['mid-stage']
          assert [r['kind'] for r in restarts] == expected_restarts, restarts
          assert restarts[0]['projectState'] == 'RUNNING', restarts
          if data['betweenStageRestartApplicable']:
              assert restarts[1]['projectState'] == 'WAITING_FOR_NEXT_STAGE', restarts
          for restart in restarts:
              assert 0 < restart['placed'] < target_count and restart['placed'] + restart['pending'] == target_count, restart
          stages = data['stageLayout']
          assert len(stages) == data['reviewedStageCount'] >= 1, stages
          assert sum(s['targets'] for s in stages) == target_count, stages
          assert [s['index'] for s in stages] == list(range(len(stages))), stages
          assert len(set(s['area'] for s in stages)) == len(stages), stages
          joins = data['nativeStageJoins']
          assert set(j['area'] for j in joins) == set(s['area'] for s in stages), joins
          assert all(j['marker'] == data['originalMarker'] for j in joins), joins
          assert sum(not j['loadedFromDisk'] for j in joins) == len(stages), joins
          assert any(j['loadedFromDisk'] for j in joins), joins
          expected = ['01-live-core-stepped-gated-review.png', '02-free-stepped-gated-perimeter-review.png', '03-native-completed-staged-perimeter.png']
          assert data['screenshots'] == expected, data
          for name in expected:
              content = (root / name).read_bytes()
              assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) > 4096, name
          versions = data['loadedModVersions']
          assert versions['workers'] == '2.0.3' and versions['recruits'] == '1.15.2', versions
          assert versions['minecraft'] == '1.20.1' and versions['forge'] == '47.4.16', versions
          for mod in ['workers', 'recruits', 'smallships', 'siegeweapons']:
              assert len(data['loadedCompanionArtifacts'][mod]['sha256']) == 64, mod
          final, bank = data['finalDiagnostics'], data['treasuryAccounting']
          assert bank['startingFunds'] == 2000 and bank['commissionDebit'] == 64 and bank['initialPaidBalance'] == 1936, bank
          assert bank['singleNegativeLedgerDelta'] == -64, bank
          assert bank['expectedFinalBalance'] == 1936 + bank['interestCredits'] + bank['taxCredits'], bank
          assert final['placed'] == target_count and final['treasury'] == bank['expectedFinalBalance'], final
          assert len(data['treasuryObserverContracts']) == 10, data
          assert final['placedCobble'] == materials.get('minecraft:cobblestone', 0), final
          assert final['placedOak'] == materials.get('minecraft:oak_planks', 0), final
          assert final['placedDirt'] == materials.get('minecraft:dirt', 0), final
          supplied = {
              'Cobble': 3000,
              'Oak': 2000,
              'Dirt': 256,
          }
          for suffix, amount in supplied.items():
              accounted = final[f'placed{suffix}'] + final[f'chest{suffix}'] + final[f'builder{suffix}'] + final[f'owner{suffix}'] + final[f'loose{suffix}']
              assert accounted == amount, (suffix, accounted, final)
          print('Complete native staged stepped perimeter and applicable real restarts passed. Review raw framebuffers and authority/stock evidence.')
          PYQA
      - name: Collect diagnostics without companion JARs or worlds
        if: always()
        run: |
          mkdir -p build/native-staged-qa/evidence/logs
          if [ -d build/native-staged-qa/client/logs ]; then
            find build/native-staged-qa/client/logs -maxdepth 1 -type f -name '*.log' -exec cp {} build/native-staged-qa/evidence/logs/ \;
          fi
          if [ -d build/native-staged-qa/client/crash-reports ]; then
            cp -R build/native-staged-qa/client/crash-reports build/native-staged-qa/evidence/
          fi
      - name: Upload actual framebuffer and diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-staged-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-staged-qa/evidence/
          if-no-files-found: error
          retention-days: 7
