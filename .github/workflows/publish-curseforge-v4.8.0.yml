name: Publish tested 4.8.0 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.8.0]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.8.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34195567137
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.8.0.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'e7b236234b628b2b0ddc9dc9cccf02733d96bedca92eb2f55e5cce4b983522e2'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.8.0'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.8.0.jar
          name: The Siege Overhaul v4.8.0 beta - Veteran Builders and War Gate Roads
          version: v4.8.0
          version-type: beta
          changelog: |
            ## 4.8.0 beta
            
            - Veteran enemy builders: enchanted diamond armor and tools, gold trims, at least 60 health, four golden apples and finite food. Existing crew receives the kit once. No equipment or apple refills.
            - Native night shifts, modest movement and morale support, preserving native fleeing and storage behavior.
            - Three-wide stone-brick road between camp and gate with gentle one-block rises, shallow validated earthworks and full restoration. Existing gates gain roads where terrain safely permits.
            - Fix flower clearing incorrectly aborting native construction and forcing fallback workers that cannot reach the gate crest.
            - Match supplies to native placement ingredients, including non-block items omitted by Workers material lists. Request these through native storage AI.
            - One-time recovery for unfinished fallback gate jobs and empty gate cells left by old construction timeouts. Surviving builders required; player replacements preserved.
            - Gate status now identifies missing block types and coordinates.
            
            REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Minecraft 1.20.1 Forge, Java 17. Match Siege Overhaul versions.
            
            Validation: Java 17 clean build and 124 regression tests passed. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.8.0', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.8.0 beta: {result['url']}\n")
          RECEIPT
