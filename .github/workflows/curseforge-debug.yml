name: CurseForge upload debug

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish"
        required: true
        default: "v3.3.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain build -x test
          ls -la build/libs/
          sha256sum build/libs/*.jar

      - name: List CurseForge game versions
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -eu
          echo "=== Testing token / listing game version types ==="
          curl -sS -w "HTTP:%{http_code}\n" \
            -H "X-Api-Token: $CF_TOKEN" \
            "https://minecraft.curseforge.com/api/game/version-types" \
            -o /tmp/version-types.json
          head -c 2000 /tmp/version-types.json | head -40
          echo ""
          echo "=== Listing game versions ==="
          curl -sS -w "HTTP:%{http_code}\n" \
            -H "X-Api-Token: $CF_TOKEN" \
            "https://minecraft.curseforge.com/api/game/versions" \
            -o /tmp/versions.json
          # Find the ID for 1.20.1
          echo "1.20.1 version IDs:"
          python3 -c "
          import json
          with open('/tmp/versions.json') as f: data = json.load(f)
          for v in data:
              if '1.20.1' in v.get('name', '') or v.get('slug') == '1-20-1':
                  print(v)
          "

      - name: Upload to CurseForge (raw curl)
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -eu
          JAR=$(ls build/libs/siegeoverhaul-*.jar | head -1)
          echo "Uploading: $JAR"
          ls -la "$JAR"
          # Metadata per https://support.curseforge.com/en/support/solutions/articles/9000197321
          # gameVersions = list of game version IDs (integers). 9990 = 1.20.1
          cat > /tmp/metadata.json <<EOF
          {
            "changelog": "v3.3.0 Cross-mod compatibility. See https://github.com/boostbar9/Faction-Raids/releases/tag/v3.3.0",
            "changelogType": "markdown",
            "displayName": "The Siege Overhaul v3.3.0 - Cross-mod compatibility",
            "gameVersions": [9990],
            "releaseType": "release"
          }
          EOF
          cat /tmp/metadata.json
          echo ""
          echo "=== POST /api/projects/1364352/upload-file ==="
          METADATA=$(cat /tmp/metadata.json)
          curl -sS -w "\nHTTP:%{http_code}\n" -X POST \
            -H "X-Api-Token: $CF_TOKEN" \
            -F "metadata=$METADATA" \
            -F "file=@$JAR" \
            "https://minecraft.curseforge.com/api/projects/1364352/upload-file"
