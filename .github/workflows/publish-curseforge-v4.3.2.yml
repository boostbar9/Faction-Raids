name: Publish tested 4.3.2 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.3.2]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.3.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34185621288
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.3.2.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '9aab720ccff0da2b799446acb8f7d53ad5134d8cbffe3485eeded7c61f1dddd3'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.3.2'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.3.2.jar
          name: The Siege Overhaul v4.3.2 beta - Engineers, Ladders and Wave Artillery
          version: v4.3.2
          version-type: beta
          changelog: |
            ## 4.3.2 beta - Engineers, Ladders and Wave Artillery
            
            Fixes the Recruits 1.15.2 siege engineer spawn ClassCastException confirmed in player logs. A temporary compatible navigator allows the complete native initializer to run once; original native async navigation is restored before spawning. Applies to supplied mounted operators and infantry engineers, without retrying initialization or duplicating attribute bonuses.
            
            Includes the 4.3.1 changes, held from CurseForge pending this compatibility fix:
            
            Raiders approach tracked siege ladders, climb physical rungs and step onto clear wall tops. Movement/formation/straggler orders yield during climbing. Broken, blocked, unloaded or timed-out routes cancel, with up to three assignments per column. No teleporting.
            
            Formations apply only inside the defending faction's native Recruits claims. Travel and camp muster use normal walking. Combat, obstacles, climbing and final core capture release formation orders.
            
            Every assault wave requests a supplied ballista or catapult and native Siege Engineer, replacing the old 30% chance. Infantry reserves operator capacity and blocked deployments retry. Successful wave support persists across saves; killed crews do not respawn within the same wave. Global/faction limits and safe terrain requirements still apply. Mounted engineers receive native movement destinations and temporary nearby chunk loading to drive out of camp.
            
            Requires Minecraft 1.20.1 Forge, Java 17, Villager Recruits, Villager Workers 2, Small Ships and Siege Weapons. Install 4.3.2 on the server and every client.
            
            Validation: clean Java 17 build and all 89 regression tests passed. Interactive Minecraft testing unavailable; beta release.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.3.2', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.3.2 beta: {result['url']}\n")
          RECEIPT
