        run: |
          python3 - <<'CHECK'
          """Bind the full native evidence bytes and replay exact bounded receipt contracts.

          All validator sources below are embedded local copies, never fetched or executed
          from an artifact. Remote source identity is checked separately before download.
          """
          import hashlib
          import json
          import os
          from pathlib import Path
          import re


          def evidence_manifest(root):
              assert root.is_dir() and not root.is_symlink(), str(root)
              entries = []
              for path in sorted(root.rglob('*')):
                  assert not path.is_symlink(), 'Evidence symlink: ' + str(path)
                  if path.is_dir():
                      continue
                  assert path.is_file(), 'Unexpected evidence entry: ' + str(path)
                  raw = path.read_bytes()
                  entries.append({'path': path.relative_to(root).as_posix(), 'size': len(raw),
                                  'sha256': hashlib.sha256(raw).hexdigest()})
              assert entries, 'Empty native evidence'
              digest = hashlib.sha256(json.dumps(entries, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              return digest, entries


          def validator(text, name):
              namespace = {'__name__': 'embedded_' + name}
              exec(compile(text, '<reviewed-' + name + '-validator>', 'exec'), namespace)
              return namespace['verify']

          HUD_SOURCE = '#!/usr/bin/env python3\n"""Fail closed on incomplete actual HUD framebuffer/interaction receipts (stdlib only)."""\nimport json\nfrom pathlib import Path\nimport struct\nimport sys\n\n\nPAGES = [\'army\', \'loot\', \'treasury\', \'territory\', \'building\', \'civilians\', \'intel\']\nPLANS = [\'barricade\', \'watchtower\', \'gatehouse\', \'wall\', \'corner\', \'stairs\']\nMATRICES = [\'compact-scale2\', \'compact-scale3\', \'roomy-scale2\', \'roomy-scale1\']\nSTATES = [\'army-unavailable\', \'treasury-empty\', \'construction-loading\', \'construction-empty\',\n          \'civilians-capacity\', \'loot-confirmation\', \'intel-keyboard-e\', \'intel-no-results\',\n          \'intel-scrolled\', \'intel-keyboard-focus\', \'codex-core\', \'codex-how-to-play\',\n          \'codex-journal\', \'settings\', \'settings-no-results\', \'settings-scrolled\', \'hero-visuals\', \'native-inspection\']\n\n\ndef expected_screenshots():\n    names = []\n    for prefix in MATRICES:\n        names.extend(f\'{prefix}-{page}.png\' for page in PAGES)\n        names.extend(f\'{prefix}-{section}.png\' for section in [\n            \'building-structures\', \'building-construction\', \'intel-enemy-lore\', \'intel-how-to-play\'])\n        names.extend(f\'{prefix}-plan-{plan}.png\' for plan in PLANS)\n    for prefix in MATRICES[:2]:\n        names.extend(f\'{prefix}-{state}.png\' for state in STATES)\n    names.extend([\'roomy-scale1-native-inspection.png\', \'resized-intel-preserved.png\'])\n    return set(names)\n\n\ndef verify(root):\n    data = json.loads((root / \'result.json\').read_text())\n    assert data[\'mode\'] == \'hud\' and data[\'status\'] == \'passed\', data.get(\'failure\', data)\n    assert data[\'completedSteps\'] == data[\'plannedSteps\'] and data[\'plannedSteps\'] > 100\n    assert len(data[\'assertions\']) >= 25, data[\'assertions\']\n    versions = {\'minecraft\': \'1.20.1\', \'forge\': \'47.4.16\', \'workers\': \'2.0.3\',\n                \'recruits\': \'1.15.2\', \'smallships\': \'2.0.0-b1.4\', \'siegeweapons\': \'0.2.5\'}\n    for mod, version in versions.items():\n        assert data[\'loadedModVersions\'][mod] == version, mod\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        artifact = data[\'loadedCompanionArtifacts\'][mod]\n        assert len(artifact[\'sha256\']) == 64 and \'remapped\' in artifact[\'kind\'], mod\n    assert data[\'notCovered\'] and \'client-menu\' in data[\'coverage\']\n    expected = expected_screenshots()\n    assert len(data[\'screenshots\']) == len(expected) and set(data[\'screenshots\']) == expected, (\n        \'Missing\', sorted(expected - set(data[\'screenshots\'])), \'Extra\', sorted(set(data[\'screenshots\']) - expected))\n    views = {view[\'screenshot\']: view for view in data[\'views\']}\n    assert len(views) == len(expected) and set(views) == expected\n    for name in sorted(expected):\n        raw = (root / name).read_bytes()\n        assert raw.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and raw[12:16] == b\'IHDR\' and len(raw) > 4096, name\n        width, height = struct.unpack(\'>II\', raw[16:24])\n        view = views[name]\n        viewport = view[\'viewport\']\n        size = (1440, 960) if name.startswith(\'roomy-\') else (960, 720)\n        scale = 1 if name.startswith(\'roomy-scale1\') else 3 if \'scale3\' in name or name.startswith(\'resized-\') else 2\n        assert (width, height) == size == (viewport[\'framebufferWidth\'], viewport[\'framebufferHeight\']), name\n        assert (viewport[\'guiWidth\'], viewport[\'guiHeight\']) == (width // scale, height // scale), name\n        assert viewport[\'requestedGuiScale\'] == scale and view[\'nonblankSamples\'] > 50, name\n        assert view[\'fixture\'] and view[\'widgets\'], name\n        for widget in view[\'widgets\']:\n            assert 0 <= widget[\'x\'] < viewport[\'guiWidth\'] and 0 <= widget[\'y\'] < viewport[\'guiHeight\'], (name, widget)\n            assert widget[\'width\'] > 0 and widget[\'height\'] > 0, (name, widget)\n            assert widget[\'x\'] + widget[\'width\'] <= viewport[\'guiWidth\'] + .1, (name, widget)\n            assert widget[\'y\'] + widget[\'height\'] <= viewport[\'guiHeight\'] + .1, (name, widget)\n            assert not widget[\'focused\'] or widget[\'active\'], (name, widget)\n        for i, a in enumerate(view[\'widgets\']):\n            for b in view[\'widgets\'][i + 1:]:\n                assert (a[\'x\'] >= b[\'x\'] + b[\'width\'] or b[\'x\'] >= a[\'x\'] + a[\'width\']\n                        or a[\'y\'] >= b[\'y\'] + b[\'height\'] or b[\'y\'] >= a[\'y\'] + a[\'height\']), (name, a, b)\n        if name in {f\'{prefix}-army.png\' for prefix in MATRICES}:\n            assert len(view[\'nativePortraits\']) == 4, name\n            assert all(value.startswith(\'com.talhanation.\') for value in view[\'nativePortraits\']), name\n        if name.endswith(\'-territory.png\'):\n            assert view[\'territoryAvailability\'] == {\'ownershipMask\': 5, \'active\': 1, \'retained\': 1, \'unavailableButtons\': 2}, name\n            unavailable = [widget for widget in view[\'widgets\'] if widget[\'label\'] == \'Unavailable\']\n            assert len(unavailable) == 2 and all(not widget[\'active\'] for widget in unavailable), name\n        if \'-plan-\' in name:\n            assert view[\'selectedPlan\'].lower() == name.removesuffix(\'.png\').split(\'-plan-\')[1], name\n            cards = view[\'nativeBlueprintCards\']\n            assert any(card[\'plan\'] == view[\'selectedPlan\'] for card in cards), name\n            assert all(card[\'sourceBlueprintMatches\'] and card[\'blockModels\'] > 0 and card[\'caption\'] for card in cards), name\n        if \'native-inspection\' in name:\n            assert view[\'nativeStructurePreviewCount\'] == 1, name\n    required = [\'Native OS E key\', \'Native Ctrl+Tab\', \'Native Ctrl+Shift+Tab\', \'Native Escape\',\n                \'Actual 1440x960 to 960x720\', \'Hired, unavailable, insufficient\', \'without a purchase\',\n                \'Codex Journal\', \'focus across sync\', \'Settings empty-filter\']\n    for phrase in required:\n        assert any(phrase in assertion for assertion in data[\'assertions\']), phrase\n    source = (root / \'source-commit.txt\').read_text().strip()\n    assert len(source) == 40 and all(char in \'0123456789abcdef\' for char in source), source\n    print(f\'Verified {len(expected)} actual HUD framebuffers and bounded interaction receipts. Visual review remains required.\')\n    return data\n\n\nif __name__ == \'__main__\':\n    verify(Path(sys.argv[1] if len(sys.argv) > 1 else \'build/native-hud-qa/evidence\'))\n'

          ECONOMY_SOURCE = '#!/usr/bin/env python3\n"""Fail-closed checks for the bounded real-server economy receipt in Native Building QA."""\nimport json\nfrom pathlib import Path\nimport sys\nimport uuid\n\n\ndef verify(data):\n    gameplay = data[\'gameplay\']\n    assert data[\'status\'] == gameplay[\'status\'] == \'passed\', data\n    assert gameplay[\'manualTreasuryDebit\'] == 8 and gameplay[\'manualPaidTreasury\'] == 992, gameplay\n    assert gameplay[\'perimeterTreasuryDebit\'] == 64, gameplay\n    assert gameplay[\'completedManualRestart\'][\'treasury\'] == 992, gameplay\n    economy = gameplay[\'economy\']\n    assert economy[\'status\'] == \'passed\', economy\n    assert \'Controlled cleared-wave states\' in economy[\'scope\'], economy\n    assert \'production processRaid\' in economy[\'scope\'] and \'No raid combat was fought.\' in economy[\'scope\'], economy\n    territory = economy[\'territory\']\n    assert territory[\'unownedRejected\'] == territory[\'ownedRejected\'] == [0, 1], territory\n    assert territory[\'unavailableTreasuryDebit\'] == 0 and territory[\'personalInventoryUnchanged\'] is True, territory\n    assert territory[\'fixtureFunding\'] == 1500 and territory[\'workingPrices\'] == [900, 600], territory\n    assert territory[\'savedOwnershipMask\'] == 15 and territory[\'activeCount\'] == territory[\'retainedCount\'] == 2, territory\n    practice = economy[\'practice\']\n    assert practice == {\'wave\': 5, \'handlerPasses\': 2, \'boxes\': 0, \'treasuryDebitOrCredit\': 0}, practice\n    checkpoint = economy[\'checkpoint\']\n    assert checkpoint[\'wave\'] == 5 and checkpoint[\'boxes\'] == 1, checkpoint\n    assert checkpoint[\'beforeAnyBallot\'] is True and checkpoint[\'waitReplayNoDuplicate\'] is True, checkpoint\n    assert type(checkpoint[\'rolledTier\']) is int and 0 <= checkpoint[\'rolledTier\'] <= 3, checkpoint\n    assert type(checkpoint[\'treasuryReward\']) is int and checkpoint[\'treasuryReward\'] >= 0, checkpoint\n    assert checkpoint[\'treasury\'] == 992 + checkpoint[\'treasuryReward\'], checkpoint\n    reload = economy[\'diskReload\']\n    assert reload[\'ownershipMask\'] == 15 and reload[\'activeCount\'] == reload[\'retainedCount\'] == 2, reload\n    for field in [\'newSavedDataAndRaidInstances\', \'exactPlayerInventory\', \'exactCurrentWaveReceipt\', \'replayNoDuplicate\']:\n        assert reload[field] is True, (field, reload)\n    full = economy[\'fullInventory\']\n    assert full[\'wave\'] == 6 and full[\'filledMainSlots\'] == 36, full\n    assert full[\'droppedBoxes\'] == 1 and full[\'inventoryBoxes\'] == 0 and full[\'replayNoDuplicate\'] is True, full\n    assert type(full[\'rolledTier\']) is int and 0 <= full[\'rolledTier\'] <= 3, full\n    assert full[\'item\'] == \'siegeoverhaul:loot_box_\' + [\'common\', \'uncommon\', \'rare\', \'epic\'][full[\'rolledTier\']], full\n    assert str(uuid.UUID(full[\'dropEntity\'])) == full[\'dropEntity\'], full\n    return economy\n\n\nif __name__ == \'__main__\':\n    verify(json.loads(Path(sys.argv[1]).read_text()))\n    print(\'Native economy receipt passed: controlled cleared-wave server cases, not a fought raid.\')\n'

          BUILDING_SOURCE = '"""Offline replay of native-building-qa.yml receipt contract; original runtime-only filesystem assertions remain required in the source workflow."""\n\ndef verify(root):\n    import json, struct\n    from pathlib import Path\n    data = json.loads((root / \'result.json\').read_text())\n    audit = json.loads((root / \'native-bytecode-audit.json\').read_text())\n    assert audit[\'status\'] == \'passed\' and audit[\'noVendorJarsUploaded\'], audit\n    assert sum(len(v[\'classes\']) for v in audit[\'artifacts\'].values()) == 18, audit\n    assert data[\'status\'] == \'passed\', data\n    viewport = data[\'viewportSetup\']\n    assert viewport[\'framebufferWidth\'] == viewport[\'windowWidth\'] == 960, viewport\n    assert viewport[\'framebufferHeight\'] == viewport[\'windowHeight\'] == 720, viewport\n    for name in [\'nativeInspectionScale3\', \'buildingScale3\']:\n        compact = data[\'guiScaleEvidence\'][name]\n        assert compact[\'framebufferWidth\'] == 960 and compact[\'framebufferHeight\'] == 720, compact\n        assert compact[\'requestedGuiScale\'] == 3 and compact[\'guiWidth\'] == 320 and compact[\'guiHeight\'] == 240, compact\n    assert data[\'gameplay\'][\'status\'] == \'passed\', data.get(\'gameplay\')\n    gameplay = data[\'gameplay\']\n    assert gameplay[\'completedManualBlocks\'] == 83 and data[\'perimeterTemplateBlocks\'] == 572, data\n    assert gameplay[\'manualHollowGeometry\'] == {\'targets\': 83, \'cobblestone\': 58, \'oakPlanks\': 25,\n        \'cavityCells\': 27, \'cavityReservedAtAcceptance\': True, \'airPlacementTargets\': 0}, gameplay\n    assert gameplay[\'cavityObstructionPaused\'] and gameplay[\'cavityObstructionRestartVerified\'], gameplay\n    assert gameplay[\'nativeDeckOverCavityVerified\'] and gameplay[\'finalCavityAirCells\'] == 27, gameplay\n    assert gameplay[\'unchangedCavityFootingColumns\'] == 9, gameplay\n    completed = gameplay[\'completedManualRestart\']\n    assert completed[\'verified\'] and completed[\'preAiExactInventoryValues\'] and completed[\'preAiEqualSplitMirror\'], completed\n    assert completed[\'singleValuePreservingRebind\'] and completed[\'constructionDetached\'] and completed[\'reservationRetired\'], completed\n    assert completed[\'placedBlocks\'] == 83 and completed[\'cavityAirCells\'] == 27, completed\n    projection = data[\'gameplay\'][\'perimeterProjection\']\n    assert projection[\'alwaysShownThreshold\'] == 1024 and projection[\'activeTargets\'] > 0, projection\n    assert projection[\'defaultAlwaysShown\'] == (projection[\'activeTargets\'] <= 1024), projection\n    assert projection[\'wholeTargets\'] >= projection[\'activeTargets\'], projection\n    assert data[\'gameplay\'][\'authenticatedProjectionHide\'] and data[\'gameplay\'][\'authenticatedProjectionShow\'], data\n    canceled = data[\'gameplay\'][\'canceledWholePerimeter\']\n    assert canceled[\'globalTargets\'] == projection[\'wholeTargets\'] and canceled[\'stageCount\'] >= 1 and canceled[\'treasury\'] == 1936, canceled\n    expected = [\n        \'01-marker-focused.png\', \'02-native-inspection-scale2.png\',\n        \'03-native-inspection-scale3.png\', \'04-projection-unfocused.png\',\n        \'05-projection-focus-only.png\', \'06-projection-marker-behind-camera.png\',\n        \'07-marker-occluded.png\', \'08-marker-after-world-reload.png\',\n        \'09-building-auto-perimeter.png\', \'10-building-place-structure.png\',\n        \'11-building-construction.png\', \'12-building-construction-compact.png\',\n        \'13-native-perimeter-template.png\',\n        \'14-production-free-perimeter-review.png\', \'15-production-paid-native-marker.png\',\n        \'16-live-core-building-auto.png\', \'17-live-core-construction.png\',\n        \'18-completed-manual-wall-and-builder.png\',\n    ]\n    assert data[\'screenshots\'] == expected, data[\'screenshots\']\n    for name in expected:\n        content = (root / name).read_bytes()\n        assert content.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(content) > 4096, name\n        assert struct.unpack(\'>II\', content[16:24]) == (960, 720), name\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert mod in data[\'loadedModVersions\'], mod\n        artifact = data[\'loadedCompanionArtifacts\'][mod]\n        assert len(artifact[\'sha256\']) == 64, artifact\n    assert data[\'loadedModVersions\'][\'minecraft\'] == \'1.20.1\', data\n    assert data[\'loadedModVersions\'][\'forge\'] == \'47.4.16\', data\n    print(\'Actual native-client fixture passed. See screenshots for visual review and result.json for exclusions.\')\n    return data\n'

          SERVER_SOURCE = '"""Offline replay of native-building-server-qa.yml receipt contract; original runtime-only filesystem assertions remain required in the source workflow."""\n\ndef verify(root):\n    import json\n    from pathlib import Path\n    data = json.loads((root / \'result.json\').read_text())\n    assert data[\'status\'] == \'passed\', data\n    assert data[\'testsExecuted\'] == 1, data\n    assert data[\'physicalDistribution\'] == \'DEDICATED_SERVER\', data\n    assert data[\'logicalSide\'] == \'SERVER\', data\n    assert data[\'serverClass\'] == \'net.minecraft.gametest.framework.GameTestServer\', data\n    assert data[\'connectedPlayers\'] == 0, data\n    assert data[\'fixtureActor\'] == \'net.minecraftforge.common.util.FakePlayer; no authenticated network client\', data\n    assert \'real multiplayer connection/authentication remains unverified\' in data[\'limitation\'], data\n    expected = [\n        \'physical-dedicated-classloading\',\n        \'real-native-factories-and-queues\',\n        \'sealed-native-packets-and-move-overloads\',\n        \'native-nbt-roundtrip-and-defensive-copies\',\n        \'unloaded-blueprint-remains-unloaded\',\n        \'clearance-and-world-saveddata-disk-roundtrip\',\n        \'fakeplayer-direct-handler-authorization-and-cancel\',\n        \'offline-native-inventory-authority-and-loss-recovery\',\n    ]\n    assert data[\'checks\'] == expected, data\n    console = (root / \'server-console.log\').read_text()\n    assert console.count(\'SIEGE_NATIVE_SERVER_QA_COMPLETED tests=1 checks=8\') == 1, console[-5000:]\n    authority = data[\'inventoryAuthority\']\n    assert authority[\'ownerConnected\'] is False, authority\n    assert authority[\'profileCacheSource\'] == \'Explicit isolated GameProfileCache dependency; GameTest server cache remains absent\', authority\n    assert \'cached UUID identity\' in authority[\'productionEntryWithoutProfileCache\'], authority\n    assert authority[\'profileRepositoryLookups\'] == 0, authority\n    assert authority[\'coreAnchorDiskRoundTrip\'] == \'passed\', authority\n    assert authority[\'scoreboardDiskRoundTrip\'] == \'passed\', authority\n    assert authority[\'nativeRosterMembersBeforeDisk\'] == 1, authority\n    assert authority[\'nativeRosterMembersAfterDisk\'] == 0, authority\n    for allowed in [\'offline-native-owner-valid\', \'native-manager-disk-reload-valid\', \'membership-restored\',\n                    \'native-roster-name-restored\', \'native-roster-uuid-restored\', \'identity-conflicts-restored\',\n                    \'scoreboard-restored\', \'worker-owner-restored\', \'source-claim-restored\',\n                    \'original-core-restored\', \'valid-context-restored\']:\n        assert authority[\'outcomes\'][allowed] == \'allowed\', (allowed, authority)\n    for denied in [\'removed-native-member\', \'stale-native-roster-name\', \'conflicting-native-roster-uuid\',\n                   \'stale-cached-profile-name\', \'scoreboard-transferred\', \'worker-owner-transferred\',\n                   \'foreign-source-claim\', \'unloaded-source-denied\', \'original-core-lost\', \'original-anchor-lost\']:\n        assert authority[\'outcomes\'][denied].startswith(\'Paused:\'), (denied, authority)\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert mod in data[\'loadedModVersions\'], mod\n        assert len(data[\'loadedCompanionArtifacts\'][mod][\'sha256\']) == 64, mod\n    for mod, version in {\'minecraft\': \'1.20.1\', \'forge\': \'47.4.16\', \'workers\': \'2.0.3\', \'recruits\': \'1.15.2\'}.items():\n        assert data[\'loadedModVersions\'][mod] == version, data\n    print(\'Required Forge GameTest passed on the physical dedicated distribution. Real multiplayer remains unverified.\')\n    return data\n'


          def main():
              summary = {'protocol': 20, 'native_gates': {}}
              for prefix, directory in [('HUD', 'native-hud'), ('BUILDING', 'native-building'), ('SERVER', 'native-server')]:
                  root = Path(directory)
                  expected = os.environ[prefix + '_EVIDENCE_SHA256']
                  assert re.fullmatch(r'[0-9a-f]{64}', expected), 'Unfilled native evidence pin: ' + prefix
                  digest, manifest = evidence_manifest(root)
                  assert digest == expected, 'Native evidence bytes differ from reviewed artifact: ' + prefix
                  checkout = (root / 'source-commit.txt').read_text().strip()
                  assert checkout == os.environ[prefix + '_CHECKOUT_SHA'], 'Native checkout differs: ' + prefix
                  data = json.loads((root / 'result.json').read_text())
                  if prefix == 'HUD':
                      validator(HUD_SOURCE, 'hud')(root)
                  elif prefix == 'BUILDING':
                      validator(BUILDING_SOURCE, 'building')(root)
                      validator(ECONOMY_SOURCE, 'economy')(data)
                  else:
                      validator(SERVER_SOURCE, 'server')(root)
                  summary['native_gates'][prefix.lower()] = {
                      'run_id': int(os.environ[prefix + '_RUN_ID']),
                      'run_attempt': int(os.environ[prefix + '_RUN_ATTEMPT']),
                      'artifact_id': int(os.environ[prefix + '_ARTIFACT_ID']),
                      'checkout_sha': checkout, 'evidence_sha256': digest,
                      'files': manifest,
                  }
              summary['coverage_limits'] = [
                  'HUD is actual client-menu framebuffer/input evidence; it does not prove server payments.',
                  'Economy uses controlled cleared-wave states through production processRaid; no raid combat was fought.',
                  'Building remains bounded representative native construction, not full-territory completion.',
                  'Dedicated Forge GameTest uses FakePlayer with zero authenticated clients; real multiplayer remains unverified.',
                  'Saved reward receipts cover conservative replay/save-load idempotence, not crash-atomic cross-file transactions.',
              ]
              Path('verified-native-evidence.json').write_text(json.dumps(summary, sort_keys=True, indent=2) + '\n')
              print('Validated exact reviewed HUD, Building/economy and dedicated-side evidence. Coverage limits retained.')


          if __name__ == '__main__':
              main()
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-retry-attempts: 1
          files: dist/siegeoverhaul-4.52.4.jar
          name: The Siege Overhaul v4.52.4 - Clearer emerald costs and earned rewards
          version: v4.52.4
          version-type: release
          changelog: |
            Back up your world, then update the server and all clients together. This release uses protocol 20, so older clients cannot join. Existing worlds and accepted building jobs remain compatible.

            - New manual commissions cost 8 emeralds for walls or corners, 12 for stairs or barricades, 32 for watchtowers and 48 for gatehouses. The whole-perimeter fee stays 64. Fees come from the faction Treasury; builders, materials and work time are still separate. Older unpaid plans need a fresh review.
            - Fortified Walls and Watchtower territory upgrades are unavailable while their advertised effects are missing. Previous ownership stays saved and is shown separately from active benefits. Provisioning and Iron Levy are unchanged.
            - Eligible wave rewards arrive before checkpoint retreat decisions and keep a saved once-only result. Reward-disabled practice raids no longer give wave boxes or bonus barrel emeralds. Barrel bonuses require a current defending player.
            - Older ongoing raids with an ambiguous reward history do not backfill the current wave’s box; later waves use the new receipt.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            ftb-chunks-forge(optional)
            open-parties-and-claims(optional)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
            curios(optional)
            epic-knights-addon(optional)
          fail-mode: fail

      - if: steps.guard.outputs.publish == 'true'
        name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          """Record accepted upload; public moderation/download checks remain separate."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlsplit


          def main():
              digest = hashlib.sha256(Path('dist/siegeoverhaul-4.52.4.jar').read_bytes()).hexdigest()
              assert digest == Path('verified-sha256.txt').read_text() == os.environ['ARTIFACT_SHA256']
              source = json.loads(Path('verified-source.json').read_text())
              regressions = json.loads(Path('verified-regressions.json').read_text())
              assert source['reviewed_source'] == os.environ['REVIEWED_SOURCE_SHA']
              assert source['merged_source'] == os.environ['MERGED_SOURCE_SHA']
              assert source['source_tree'] == os.environ['SOURCE_TREE_SHA']
              assert source['build_run'] == int(os.environ['BUILD_RUN_ID'])
              assert source['build_attempt'] == int(os.environ['BUILD_RUN_ATTEMPT'])
              assert source['artifacts'] == {
                  'Faction-Raids-Forge-1.20.1': int(os.environ['JAR_ARTIFACT_ID']),
                  'regression-test-results': int(os.environ['REGRESSION_ARTIFACT_ID']),
              }
              assert source['pull_request'] == 262
              assert regressions == {
                  'tests': int(os.environ['REGRESSION_TEST_COUNT']),
                  'suites': int(os.environ['REGRESSION_SUITE_COUNT']),
                  'failures': 0, 'errors': 0, 'skipped': 0,
                  'suite_manifest_sha256': os.environ['REGRESSION_SUITE_SHA256'],
              }
              assert source['reviewed_build'] == {
                  'run_id': int(os.environ['REVIEWED_BUILD_RUN_ID']),
                  'run_attempt': int(os.environ['REVIEWED_BUILD_RUN_ATTEMPT']),
                  'artifacts': {'Faction-Raids-Forge-1.20.1': int(os.environ['REVIEWED_JAR_ARTIFACT_ID']),
                                'regression-test-results': int(os.environ['REVIEWED_REGRESSION_ARTIFACT_ID'])},
              }
              suite_counts = json.loads(Path('verified-suite-counts.json').read_text())
              assert len(suite_counts) == int(os.environ['REGRESSION_SUITE_COUNT'])
              assert sum(suite_counts.values()) == int(os.environ['REGRESSION_TEST_COUNT'])
              assert hashlib.sha256(json.dumps(suite_counts, sort_keys=True, separators=(',', ':')).encode()).hexdigest() == os.environ['REGRESSION_SUITE_SHA256']
              native = json.loads(Path('verified-native-evidence.json').read_text())
              assert native['protocol'] == 20
              assert set(native['native_gates']) == {'hud', 'building', 'server'}
              for prefix in ('HUD', 'BUILDING', 'SERVER'):
                  gate = native['native_gates'][prefix.lower()]
                  for field in ('run_id', 'run_attempt', 'artifact_id'):
                      assert gate[field] == int(os.environ[prefix + '_' + field.upper()])
                  assert gate['checkout_sha'] == os.environ[prefix + '_CHECKOUT_SHA']
                  assert gate['evidence_sha256'] == os.environ[prefix + '_EVIDENCE_SHA256']
              assert len(native['coverage_limits']) == 5
              file_id = os.environ['RELEASE_FILE_ID']
              url = os.environ['RELEASE_URL']
              assert re.fullmatch(r'[1-9][0-9]*', file_id), 'Missing or invalid accepted CurseForge file ID'
              location = urlsplit(url)
              assert location.scheme == 'https' and location.hostname in ('www.curseforge.com', 'curseforge.com')
              assert location.path.rstrip('/') == '/minecraft/mc-mods/siege-overhaul/files/' + file_id, 'Project/file ID/URL mismatch'
              assert not location.query and not location.fragment, 'Unexpected receipt URL suffix'
              assert not location.username and not location.password
              result = {
                  'version': '4.52.4', 'version_type': 'release', 'curseforge_project': 1364352,
                  'file_id': file_id, 'url': url,
                  'status': 'accepted_upload', 'public_availability': 'not_yet_verified',
                  'pull_request': 262, 'reviewed_source': source['reviewed_source'],
                  'tested_source': source['merged_source'], 'merged_source': source['merged_source'],
                  'source_tree': source['source_tree'], 'build_run': source['build_run'],
                  'build_attempt': source['build_attempt'], 'artifacts': source['artifacts'],
                  **regressions, 'sha256': digest,
                  'protocol': 20, 'native_evidence': native,
                  'reviewed_build': source['reviewed_build'], 'suite_counts': suite_counts,
                  'publisher_run': int(os.environ['GITHUB_RUN_ID']),
                  'publisher_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')),
              }
              Path('curseforge-4.52.4-receipt.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
              print(json.dumps(result, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Accepted upload (moderation/public availability separate): '
                                + json.dumps(result, sort_keys=True) + '\n')


          if __name__ == '__main__':
              main()
          RECEIPT
