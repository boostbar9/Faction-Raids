name: Publish tested 4.49.5 beta to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.49.5]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.49.5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify successful merged-main build and identical PR tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request

          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          source_sha = 'fe71ba1765bebc93e07b6cd8c49ad0bbb62aac8c'
          source_tree = '1c82ece86428c6fc05b1e5096ffa533e92d8eea3'
          pr_head_sha = 'cac7dca70e1dbbbde66a1c805edc5a89bdd13d42'
          run = get('actions/runs/36351142124')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == source_sha
          pr = get('pulls/208')
          assert pr['merged'] and pr['merge_commit_sha'] == source_sha
          assert pr['head']['sha'] == pr_head_sha
          for sha in (run['head_sha'], pr['merge_commit_sha'], pr_head_sha):
              assert get('git/commits/' + sha)['tree']['sha'] == source_tree
          CHECK

      - name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 36351142124
          github-token: ${{ github.token }}
          path: dist

      - name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          run-id: 36351142124
          github-token: ${{ github.token }}
          path: regression

      - name: Verify tested bytes, metadata, dependencies, and regressions
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib, json
          import xml.etree.ElementTree as ET

          jar = Path('dist/siegeoverhaul-4.49.5.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '36a7650500fe84e5b508c9a07a09ccf24199290dae48fefd7618a21781f5803c'
          Path('verified-sha256.txt').write_text(digest)
          with zipfile.ZipFile(jar) as archive:
              assert archive.testzip() is None
              entries = set(archive.namelist())
              for entry in (
                  'com/devfarinsky/siegeoverhaul/RaidEvents.class',
                  'com/devfarinsky/siegeoverhaul/items/OlympianLoot.class',
                  'com/devfarinsky/siegeoverhaul/items/OlympianRelicItem.class',
                  'com/devfarinsky/siegeoverhaul/items/OlympianRelics.class',
                  'com/devfarinsky/siegeoverhaul/items/OlympianSupplyPowers.class',
                  'com/devfarinsky/siegeoverhaul/items/EnemyLootDrops.class',
                  'com/devfarinsky/siegeoverhaul/compat/CuriosCompat.class',
                  'data/curios/tags/items/charm.json',
                  'data/siegeoverhaul/curios/entities/players.json',
                  'assets/siegeoverhaul/models/item/forge_ember.json',
                  'assets/siegeoverhaul/models/item/owl_seal.json',
                  'assets/siegeoverhaul/models/item/sun_laurel.json',
                  'com/devfarinsky/siegeoverhaul/items/LootBoxItem.class',
                  'com/devfarinsky/siegeoverhaul/naval/NavalFleet.class',
                  'com/devfarinsky/siegeoverhaul/siege/EngineerSupplies.class',
                  'com/devfarinsky/siegeoverhaul/camp/CampDevelopment.class',
                  'com/devfarinsky/siegeoverhaul/camp/CampScouting.class',
                  'com/devfarinsky/siegeoverhaul/camp/CampStructures.class',
                  'com/devfarinsky/siegeoverhaul/camp/CampStarterPavilion.class',
                  'com/devfarinsky/siegeoverhaul/camp/CampBlockState.class',
                  'com/devfarinsky/siegeoverhaul/core/BuilderGroundRecovery.class',
                  'com/devfarinsky/siegeoverhaul/camp/NativeCampConstruction.class',
                  'com/devfarinsky/siegeoverhaul/narrative/OlympianPresentation.class',
                  'com/devfarinsky/siegeoverhaul/compat/RaiderDiplomacy.class',
                  'com/devfarinsky/siegeoverhaul/core/CaptureRing.class',
                  'com/devfarinsky/siegeoverhaul/core/EnemyCoreApproach.class',
                  'com/devfarinsky/siegeoverhaul/camp/CampBuilderAccess.class',
                  'com/devfarinsky/siegeoverhaul/core/CoreOccupation.class',
                  'com/devfarinsky/siegeoverhaul/compat/WorkersBridge.class',
                  'com/devfarinsky/siegeoverhaul/compat/CampClaims.class',
                  'com/devfarinsky/siegeoverhaul/core/PlayerFortificationJobs.class',
                  'com/devfarinsky/siegeoverhaul/client/CoreHireScreen.class',
                  'com/devfarinsky/siegeoverhaul/core/CoreCommandPage.class',
                  'com/devfarinsky/siegeoverhaul/core/CoreTabStrip.class',
                  'com/devfarinsky/siegeoverhaul/core/HeroCasting.class',
                  'com/devfarinsky/siegeoverhaul/core/HeroCastPackets.class',
                  'com/devfarinsky/siegeoverhaul/client/HeroCastVisuals.class',
                  'com/devfarinsky/siegeoverhaul/client/HeroCastingModel.class',
                  'com/devfarinsky/siegeoverhaul/client/OlympianWeaponModels.class',
                  'com/devfarinsky/siegeoverhaul/items/OlympianWeaponSkins.class',
                  'com/devfarinsky/siegeoverhaul/items/CreativeCatalog.class',
                  'com/devfarinsky/siegeoverhaul/items/OlympianSpellBookItem.class',
                  'com/devfarinsky/siegeoverhaul/items/UnitSpawnEggItem.class',
                  'assets/siegeoverhaul/models/item/tempest_spellbook.json',
                  'assets/siegeoverhaul/models/item/inferno_spellbook.json',
                  'assets/siegeoverhaul/models/item/undertow_spellbook.json',
              ):
                  assert entry in entries, entry
              assert b'm_20148_' in archive.read(
                  'com/devfarinsky/siegeoverhaul/core/PlayerFortificationJobs.class'
              ), 'Expected reobfuscated Minecraft method name'
              models = [n for n in entries if n.startswith('assets/siegeoverhaul/models/item/olympian/') and n.endswith('.json')]
              assert len(models) == 128, len(models)
              model_digest = hashlib.sha256()
              for name in sorted(models):
                  model_digest.update(Path(name).name.encode())
                  model_digest.update(bytes([0]))
                  model_digest.update(archive.read(name))
                  model = json.loads(archive.read(name))
                  assert len(model['elements']) <= 24
                  assert all('uv' in face for element in model['elements'] for face in element['faces'].values())
              assert model_digest.hexdigest() == '63409cea1d728bdfd5afc7a9aa766304c903d738fed640382115ce1812bc9e51'

              data = tomllib.loads(archive.read('META-INF/mods.toml').decode())
          mod = data['mods'][0]
          assert mod['modId'] == 'siegeoverhaul' and mod['version'] == '4.49.5'
          assert mod['displayTest'] == 'MATCH_VERSION'
          dependencies = {entry['modId']: entry for entry in data['dependencies']['siegeoverhaul']}
          for mod_id in ('recruits', 'workers', 'smallships', 'siegeweapons'):
              assert dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['recruits']['versionRange'] == '[1.15.2,)'
          assert dependencies['workers']['versionRange'] == '[2.0.3,)'
          for mod_id in ('ftbchunks', 'openpartiesandclaims', 'corpse', 'magistuarmory', 'musketmod', 'curios'):
              assert not dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['curios']['versionRange'] == '[5.14.1,6)'
          assert not any(n.startswith('top/theillusivec4/curios/') for n in entries), 'Curios must not be bundled'
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          reports = list(Path('regression').rglob('TEST-*.xml'))
          assert reports
          for report in reports:
              result = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(result.get(key, 0))
          assert totals == {'tests': 676, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          print('Verified', jar.name, digest, totals)
          CHECK

      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.49.5.jar
          name: The Siege Overhaul v4.49.5 beta - Blessed Supplies and Curios
          version: v4.49.5
          version-type: beta
          changelog: |
            # 4.49.5 beta

            - Blessed loot supplies have real sneak-use powers. Tooltips state the exact cost, effects and durations; normal use and crafting remain available.
            - Supply powers share a 10-second cooldown and do not spend items on ineffective uses. Existing stronger effects are preserved.
            - Eligible siege raiders have a 2.5% box-drop chance: 2% Common, 0.5% Uncommon. Creative kills, untracked spawns, canceled drops and disabled mob loot are excluded.
            - Optional Curios 5.14.1+ support: equip Forge Ember (+1 toughness), Owl Seal (+2 armor), or Sun Laurel (+1 maximum heart) in the charm slot. Wearing never consumes the relic; no periodic inventory scans.
            - Curios is optional; install on server and clients to use its slots. Existing four required mods remain required. Prices stay 16/48/96 emeralds.
            - Forge Java 17 build and 676 automated tests passed. No interactive Minecraft/Curios playtest was performed.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            ftb-chunks-forge(optional)
            open-parties-and-claims(optional)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
            curios(optional)
          fail-mode: fail

      - name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os, hashlib
          from pathlib import Path
          digest = hashlib.sha256(Path('dist/siegeoverhaul-4.49.5.jar').read_bytes()).hexdigest()
          assert digest == Path('verified-sha256.txt').read_text()
          result = {
              'version': '4.49.5',
              'file_id': os.environ['RELEASE_FILE_ID'],
              'url': os.environ['RELEASE_URL'],
              'source': 'fe71ba1765bebc93e07b6cd8c49ad0bbb62aac8c',
              'source_tree': '1c82ece86428c6fc05b1e5096ffa533e92d8eea3',
              'pr_head': 'cac7dca70e1dbbbde66a1c805edc5a89bdd13d42',
              'build_run': 36351142124,
              'tests': 676,
              'sha256': digest,
          }
          assert result['file_id'] and result['url']
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Accepted upload (moderation/public availability separate): ' + json.dumps(result) + '\n')
          RECEIPT
