name: Publish tested 4.8.2 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.8.2]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.8.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34198162072
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.8.2.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '46ef193dbc401d8d6fee469b1194b6c9c0a8d0cce1df8e45f5bfdaa477e33bd9'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.8.2'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.8.2.jar
          name: The Siege Overhaul v4.8.2 beta - Wall Crossings and Flanking Routes
          version: v4.8.2
          version-type: beta
          changelog: |
            ## 4.8.2 beta
            
            - Ladder crossing orders continue over the wall top to a checked inside landing instead of ending at the outer lip. Cross up to eight blocks and descend up to six, using normal gravity and fall damage. Reject deep, obstructed or hazardous landings.
            - Commanders do not start wall strikes while assigned to a siege ladder.
            - Blocked raiders search both flanks for reachable walking routes around walls and corners, with short backward detours when needed.
            - Check ground up to four blocks higher or lower at 8- and 16-block offsets. Candidates need a reachable navigation path, clear standing space and safe footing.
            - Alternate the preferred side between searches. Limit expensive path checks to twelve every four seconds per stuck raider.
            - Suspend formation marching during a detour until arrival or ten seconds, preventing formation orders from pulling units back toward an obstruction.
            - Existing ladders, sappers, siege equipment and core capture remain. No teleportation or terrain editing added by this route search.
            
            REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Minecraft 1.20.1 Forge, Java 17. Match Siege Overhaul versions.
            
            Validation: Java 17 clean build and 132 regression tests passed. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.8.2', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.8.2 beta: {result['url']}\n")
          RECEIPT
