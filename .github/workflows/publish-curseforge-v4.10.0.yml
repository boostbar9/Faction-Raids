name: Publish tested 4.10.0 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.10.0]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.10.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34233857015
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.10.0.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '7c529ca219139d5f1e3bcd8072071db5811e984e58d45630de1b2d66471489df'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.10.0'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.10.0.jar
          name: The Siege Overhaul v4.10.0 beta - Siege Orders and Mystery Loot
          version: v4.10.0
          version-type: beta
          changelog: |
            ## 4.10.0 beta
            
            - Disable ambient wandering and patrol goals for siege troops; revalidate retained targets and gate positions after native initialization.
            - Engineers come from supplied equipment deployment instead of uncrewed infantry slots. Bind native controllers explicitly and allow living dismounted crews to return to their assigned engines.
            - Catapults use a 48-block standoff, outside their minimum firing range. Ballistas retain 24 blocks.
            - Replace loot item previews with sealed mystery boxes, a three-second reel-style reveal, sound feedback and server-confirmed results. Rarity odds remain visible.
            - Loot-box prices are now 16 / 48 / 96 emeralds. Purchases retain inventory capacity checks and cooldown protection; closing the screen does not lose paid rewards.
            - Network protocol is now 12. Update server and every client together.
            
            REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Minecraft 1.20.1 Forge, Java 17. Match Siege Overhaul versions.
            
            Validation: Java 17 clean build and 143 regression tests passed. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.10.0', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.10.0 beta: {result['url']}\n")
          RECEIPT
