name: Publish tested 4.11.0 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.11.0]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.11.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34317491068
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.11.0.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '26a61287ee950a8e0cc40e3bf742fe5bd49efaf9048bb88cb1eae302c6417134'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.11.0'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          for mod in ['corpse', 'magistuarmory', 'musketmod']:
              assert not dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.11.0.jar
          name: The Siege Overhaul v4.11.0 beta - Arcane Command Center and Endless Sieges
          version: v4.11.0
          version-type: beta
          changelog: |
            ## 4.11.0 beta

            - Persistent faction bank with wave rewards, member deposits, leader withdrawals and configurable daily interest (default 1% per real 24-hour day).
            - Endless escalating siege chapters with staged reinforcements under existing active limits. Every five cleared waves offers a strict-majority retreat vote; votes and payouts survive reloads.
            - Capture the enemy command core at its War Gate to defeat the invasion early.
            - Magical crystal core and compact Army & Heroes, Loot & Buffs, and Bank & Faction tabs.
            - Five-minute Speed I, Strength I and Resistance I blessings for 16/24/32 personal emeralds. Existing effects preserved. Mystery boxes keep 16/48/96 prices and audiovisual reveals.
            - Restored formations along the approach, retaining collision and combat releases.
            - Bounded optional Corpse cleanup: known new siege NPC bodies become normal dropped loot after two minutes; empty bodies clear after one minute. Nonempty player/unknown bodies remain intact; failed drops roll back. Timers configurable.

            Minecraft 1.20.1 Forge, Java 17. REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Matching Siege Overhaul versions required. Corpse, Epic Knights and ewewukek's Musket Mod remain optional.

            Validation: clean Java 17 Forge build, 201 passing regression tests, zero failures/errors/skipped. Exact tested reobfuscated artifact. No interactive Minecraft playtest. Older unclassified nonempty corpses are preserved; converted loot follows normal item despawn rules. Beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.11.0', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.11.0 beta: {result['url']}\n")
          RECEIPT
