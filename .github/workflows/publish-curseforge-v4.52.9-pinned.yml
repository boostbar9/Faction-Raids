                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)


          def review_threads(pr_number):
              query = 'query($number:Int!){repository(owner:"boostbar9",name:"Faction-Raids"){pullRequest(number:$number){reviewThreads(first:100){pageInfo{hasNextPage} nodes{id isResolved isOutdated comments(first:1){nodes{author{login} body}}}}}}}'
              request = urllib.request.Request('https://api.github.com/graphql',
                  data=json.dumps({'query': query, 'variables': {'number': pr_number}}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert not result.get('errors'), 'Review-thread query failed'
              threads = result['data']['repository']['pullRequest']['reviewThreads']
              assert threads['pageInfo']['hasNextPage'] is False, 'Review threads truncated'
              assert isinstance(threads['nodes'], list)
              return threads['nodes']


          def verify_reviewed_run(prefix, name, path, artifacts, expected_sha=None, expected_pr=None):
              expected_sha = expected_sha or os.environ['REVIEWED_SOURCE_SHA']
              expected_pr = expected_pr or int(os.environ['PULL_REQUEST_NUMBER'])
              run_id = os.environ[prefix + '_RUN_ID']
              run = get('actions/runs/' + run_id)
              assert run['id'] == int(run_id)
              assert run['run_attempt'] == int(os.environ[prefix + '_RUN_ATTEMPT']), 'Reviewed gate attempt changed: ' + prefix
              assert run['status'] == 'completed' and run['conclusion'] == 'success', prefix
              assert run['event'] in ('pull_request', 'workflow_dispatch'), prefix
              assert run['head_sha'] == expected_sha, 'Wrong final PR head: ' + prefix
              assert run['name'] == name and run['path'] == path, prefix
              assert run['repository']['full_name'] == run['head_repository']['full_name'] == 'boostbar9/Faction-Raids', prefix
              assert get('actions/workflows/' + str(run['workflow_id']))['path'] == path, prefix
              if run['event'] == 'pull_request':
                  associations = run['pull_requests']
                  assert isinstance(associations, list), 'Malformed run PR associations: ' + prefix
                  if not associations:
                      # GitHub may return an empty run association list after merge. Resolve
                      # the already exact-pinned head through its authoritative PR endpoint;
                      # do not accept a missing, truncated, foreign or mismatched association.
                      associations = get('commits/' + expected_sha + '/pulls?per_page=100')
                      assert isinstance(associations, list) and len(associations) < 100, 'Missing or truncated commit PR associations: ' + prefix
                      matches = [pr for pr in associations if pr['number'] == expected_pr]
                      assert len(matches) == 1, 'Missing or ambiguous exact commit PR association: ' + prefix
                      associated = matches[0]
                      assert associated['head']['sha'] == expected_sha, prefix
                      assert associated['base']['ref'] == 'main', prefix
                      assert associated['head']['repo']['full_name'] == associated['base']['repo']['full_name'] == 'boostbar9/Faction-Raids', prefix
                  else:
                      assert any(pr['number'] == expected_pr and pr['head']['sha'] == expected_sha
                                 for pr in associations), 'Missing exact PR association: ' + prefix
              response = get('actions/runs/' + run_id + '/artifacts?per_page=100')
              assert response['total_count'] == len(response['artifacts']), 'Truncated gate artifacts: ' + prefix
              selected = {}
              for artifact_name, artifact_id in artifacts.items():
                  matches = [item for item in response['artifacts'] if item['name'] == artifact_name]
                  assert len(matches) == 1, artifact_name
                  item = matches[0]
                  assert item['id'] == artifact_id and not item['expired'] and item['size_in_bytes'] > 0, artifact_name
                  assert item['workflow_run']['id'] == int(run_id), artifact_name
                  assert item['workflow_run']['head_sha'] == expected_sha, artifact_name
                  selected[artifact_name] = artifact_id
              return {'run_id': int(run_id), 'run_attempt': run['run_attempt'], 'artifacts': selected}


          def main():
              assert re.fullmatch(r'[1-9][0-9]*', os.environ['PULL_REQUEST_NUMBER']), 'Unfilled PR identity'
              reviewed_sha = os.environ['REVIEWED_SOURCE_SHA']
              merged_sha = os.environ['MERGED_SOURCE_SHA']
              source_tree = os.environ['SOURCE_TREE_SHA']
              build_run = os.environ['BUILD_RUN_ID']
              for value in (reviewed_sha, merged_sha, source_tree):
                  assert re.fullmatch(r'[0-9a-f]{40}', value), 'Unfilled or invalid source pin'
              for key in ('BUILD_RUN_ID', 'BUILD_RUN_ATTEMPT', 'JAR_ARTIFACT_ID', 'REGRESSION_ARTIFACT_ID'):
                  assert re.fullmatch(r'[1-9][0-9]*', os.environ[key]), 'Unfilled or invalid pin: ' + key
              assert re.fullmatch(r'[0-9a-f]{64}', os.environ['ARTIFACT_SHA256']), 'Unfilled JAR digest'
              assert os.environ['GITHUB_REPOSITORY'] == 'boostbar9/Faction-Raids'
              run = get('actions/runs/' + build_run)
              assert run['id'] == int(build_run)
              assert run['run_attempt'] == int(os.environ['BUILD_RUN_ATTEMPT']), 'Build attempt changed; reconcile'
              assert run['status'] == 'completed' and run['conclusion'] == 'success'
              assert run['event'] == 'push' and run['head_branch'] == 'main'
              assert run['head_sha'] == merged_sha
              assert run['name'] == 'Build' and run['path'] == '.github/workflows/build.yml'
              assert run['repository']['full_name'] == 'boostbar9/Faction-Raids'
              assert run['head_repository']['full_name'] == 'boostbar9/Faction-Raids'
              workflow = get('actions/workflows/' + str(run['workflow_id']))
              assert workflow['path'] == '.github/workflows/build.yml'
              pr = get('pulls/' + os.environ['PULL_REQUEST_NUMBER'])
              assert pr['merged'] and pr['merge_commit_sha'] == merged_sha
              assert pr['head']['sha'] == reviewed_sha
              assert pr['base']['ref'] == 'main'
              assert pr['base']['repo']['full_name'] == 'boostbar9/Faction-Raids'
              assert pr['head']['repo']['full_name'] == 'boostbar9/Faction-Raids'
              main_sha = get('branches/main')['commit']['sha']
              assert main_sha == merged_sha, 'Main advanced; reconcile explicitly before upload'
              for sha in (reviewed_sha, merged_sha, run['head_sha'], main_sha):
                  assert get('git/commits/' + sha)['tree']['sha'] == source_tree
              tree = get('git/trees/' + source_tree + '?recursive=1')
              assert tree['sha'] == source_tree and not tree['truncated']
              paths = [entry['path'] for entry in tree['tree'] if entry['type'] == 'blob']
              # Build/Building/Server/Handoff/Unload bind final 4.52.9 head. HUD/Camp inherit exact 4.52.8; lifecycle remains historical 4.52.6.
              reviewed_build = verify_reviewed_run('REVIEWED_BUILD', 'Build', '.github/workflows/build.yml', {
                  'Faction-Raids-Forge-1.20.1': int(os.environ['REVIEWED_JAR_ARTIFACT_ID']),
                  'regression-test-results': int(os.environ['REVIEWED_REGRESSION_ARTIFACT_ID']),
              })
              native_gates = {}
              for prefix, name, workflow_path, artifact_prefix in (
                  ('HUD', 'Native HUD QA', '.github/workflows/native-hud-qa.yml', 'native-hud-qa'),
                  ('BUILDING', 'Native Building QA', '.github/workflows/native-building-qa.yml', 'native-building-qa'),
                  ('SERVER', 'Native Building Server QA', '.github/workflows/native-building-server-qa.yml', 'native-building-server-qa'),
                  ('CAMP', 'Native Camp Spawn QA', '.github/workflows/native-camp-qa.yml', 'native-camp-qa'),
                  ('LIFECYCLE', 'Native Camp Lifecycle QA', '.github/workflows/native-camp-lifecycle-qa.yml', 'native-camp-lifecycle-qa'),
                  ('HANDOFF', 'Native Hollow Representative Stage Handoff QA', '.github/workflows/native-staged-handoff-qa.yml', 'native-handoff-qa'),
                  ('UNLOAD', 'Native Staged Unload QA (Chunk Loading Off)', '.github/workflows/native-staged-unload-qa.yml', 'native-staged-unload-qa'),
              ):
                  artifact_name = artifact_prefix + '-' + os.environ[prefix + '_RUN_ID'] + '-' + os.environ[prefix + '_RUN_ATTEMPT']
                  inherited = prefix in ('HUD', 'CAMP', 'LIFECYCLE')
                  lineage = INHERITED_GATES.get(prefix)
                  expected_native_source = lineage['source'] if lineage else reviewed_sha
                  expected_native_tree = lineage['tree'] if lineage else source_tree
                  native_gates[prefix.lower()] = verify_reviewed_run(prefix, name, workflow_path, {
                      artifact_name: int(os.environ[prefix + '_ARTIFACT_ID']),
                  }, expected_native_source, lineage['pr'] if lineage else int(os.environ['PULL_REQUEST_NUMBER']))
                  checkout = os.environ[prefix + '_CHECKOUT_SHA']
                  assert get('git/commits/' + checkout)['tree']['sha'] == expected_native_tree, 'Native checkout tree differs: ' + prefix
                  native_gates[prefix.lower()]['inherited_baseline'] = inherited
                  native_gates[prefix.lower()]['evidence_release'] = lineage['release'] if lineage else '4.52.9'
                  native_gates[prefix.lower()]['tested_source'] = expected_native_source
                  native_gates[prefix.lower()]['checkout_sha'] = checkout
                  native_gates[prefix.lower()]['evidence_sha256'] = os.environ[prefix + '_EVIDENCE_SHA256']
              # Preserve exact 4.52.8 source through the reviewed builder-arrival-only delta.
              # Preliminary source hashes must be refreshed and reviewed after final source changes.
              baseline_tree = get('git/trees/eab9db0df613d5778dd09487fee31c1fe397fcbd?recursive=1')
              assert baseline_tree['sha'] == 'eab9db0df613d5778dd09487fee31c1fe397fcbd' and not baseline_tree['truncated']
              baseline_entries = {e['path']: e for e in baseline_tree['tree'] if e['type'] == 'blob'}
              entries_by_path = {e['path']: e for e in tree['tree'] if e['type'] == 'blob'}
              contract = SOURCE_CONTRACT
              # Tree entry URL fields differ by traversal; compare immutable blob identity/mode only.
              signature = lambda e: None if e is None else (e['mode'], e['type'], e['sha'])
              changed = {p for p in set(baseline_entries) | set(entries_by_path)
                         if signature(baseline_entries.get(p)) != signature(entries_by_path.get(p))}
              assert changed == set(contract['reviewed_delta']), 'Source delta differs from reviewed builder-arrival scope'
              for path, expected in contract['sha256'].items():
                  blob = get('git/blobs/' + entries_by_path[path]['sha'])
                  assert blob['encoding'] == 'base64', path
                  raw = base64.b64decode(blob['content'], validate=False)
                  assert hashlib.sha256(raw).hexdigest() == expected, 'Source/receipt contract changed; regenerate and review publisher: ' + path
              assert get('git/commits/0976763349ac3bb9d5a3d8ed2647545f2ad95c67')['tree']['sha'] == contract['development_base_tree']
              # Final-head Copilot review and owner-recorded independent review are immutable pins.
              reviews = get('pulls/' + os.environ['PULL_REQUEST_NUMBER'] + '/reviews?per_page=100')
              assert isinstance(reviews, list) and len(reviews) < 100, 'Missing/truncated review history'
              selected = [r for r in reviews if r['id'] == int(os.environ['COPILOT_REVIEW_ID'])]
              assert len(selected) == 1
              review = selected[0]
              assert review['commit_id'] == reviewed_sha and review['state'] in ('COMMENTED', 'APPROVED')
              assert review['user']['login'] == 'copilot-pull-request-reviewer[bot]'
              assert hashlib.sha256(review['body'].encode()).hexdigest() == os.environ['COPILOT_REVIEW_BODY_SHA256']
              assert not any(r['state'] == 'CHANGES_REQUESTED' and r['commit_id'] == reviewed_sha for r in reviews)
              threads = review_threads(int(os.environ['PULL_REQUEST_NUMBER']))
              assert all(t['isResolved'] is True for t in threads), 'Unresolved PR review threads block publication'
              independent = get('issues/comments/' + os.environ['INDEPENDENT_REVIEW_COMMENT_ID'])
              assert independent['user']['login'] == 'boostbar9'
              assert independent['issue_url'].endswith('/issues/' + os.environ['PULL_REQUEST_NUMBER'])
              assert reviewed_sha in independent['body'] and 'no blocking findings' in independent['body'].lower()
              assert hashlib.sha256(independent['body'].encode()).hexdigest() == os.environ['INDEPENDENT_REVIEW_BODY_SHA256']

              source_roots = sorted(path[len('src/main/java/'):-len('.java')]
                                    for path in paths
                                    if path.startswith('src/main/java/') and path.endswith('.java'))
              assert source_roots and len(source_roots) == len(set(source_roots))
              excluded_roots = sorted(path.split('/java/', 1)[1][:-len('.java')]
                                      for path in paths
                                      if path.startswith(('src/test/java/', 'src/nativeQa/java/', 'src/nativeServerQa/java/'))
                                      and path.endswith('.java'))
              assert not set(source_roots).intersection(excluded_roots)
              artifacts = get('actions/runs/' + build_run + '/artifacts?per_page=100')
              assert artifacts['total_count'] == len(artifacts['artifacts']), 'Artifact list truncated'
              selected = {}
              expected_artifacts = {
                  'Faction-Raids-Forge-1.20.1': int(os.environ['JAR_ARTIFACT_ID']),
                  'regression-test-results': int(os.environ['REGRESSION_ARTIFACT_ID']),
              }
              for name, expected_id in expected_artifacts.items():
                  matches = [item for item in artifacts['artifacts'] if item['name'] == name]
                  assert len(matches) == 1, name
                  item = matches[0]
                  assert item['id'] == expected_id, 'Artifact identity changed: ' + name
                  assert not item['expired'] and item['size_in_bytes'] > 0
                  assert item['workflow_run']['id'] == int(build_run)
                  assert item['workflow_run']['head_sha'] == merged_sha
                  assert item['workflow_run']['head_branch'] == 'main'
                  selected[name] = item['id']
              manifest = {
                  'pull_request': int(os.environ['PULL_REQUEST_NUMBER']), 'reviewed_source': reviewed_sha, 'merged_source': merged_sha,
                  'source_tree': source_tree, 'build_run': int(build_run),
                  'build_attempt': run['run_attempt'], 'artifacts': selected,
                  'production_class_roots': source_roots, 'excluded_class_roots': excluded_roots,
                  'reviewed_build': reviewed_build, 'native_gates': native_gates,
                  'reviewed_delta': sorted(changed), 'baseline_release': '4.52.8',
                  'copilot_review_id': review['id'], 'independent_review_comment_id': independent['id'],
              }
              Path('verified-source.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
              print('Verified exact pinned PR, successful merged-main Build, unchanged current main and source tree.')
              print('Artifact IDs:', json.dumps(selected, sort_keys=True))


          if __name__ == '__main__':
              main()
          CHECK

      - if: steps.guard.outputs.publish == 'true'
        name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-retry-attempts: 1
          files: dist/siegeoverhaul-4.52.9.jar
          name: The Siege Overhaul v4.52.9 - Builder arrival and safer approach paths
          version: v4.52.9
          version-type: release
          changelog: |
            Builders now move into working range before starting their next wall operation. Safer partial walking routes help them keep approaching distant work sites.

            Short grass, including supported Sizeable Foliage grass, can be accepted as safe standing space without clearing plants outside the building plan. Existing vertical reach, materials, payments and saved jobs are preserved.

            Install 4.52.9 on the server and all clients. It keeps network protocol 22 and the same required companion mods.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            ftb-chunks-forge(optional)
            open-parties-and-claims(optional)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
            curios(optional)
            epic-knights-addon(optional)
          fail-mode: fail

      - if: steps.guard.outputs.publish == 'true'
        name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          """Record accepted upload; public moderation/download checks remain separate."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from urllib.parse import urlsplit


          def main():
              digest = hashlib.sha256(Path('dist/siegeoverhaul-4.52.9.jar').read_bytes()).hexdigest()
              assert digest == Path('verified-sha256.txt').read_text() == os.environ['ARTIFACT_SHA256']
              source = json.loads(Path('verified-source.json').read_text())
              regressions = json.loads(Path('verified-regressions.json').read_text())
              assert source['reviewed_source'] == os.environ['REVIEWED_SOURCE_SHA']
              assert source['merged_source'] == os.environ['MERGED_SOURCE_SHA']
              assert source['source_tree'] == os.environ['SOURCE_TREE_SHA']
              assert source['build_run'] == int(os.environ['BUILD_RUN_ID'])
              assert source['build_attempt'] == int(os.environ['BUILD_RUN_ATTEMPT'])
              assert source['artifacts'] == {
                  'Faction-Raids-Forge-1.20.1': int(os.environ['JAR_ARTIFACT_ID']),
                  'regression-test-results': int(os.environ['REGRESSION_ARTIFACT_ID']),
              }
              assert source['pull_request'] == int(os.environ['PULL_REQUEST_NUMBER'])
              assert regressions == {
                  'tests': int(os.environ['REGRESSION_TEST_COUNT']),
                  'suites': int(os.environ['REGRESSION_SUITE_COUNT']),
                  'failures': 0, 'errors': 0, 'skipped': 0,
                  'suite_manifest_sha256': os.environ['REGRESSION_SUITE_SHA256'],
              }
              assert source['reviewed_build'] == {
                  'run_id': int(os.environ['REVIEWED_BUILD_RUN_ID']),
                  'run_attempt': int(os.environ['REVIEWED_BUILD_RUN_ATTEMPT']),
                  'artifacts': {'Faction-Raids-Forge-1.20.1': int(os.environ['REVIEWED_JAR_ARTIFACT_ID']),
                                'regression-test-results': int(os.environ['REVIEWED_REGRESSION_ARTIFACT_ID'])},
              }
              suite_counts = json.loads(Path('verified-suite-counts.json').read_text())
              assert len(suite_counts) == int(os.environ['REGRESSION_SUITE_COUNT'])
              assert sum(suite_counts.values()) == int(os.environ['REGRESSION_TEST_COUNT'])
              assert hashlib.sha256(json.dumps(suite_counts, sort_keys=True, separators=(',', ':')).encode()).hexdigest() == os.environ['REGRESSION_SUITE_SHA256']
              native = json.loads(Path('verified-native-evidence.json').read_text())
              assert native['protocol'] == 22
              assert set(native['native_gates']) == {'hud', 'building', 'server', 'camp', 'lifecycle', 'handoff', 'unload'}
              for prefix in ('HUD', 'BUILDING', 'SERVER', 'CAMP', 'LIFECYCLE', 'HANDOFF', 'UNLOAD'):
                  gate = native['native_gates'][prefix.lower()]
                  for field in ('run_id', 'run_attempt', 'artifact_id'):
                      assert gate[field] == int(os.environ[prefix + '_' + field.upper()])
                  assert gate['checkout_sha'] == os.environ[prefix + '_CHECKOUT_SHA']
                  assert gate['evidence_sha256'] == os.environ[prefix + '_EVIDENCE_SHA256']
              assert len(native['coverage_limits']) == 11
              file_id = os.environ['RELEASE_FILE_ID']
              url = os.environ['RELEASE_URL']
              assert re.fullmatch(r'[1-9][0-9]*', file_id), 'Missing or invalid accepted CurseForge file ID'
              location = urlsplit(url)
              assert location.scheme == 'https' and location.hostname in ('www.curseforge.com', 'curseforge.com')
              assert location.path.rstrip('/') == '/minecraft/mc-mods/siege-overhaul/files/' + file_id, 'Project/file ID/URL mismatch'
              assert not location.query and not location.fragment, 'Unexpected receipt URL suffix'
              assert not location.username and not location.password
              result = {
                  'version': '4.52.9', 'version_type': 'release', 'curseforge_project': 1364352,
                  'file_id': file_id, 'url': url,
                  'status': 'accepted_upload', 'public_availability': 'not_yet_verified',
                  'pull_request': int(os.environ['PULL_REQUEST_NUMBER']), 'reviewed_source': source['reviewed_source'],
                  'tested_source': source['merged_source'], 'merged_source': source['merged_source'],
                  'source_tree': source['source_tree'], 'build_run': source['build_run'],
                  'build_attempt': source['build_attempt'], 'artifacts': source['artifacts'],
                  **regressions, 'sha256': digest,
                  'protocol': 22, 'native_evidence': native,
                  'baseline_release': '4.52.8', 'reviewed_delta': source['reviewed_delta'],
                  'copilot_review_id': source['copilot_review_id'],
                  'independent_review_comment_id': source['independent_review_comment_id'],
                  'pr_main_reconciliation': json.loads(Path('verified-pr-main.json').read_text()),
                  'reviewed_build': source['reviewed_build'], 'suite_counts': suite_counts,
                  'publisher_run': int(os.environ['GITHUB_RUN_ID']),
                  'publisher_attempt': int(os.environ.get('GITHUB_RUN_ATTEMPT', '1')),
              }
              Path('curseforge-4.52.9-receipt.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
              print(json.dumps(result, sort_keys=True))
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Accepted upload (moderation/public availability separate): '
                                + json.dumps(result, sort_keys=True) + '\n')


          if __name__ == '__main__':
              main()
          RECEIPT

      - if: always() && steps.guard.outputs.publish == 'true'
        name: Preserve publication verification receipts
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-4.52.9-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verified-*.json
            verified-sha256.txt
            curseforge-4.52.9-receipt.json
          if-no-files-found: error
          retention-days: 90
