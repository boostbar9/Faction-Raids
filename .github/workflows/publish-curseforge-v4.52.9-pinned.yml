                  elif child.tag=='properties':
                      assert not child.attrib
                      properties.extend([{'tag':entry.tag,'attributes':entry.attrib,'text':entry.text} for entry in child])
                  else:
                      assert child.tag in {'system-out','system-err'} and not child.attrib and len(child)==0
                      diagnostics.append({'tag':child.tag,'sha256':sha((child.text or '').encode()),'characters':len(child.text or '')})
              assert len(cases)==int(attrs['tests'])
              identities=[(case.get('classname'),case.get('name')) for case in cases]
              # Parameterized JUnit methods can share display labels (e.g. [1] COMMON).
              # Keep every occurrence in the sorted list so equality preserves multiplicity.
              return {'attributes':attrs,'properties':properties,'testcases':sorted(cases,key=lambda x:(x.get('classname',''),x.get('name','')))},diagnostics


          def compare_xml(pr_root,main_root):
              def reports(root):
                  values={}
                  for path in Path(root).rglob('TEST-*.xml'):
                      assert path.name not in values,'Duplicate report filename';values[path.name]=path
                  return values
              p=reports(pr_root);m=reports(main_root);assert p.keys()==m.keys(),'PR/main XML file sets differ'
              changed=[];counts={};case_digest={};diagnostic_changes=[];repeated_labels={}
              for name in sorted(p):
                  pc,pd=canonical_xml(p[name]);mc,md=canonical_xml(m[name]);assert pc==mc,'PR/main testcase/structure/outcome differs: '+name
                  if p[name].read_bytes()!=m[name].read_bytes():changed.append(name)
                  if pd!=md:diagnostic_changes.append({'file':name,'pr':pd,'main':md})
                  from collections import Counter
                  labels=Counter((case.get('classname'),case.get('name')) for case in pc['testcases'])
                  repeated=[{'classname':key[0],'display_name':key[1],'multiplicity':value} for key,value in labels.items() if value>1]
                  if repeated:repeated_labels[name]=repeated
