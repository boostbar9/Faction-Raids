          def evidence_manifest(root):
              assert root.is_dir() and not root.is_symlink(), str(root)
              entries = []
              for path in sorted(root.rglob('*')):
                  assert not path.is_symlink(), 'Evidence symlink: ' + str(path)
                  if path.is_dir():
                      continue
                  assert path.is_file(), 'Unexpected evidence entry: ' + str(path)
                  raw = path.read_bytes()
                  entries.append({'path': path.relative_to(root).as_posix(), 'size': len(raw),
                                  'sha256': hashlib.sha256(raw).hexdigest()})
              assert entries, 'Empty native evidence'
              digest = hashlib.sha256(json.dumps(entries, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
              return digest, entries


          def validator(text, name):
              namespace = {'__name__': 'embedded_' + name}
              exec(compile(text, '<reviewed-' + name + '-validator>', 'exec'), namespace)
              return namespace['verify']

