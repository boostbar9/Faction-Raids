          BUILDING_SOURCE = '"""Offline replay of native-building-qa.yml receipt contract; original runtime-only filesystem assertions remain required in the source workflow."""\n\ndef verify(root):\n    import json, struct\n    from pathlib import Path\n    data = json.loads((root / \'result.json\').read_text())\n    audit = json.loads((root / \'native-bytecode-audit.json\').read_text())\n    assert audit[\'status\'] == \'passed\' and audit[\'noVendorJarsUploaded\'], audit\n    assert sum(len(v[\'classes\']) for v in audit[\'artifacts\'].values()) == 18, audit\n    assert data[\'status\'] == \'passed\', data\n    viewport = data[\'viewportSetup\']\n    assert viewport[\'framebufferWidth\'] == viewport[\'windowWidth\'] == 960, viewport\n    assert viewport[\'framebufferHeight\'] == viewport[\'windowHeight\'] == 720, viewport\n    for name in [\'nativeInspectionScale3\', \'buildingScale3\']:\n        compact = data[\'guiScaleEvidence\'][name]\n        assert compact[\'framebufferWidth\'] == 960 and compact[\'framebufferHeight\'] == 720, compact\n        assert compact[\'requestedGuiScale\'] == 3 and compact[\'guiWidth\'] == 320 and compact[\'guiHeight\'] == 240, compact\n    assert data[\'gameplay\'][\'status\'] == \'passed\', data.get(\'gameplay\')\n    gameplay = data[\'gameplay\']\n    review = gameplay[\'admissionReviews\']\n    assert isinstance(review, dict), review\n    assert all(review[key] is True for key in [\'perimeterNeighborRejected\', \'perimeterPairedClearanceRejected\',\n        \'manualPairedClearanceRejected\', \'exactInventoryAndTreasury\', \'noProjectOrWorkerReceiptChange\',\n        \'fixtureTerrainRestored\']), review\n    assert gameplay[\'completedManualBlocks\'] == 83 and data[\'perimeterTemplateBlocks\'] == 572, data\n    assert gameplay[\'manualHollowGeometry\'] == {\'targets\': 83, \'cobblestone\': 58, \'oakPlanks\': 25,\n        \'cavityCells\': 27, \'cavityReservedAtAcceptance\': True, \'airPlacementTargets\': 0}, gameplay\n    assert gameplay[\'cavityObstructionPaused\'] and gameplay[\'cavityObstructionRestartVerified\'], gameplay\n    assert gameplay[\'nativeDeckOverCavityVerified\'] and gameplay[\'finalCavityAirCells\'] == 27, gameplay\n    assert gameplay[\'unchangedCavityFootingColumns\'] == 9, gameplay\n    completed = gameplay[\'completedManualRestart\']\n    assert completed[\'verified\'] and completed[\'preAiExactInventoryValues\'] and completed[\'preAiEqualSplitMirror\'], completed\n    assert completed[\'singleValuePreservingRebind\'] and completed[\'constructionDetached\'] and completed[\'reservationRetired\'], completed\n    assert completed[\'placedBlocks\'] == 83 and completed[\'cavityAirCells\'] == 27, completed\n    projection = data[\'gameplay\'][\'perimeterProjection\']\n    assert projection[\'alwaysShownThreshold\'] == 1024 and projection[\'activeTargets\'] > 0, projection\n    assert projection[\'defaultAlwaysShown\'] == (projection[\'activeTargets\'] <= 1024), projection\n    assert projection[\'wholeTargets\'] >= projection[\'activeTargets\'], projection\n    assert data[\'gameplay\'][\'authenticatedProjectionHide\'] and data[\'gameplay\'][\'authenticatedProjectionShow\'], data\n    canceled = data[\'gameplay\'][\'canceledWholePerimeter\']\n    assert canceled[\'globalTargets\'] == projection[\'wholeTargets\'] and canceled[\'stageCount\'] >= 1 and canceled[\'treasury\'] == 1936, canceled\n    expected = [\n        \'01-marker-focused.png\', \'02-native-inspection-scale2.png\',\n        \'03-native-inspection-scale3.png\', \'04-projection-unfocused.png\',\n        \'05-projection-focus-only.png\', \'06-projection-marker-behind-camera.png\',\n        \'07-marker-occluded.png\', \'08-marker-after-world-reload.png\',\n        \'09-building-auto-perimeter.png\', \'10-building-place-structure.png\',\n        \'11-building-construction.png\', \'12-building-construction-compact.png\',\n        \'13-native-perimeter-template.png\',\n        \'14-production-free-perimeter-review.png\', \'15-production-paid-native-marker.png\',\n        \'16-live-core-building-auto.png\', \'17-live-core-construction.png\',\n        \'19-live-core-civilians.png\', \'20-live-core-civilians-reopened.png\',\n        \'18-completed-manual-wall-and-builder.png\',\n    ]\n    assert data[\'screenshots\'] == expected, data[\'screenshots\']\n    for name in expected:\n        content = (root / name).read_bytes()\n        assert content.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(content) > 4096, name\n        assert struct.unpack(\'>II\', content[16:24]) == (960, 720), name\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert mod in data[\'loadedModVersions\'], mod\n        artifact = data[\'loadedCompanionArtifacts\'][mod]\n        assert len(artifact[\'sha256\']) == 64, artifact\n    assert data[\'loadedModVersions\'][\'minecraft\'] == \'1.20.1\', data\n    assert data[\'loadedModVersions\'][\'forge\'] == \'47.4.16\', data\n    print(\'Actual native-client fixture passed. See screenshots for visual review and result.json for exclusions.\')\n    return data\n'

          SERVER_SOURCE = '"""Offline replay of native-building-server-qa.yml receipt contract; original runtime-only filesystem assertions remain required in the source workflow."""\n\ndef verify(root):\n    import json\n    from pathlib import Path\n    data = json.loads((root / \'result.json\').read_text())\n    assert data[\'status\'] == \'passed\', data\n    assert data[\'testsExecuted\'] == 1, data\n    assert data[\'physicalDistribution\'] == \'DEDICATED_SERVER\', data\n    assert data[\'logicalSide\'] == \'SERVER\', data\n    assert data[\'serverClass\'] == \'net.minecraft.gametest.framework.GameTestServer\', data\n    assert data[\'connectedPlayers\'] == 0, data\n    assert data[\'fixtureActor\'] == \'net.minecraftforge.common.util.FakePlayer; no authenticated network client\', data\n    assert \'real multiplayer connection/authentication remains unverified\' in data[\'limitation\'], data\n    expected = [\n        \'physical-dedicated-classloading\',\n        \'real-native-factories-and-queues\',\n        \'sealed-native-packets-and-move-overloads\',\n        \'native-nbt-roundtrip-and-defensive-copies\',\n        \'unloaded-blueprint-remains-unloaded\',\n        \'clearance-and-world-saveddata-disk-roundtrip\',\n        \'fakeplayer-direct-handler-authorization-and-cancel\',\n        \'offline-native-inventory-authority-and-loss-recovery\',\n    ]\n    assert data[\'checks\'] == expected, data\n    console = (root / \'server-console.log\').read_text()\n    assert console.count(\'SIEGE_NATIVE_SERVER_QA_COMPLETED tests=1 checks=8\') == 1, console[-5000:]\n    authority = data[\'inventoryAuthority\']\n    assert authority[\'ownerConnected\'] is False, authority\n    assert authority[\'profileCacheSource\'] == \'Explicit isolated GameProfileCache dependency; GameTest server cache remains absent\', authority\n    assert \'cached UUID identity\' in authority[\'productionEntryWithoutProfileCache\'], authority\n    assert authority[\'profileRepositoryLookups\'] == 0, authority\n    assert authority[\'coreAnchorDiskRoundTrip\'] == \'passed\', authority\n    assert authority[\'scoreboardDiskRoundTrip\'] == \'passed\', authority\n    assert authority[\'nativeRosterMembersBeforeDisk\'] == 1, authority\n    assert authority[\'nativeRosterMembersAfterDisk\'] == 0, authority\n    for allowed in [\'offline-native-owner-valid\', \'native-manager-disk-reload-valid\', \'membership-restored\',\n                    \'native-roster-name-restored\', \'native-roster-uuid-restored\', \'identity-conflicts-restored\',\n                    \'scoreboard-restored\', \'worker-owner-restored\', \'source-claim-restored\',\n                    \'original-core-restored\', \'valid-context-restored\']:\n        assert authority[\'outcomes\'][allowed] == \'allowed\', (allowed, authority)\n    for denied in [\'removed-native-member\', \'stale-native-roster-name\', \'conflicting-native-roster-uuid\',\n                   \'stale-cached-profile-name\', \'scoreboard-transferred\', \'worker-owner-transferred\',\n                   \'foreign-source-claim\', \'unloaded-source-denied\', \'original-core-lost\', \'original-anchor-lost\']:\n        assert authority[\'outcomes\'][denied].startswith(\'Paused:\'), (denied, authority)\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert mod in data[\'loadedModVersions\'], mod\n        assert len(data[\'loadedCompanionArtifacts\'][mod][\'sha256\']) == 64, mod\n    for mod, version in {\'minecraft\': \'1.20.1\', \'forge\': \'47.4.16\', \'workers\': \'2.0.3\', \'recruits\': \'1.15.2\'}.items():\n        assert data[\'loadedModVersions\'][mod] == version, data\n    print(\'Required Forge GameTest passed on the physical dedicated distribution. Real multiplayer remains unverified.\')\n    return data\n'

          CAMP_SOURCE = '"""Exact offline replay of the native-camp-qa.yml receipt contract."""\n\ndef verify(root):\n    import json\n    from pathlib import Path\n    data = json.loads((root / \'result.json\').read_text())\n    assert data[\'mode\'] == \'camp-spawn\' and data[\'status\'] == \'passed\', data\n    audit = json.loads((root / \'native-bytecode-audit.json\').read_text())\n    assert audit[\'status\'] == \'passed\' and audit[\'noVendorJarsUploaded\'], audit\n    assert sum(len(v[\'classes\']) for v in audit[\'artifacts\'].values()) == 18, audit\n    versions = data[\'loadedModVersions\']\n    for mod, version in {\'minecraft\': \'1.20.1\', \'forge\': \'47.4.16\', \'workers\': \'2.0.3\',\n                         \'recruits\': \'1.15.2\', \'smallships\': \'2.0.0-b1.4\', \'siegeweapons\': \'0.2.5\'}.items():\n        assert versions[mod] == version, versions\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert len(data[\'loadedCompanionArtifacts\'][mod][\'sha256\']) == 64, mod\n    scenarios = data[\'scenarios\']\n    assert len(scenarios) == 3, scenarios\n    assert [case[\'scenario\'] for case in scenarios] == [\'natural-flat\', \'controlled-shallow-water-forest\', \'controlled-rocky-water-forest\']\n    for index, case in enumerate(scenarios):\n        assert case[\'status\'] == \'passed\' and case[\'nativeClaimChunks\'] == 25, case\n        capture = case[\'framebufferCapture\']\n        assert all(capture[key] for key in [\'worldReady\', \'observerReady\', \'coreReceived\', \'terrainCompiled\', \'cameraReady\']), capture\n        assert 0 <= capture[\'elapsedSeconds\'] < 30 and capture[\'changedPixelSamples\'] > 50, capture\n        assert capture[\'framebufferAttempts\'] > capture[\'blankFrames\'], capture\n        assert case[\'terraformFallback\'] == bool(index) and case[\'crewStarted\'], case\n        assert case[\'enemyCore\'] and case[\'claimId\'] != \'null\', case\n        assert case[\'workers\'] and case[\'guards\'], case\n        assert len(case[\'guards\']) == case[\'registeredGuardRoleCount\'], case\n        assert case[\'ordinaryTicksSinceEstablishment\'] >= 60, case\n        assert case[\'unregisteredGuardRoles\'] == [\'assassin\'], case\n        recovered = [guard for guard in case[\'guards\'] if guard[\'type\'] == \'recruits:scout\' and guard[\'scoutSpawnTailRecovered\']]\n        assert len(recovered) == 2 and len(case[\'guards\']) == 5, case\n        for unit in case[\'workers\'] + case[\'guards\']:\n            assert not unit[\'noAi\'] and unit[\'faction\'] == case[\'expectedEnemyFaction\'], unit\n        assert case[\'nativeJobOwnershipVerified\'] and case[\'nativeJobOwner\'] != case[\'guardOwner\'], case\n        assert case[\'nativeWorkAreaAccessVerified\'] and case[\'nativeBuilderStorageEnabled\'], case\n        for worker in case[\'workers\']:\n            assert worker[\'owner\'] == case[\'nativeJobOwner\'] and worker[\'owned\'] and not worker[\'listening\'], worker\n        for guard in case[\'guards\']:\n            assert guard[\'owner\'] == case[\'guardOwner\'] == \'fac10000-4a1d-4e75-8a1d-000000000001\', guard\n        assert all(case[\'nativeJobAreas\'][key] == case[\'nativeJobOwner\']\n                   for key in [\'buildOwner\', \'storageOwner\', \'supplyOwner\']), case\n        assert all(unit[\'type\'].startswith(\'recruits:\') for unit in case[\'guards\']), case\n        assert case[\'protectedCellCount\'] >= 6144 and case[\'protectedChests\'] >= 2, case\n        assert case[\'entry\'].startswith(\'Actual non-op client /siegeoverhaul start\'), case\n    hostile = scenarios[1][\'controlledHostileTerrain\']\n    assert hostile[\'waterDepth\'] == 3 and hostile[\'dryLandingWidth\'] == 3 and hostile[\'fixtureWrites\'] < 300\n    assert scenarios[1][\'hostileTerrainPrepared\'], scenarios[1]\n    assert all(scenarios[1][\'recordedOriginalTerrainCounts\'][block] > 0\n               for block in [\'minecraft:water\', \'minecraft:oak_log\', \'minecraft:oak_leaves\']), scenarios[1]\n    rocky = scenarios[2]\n    assert rocky[\'controlledHostileTerrain\'][\'rockyRise\'] and rocky[\'controlledHostileTerrain\'][\'fixtureWrites\'] < 300, rocky\n    assert rocky[\'raisedCampPlane\'] and rocky[\'unchangedRockSupportVerified\'], rocky\n    assert rocky[\'campPlaneAboveOriginalSurface\'] == 1 and rocky[\'protectedCellCount\'] >= 6147, rocky\n    assert all(rocky[\'recordedOriginalTerrainCounts\'][block] > 0\n               for block in [\'minecraft:water\', \'minecraft:oak_log\', \'minecraft:oak_leaves\']), rocky\n    expected = [\'01-established-flat-camp.png\', \'02-established-shallow-water-forest-camp.png\', \'03-established-rocky-water-forest-camp.png\']\n    assert data[\'screenshots\'] == expected, data[\'screenshots\']\n    for name in expected:\n        content = (root / name).read_bytes()\n        assert content.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(content) > 4096, name\n    print(\'All three actual camp-establishment scenarios passed. Review raw framebuffers and bounded fixture coverage.\')\n    return data\n\n# Publisher-only strict shape overlay. Source verifier above remains unchanged.\nverify_source_receipt = verify\n\n"""Publisher-only complete typed Camp Spawn receipt check; source verifier stays unchanged."""\nfrom collections import Counter\nimport hashlib\nimport json\nimport math\nimport re\nimport uuid\n\nCAMP_SHOTS=[\'01-established-flat-camp.png\',\'02-established-shallow-water-forest-camp.png\',\'03-established-rocky-water-forest-camp.png\']\nCAMP_SCENARIOS=[\'natural-flat\',\'controlled-shallow-water-forest\',\'controlled-rocky-water-forest\']\nCAMP_ROLES=[\'bowman\',\'scout\',\'crossbowman\',\'bowman\',\'scout\',\'assassin\']\nCAMP_AUDIT_CLASSES={\n \'recruits\': [\'com.talhanation.recruits.\'+v for v in [\'entities.ai.RecruitUpkeepPosGoal\',\'entities.ai.RecruitUpkeepEntityGoal\',\'entities.AbstractRecruitEntity\',\'entities.AbstractInventoryEntity\',\'inventory.RecruitSimpleContainer\',\'world.RecruitsClaimManager\',\'world.RecruitsClaim\',\'entities.ScoutEntity\',\'entities.BowmanEntity\',\'entities.ai.navigation.RecruitPathNavigation\',\'pathfinding.AsyncGroundPathNavigation\',\'init.ModEntityTypes\']],\n \'workers\':[\'com.talhanation.workers.\'+v for v in [\'entities.ai.GetNeededItemsFromStorage\',\'entities.ai.DepositItemsToStorage\',\'entities.ai.RecruitStorageUpkeepGoal\',\'entities.ai.AbstractChestGoal\',\'entities.ai.BuilderWorkGoal\',\'entities.AbstractWorkerEntity\']]}\n\n\ndef camp_load(path):\n    def pairs(items):\n        value={}\n        for key,child in items:\n            assert key not in value, (\'duplicate JSON field\',key)\n            value[key]=child\n        return value\n    def reject(value):raise AssertionError(\'Non-finite JSON value: \'+value)\n    assert path.is_file() and not path.is_symlink(), (\'Missing/unsafe receipt\',str(path))\n    data=json.loads(path.read_text(),object_pairs_hook=pairs,parse_constant=reject)\n    def finite(value):\n        if type(value) is float:assert math.isfinite(value)\n        elif type(value) is dict:\n            for child in value.values():finite(child)\n        elif type(value) is list:\n            for child in value:finite(child)\n    finite(data)\n    return data\n\n\ndef camp_boolean(value,expected=None):\n    assert type(value) is bool and (expected is None or value is expected), (\'Expected actual boolean\',value,expected)\n\n\ndef camp_integer(value,minimum=0,maximum=2**63-1):\n    assert type(value) is int and minimum<=value<=maximum, (\'Expected bounded integer\',value)\n    return value\n\n\ndef camp_number(value,minimum=0,maximum=float(\'inf\')):\n    assert type(value) in (int,float) and math.isfinite(value) and minimum<=value<maximum, (\'Invalid finite number\',value)\n\n\ndef camp_string(value,empty=False):\n    assert type(value) is str and (empty or value.strip()) and value!=\'null\', (\'Invalid text\',value)\n    return value\n\n\ndef camp_uuid(value):\n    assert type(value) is str and str(uuid.UUID(value))==value, (\'Invalid UUID\',value)\n    return value\n\n\ndef camp_digest(value):\n    assert type(value) is str and re.fullmatch(r\'[0-9a-f]{64}\',value), (\'Invalid digest\',value)\n    return value\n\n\ndef camp_pos(value,short=False):\n    pattern=r\'(-?\\d+), (-?\\d+), (-?\\d+)\' if short else r\'BlockPos\\{x=(-?\\d+), y=(-?\\d+), z=(-?\\d+)\\}\'\n    match=re.fullmatch(pattern,camp_string(value));assert match, (\'Invalid block position\',value)\n    return tuple(int(v) for v in match.groups())\n\n\ndef camp_vec(value):\n    value=camp_string(value);assert value.startswith(\'(\') and value.endswith(\')\'),value\n    parts=value[1:-1].split(\', \');assert len(parts)==3\n    values=tuple(float(v) for v in parts);assert all(math.isfinite(v) for v in values)\n    return values\n\n\ndef verify_shape(root):\n    assert root.is_dir() and not root.is_symlink()\n    data=camp_load(root/\'result.json\')\n    assert data[\'mode\']==\'camp-spawn\' and data[\'status\']==\'passed\'\n    assert data[\'screenshots\']==CAMP_SHOTS and type(data[\'screenshots\']) is list\n    assert type(data[\'scenarios\']) is list and len(data[\'scenarios\'])==3\n    for index,case in enumerate(data[\'scenarios\']):\n        assert case[\'scenario\']==CAMP_SCENARIOS[index] and case[\'status\']==\'passed\'\n        assert camp_integer(case[\'stage\'])==2;camp_integer(case[\'gameTime\'])\n        assert camp_string(case[\'nativeClaimAvailability\'],empty=True)==\'\'\n        camp_pos(case[\'campPosition\']);camp_uuid(case[\'claimId\'])\n        camp_integer(case[\'searchStep\'],0,200);camp_integer(case[\'searchElapsedTicks\'],0,4800)\n        assert type(case[\'searchCandidate\']) is str\n        if case[\'searchCandidate\']!=\'null\':camp_pos(case[\'searchCandidate\'])\n        camp_boolean(case[\'terraformFallback\'],index>0);camp_boolean(case[\'hostileTerrainPrepared\'],index>0)\n        camp_boolean(case[\'searchAbandoned\'],False)\n        for key in [\'crewStarted\',\'nativeJobOwnershipVerified\',\'nativeWorkAreaAccessVerified\',\'nativeBuilderStorageEnabled\']:camp_boolean(case[key],True)\n        for key in [\'nativeClaimChunks\',\'registeredGuardRoleCount\',\'ordinaryTicksSinceEstablishment\',\'protectedCellCount\',\'protectedChests\']:camp_integer(case[key])\n        assert case[\'nativeClaimChunks\']==25 and case[\'registeredGuardRoleCount\']==5\n        camp_number(case[\'elapsedSeconds\']);camp_string(case[\'entry\']);camp_string(case[\'constructionScope\']);camp_string(case[\'constructionPause\'],empty=True)\n        core=camp_pos(case[\'enemyCore\'],short=True)\n        native_owner=camp_uuid(case[\'nativeJobOwner\']);guard_owner=camp_uuid(case[\'guardOwner\'])\n        assert guard_owner==\'fac10000-4a1d-4e75-8a1d-000000000001\' and native_owner!=guard_owner\n        areas=case[\'nativeJobAreas\'];assert type(areas) is dict and set(areas)=={\'build\',\'storage\',\'buildOwner\',\'storageOwner\',\'supplyOwner\'}\n        assert camp_uuid(areas[\'build\'])!=camp_uuid(areas[\'storage\'])\n        for key in [\'buildOwner\',\'storageOwner\',\'supplyOwner\']:assert camp_uuid(areas[key])==native_owner\n        assert case[\'requestedGuardRoles\']==CAMP_ROLES and case[\'unregisteredGuardRoles\']==[\'assassin\']\n        assert type(case[\'workers\']) is list and case[\'workers\'] and type(case[\'guards\']) is list and len(case[\'guards\'])==5\n        faction=camp_string(case[\'expectedEnemyFaction\']);assert faction==\'siegeoverhaul_wilds_marauders\'\n        unique=set();team_tags=set()\n        for kind,owner in [(\'workers\',native_owner),(\'guards\',guard_owner)]:\n            for unit in case[kind]:\n                ident=camp_uuid(unit[\'uuid\']);assert ident not in unique,\'Duplicate native entity UUID\';unique.add(ident)\n                assert camp_uuid(unit[\'owner\'])==owner and camp_string(unit[\'faction\'])==faction\n                camp_boolean(unit[\'noAi\'],False);camp_boolean(unit[\'alive\'],True);camp_boolean(unit[\'scoutSpawnTailRecovered\'])\n                camp_vec(unit[\'position\']);camp_string(unit[\'workerTeamTag\'],empty=True);camp_string(unit[\'guardTeamTag\'],empty=True)\n                camp_boolean(unit[\'owned\']);camp_boolean(unit[\'listening\'])\n                if kind==\'workers\':\n                    assert unit[\'type\']==\'workers:builder\';camp_boolean(unit[\'owned\'],True);camp_boolean(unit[\'listening\'],False)\n                    camp_boolean(unit[\'scoutSpawnTailRecovered\'],False);team_tags.add(camp_string(unit[\'workerTeamTag\']))\n                else:\n                    assert unit[\'type\'] in {\'recruits:bowman\',\'recruits:scout\',\'recruits:crossbowman\'}\n                    camp_boolean(unit[\'scoutSpawnTailRecovered\'],unit[\'type\']==\'recruits:scout\');team_tags.add(camp_string(unit[\'guardTeamTag\']))\n            mirror=case[\'workerEntities\' if kind==\'workers\' else \'guardEntities\']\n            assert type(mirror) is list and len(mirror)==len(case[kind])\n            assert {camp_uuid(v[\'uuid\']):v for v in mirror}=={v[\'uuid\']:v for v in case[kind]},\'Native entity mirror differs\'\n        assert len(team_tags)==1 and next(iter(team_tags)).startswith(\'team:\')\n        assert Counter(v[\'type\'] for v in case[\'guards\'])==Counter({\'recruits:bowman\':2,\'recruits:scout\':2,\'recruits:crossbowman\':1})\n        terrain=case[\'recordedOriginalTerrainCounts\']\n        assert type(terrain) is dict and set(terrain)=={\'minecraft:water\',\'minecraft:oak_log\',\'minecraft:oak_leaves\'}\n        for count in terrain.values():camp_integer(count,1 if index>0 else 0)\n        if index!=2:\n            assert not {\'raisedCampPlane\',\'unchangedRockSupportVerified\',\'campPlaneAboveOriginalSurface\'}.intersection(case)\n        if index==0:\n            assert \'controlledHostileTerrain\' not in case\n        if index==2:\n            camp_boolean(case[\'raisedCampPlane\'],True);camp_boolean(case[\'unchangedRockSupportVerified\'],True)\n            assert camp_integer(case[\'campPlaneAboveOriginalSurface\'])==1\n        if index>0:\n            hostile=case[\'controlledHostileTerrain\']\n            camp_boolean(hostile[\'rockyRise\'],index==2)\n            for key in [\'waterDepth\',\'dryLandingWidth\',\'fixtureWrites\']:camp_integer(hostile[key])\n            assert hostile[\'waterDepth\']==hostile[\'dryLandingWidth\']==3 and 0<hostile[\'fixtureWrites\']<300\n            camp_integer(hostile[\'surface\'],-2**31,2**31-1);camp_string(hostile[\'terrain\'])\n            for key in [\'scout\',\'intendedFallbackCenter\',\'unclaimedProtectedChest\']:camp_pos(hostile[key],short=True)\n            if index==2:camp_pos(hostile[\'unchangedRockSupport\'],short=True)\n        capture=case[\'framebufferCapture\']\n        assert capture[\'screenshot\']==CAMP_SHOTS[index] and type(capture[\'screenshot\']) is str\n        for key in [\'worldReady\',\'observerReady\',\'coreReceived\',\'terrainCompiled\',\'cameraReady\']:camp_boolean(capture[key],True)\n        for key in [\'changedPixelSamples\',\'framebufferAttempts\',\'blankFrames\']:camp_integer(capture[key])\n        camp_number(capture[\'elapsedSeconds\'],0,30)\n        expected=camp_vec(capture[\'expectedObserver\']);actual=camp_vec(capture[\'clientPosition\']);camp_vec(capture[\'cameraPosition\'])\n        assert sum((a-b)**2 for a,b in zip(expected,actual))<.01\n        assert camp_pos(capture[\'campCore\'])==core\n        path=root/CAMP_SHOTS[index]\n        assert path.is_file() and not path.is_symlink() and path.resolve().parent==root.resolve()\n    for mod in [\'workers\',\'recruits\',\'smallships\',\'siegeweapons\']:\n        artifact=data[\'loadedCompanionArtifacts\'][mod]\n        camp_digest(artifact[\'sha256\']);camp_string(artifact[\'fileName\']);assert \'remapped\' in camp_string(artifact[\'kind\'])\n    audit=camp_load(root/\'native-bytecode-audit.json\')\n    assert audit[\'status\']==\'passed\';camp_boolean(audit[\'noVendorJarsUploaded\'],True);camp_string(audit[\'scope\'])\n    assert type(audit[\'artifacts\']) is dict and set(audit[\'artifacts\'])==set(CAMP_AUDIT_CLASSES)\n    for mod,expected_classes in CAMP_AUDIT_CLASSES.items():\n        artifact=audit[\'artifacts\'][mod];loaded=data[\'loadedCompanionArtifacts\'][mod]\n        assert camp_digest(artifact[\'sha256\'])==loaded[\'sha256\'] and artifact[\'fileName\']==loaded[\'fileName\']\n        classes=artifact[\'classes\'];assert type(classes) is list and len(classes)==len(expected_classes)\n        assert [entry[\'class\'] for entry in classes]==expected_classes\n        for entry in classes:\n            filename=entry[\'class\'].rsplit(\'.\',1)[1]+\'.javap.txt\';assert entry[\'file\']==filename\n            path=root/\'native-bytecode\'/filename;assert path.is_file() and not path.is_symlink()\n            assert path.resolve().parent==(root/\'native-bytecode\').resolve()\n            assert hashlib.sha256(path.read_bytes()).hexdigest()==camp_digest(entry[\'sha256\'])\n    return data\n\n\ndef verify(root):\n    verify_shape(root)\n    return verify_source_receipt(root)\n'

          CAMP_LIFECYCLE_SOURCE = '#!/usr/bin/env python3\n"""Strict receipt contract for the actual opt-in integrated-client lifecycle run.\n\nThis is reusable unchanged as scripts/verify-native-camp-lifecycle-evidence.py.\nIt validates recorded evidence; actual pixels and source assertions need review.\n"""\nimport json\nimport math\nfrom pathlib import Path\nimport re\nimport struct\nimport sys\nimport uuid\n\nSHOTS = [\'01-bounded-campless-fallback.png\', \'02-recovered-native-camp.png\']\nSCENARIOS = [\'no-safe-land-reload-fallback\', \'recovery-only-island\']\nGUARD_OWNER = \'fac10000-4a1d-4e75-8a1d-000000000001\'\nREASONS = {\'CLAIM_SETUP\', \'CLAIM_SAFETY\', \'UNLOADED\', \'SURFACE\', \'NAVAL_SPACE\', \'RELIEF\',\n           \'FLUID\', \'PROTECTED_BLOCKS\', \'BUDGET\', \'NO_LAND_EXIT\', \'CLAIM_CREATE\', \'TERRAIN_APPLY\'}\n\n\ndef integer(value, minimum=0, maximum=2**63-1):\n    assert type(value) is int and minimum <= value <= maximum, (\'invalid integer\', value)\n    return value\n\n\ndef boolean(value, expected=None):\n    assert type(value) is bool and (expected is None or value is expected), (\'invalid boolean\', value, expected)\n    return value\n\n\ndef text(value):\n    assert type(value) is str and value.strip() and value != \'null\', (\'invalid text\', value)\n    return value\n\n\ndef identifier(value):\n    assert type(value) is str and str(uuid.UUID(value)) == value, (\'invalid UUID\', value)\n    return value\n\n\ndef pairs(items):\n    result = {}\n    for key, value in items:\n        assert key not in result, (\'duplicate JSON key\', key)\n        result[key] = value\n    return result\n\n\ndef reject_constant(value):\n    raise AssertionError(\'Non-finite JSON constant: \' + value)\n\n\ndef load(path):\n    assert path.is_file() and not path.is_symlink(), (\'missing/unsafe receipt\', str(path))\n    data = json.loads(path.read_text(), object_pairs_hook=pairs, parse_constant=reject_constant)\n    def finite(value):\n        if type(value) is float:\n            assert math.isfinite(value), \'Non-finite JSON number\'\n        elif type(value) is dict:\n            for child in value.values(): finite(child)\n        elif type(value) is list:\n            for child in value: finite(child)\n    finite(data)\n    return data\n\n\ndef compound(value):\n    """Read top-level SNBT fields without flattening quoted/nested compounds.\n\n    Only the known primitive and compound fields emitted by RaidState authority\n    are interpreted below. Duplicate fields and unbalanced structures fail.\n    """\n    text(value)\n    assert value.startswith(\'{\') and value.endswith(\'}\'), \'Expected SNBT compound\'\n    body = value[1:-1]; fields = []; stack = []; quoted = None; escaped = False; start = 0\n    for i, char in enumerate(body):\n        if quoted:\n            if escaped: escaped = False\n            elif char == \'\\\\\': escaped = True\n            elif char == quoted: quoted = None\n        elif char in (\'"\', "\'"): quoted = char\n        elif char in \'{[\': stack.append(char)\n        elif char in \'}]\':\n            assert stack and stack.pop() == {\'}\':\'{\', \']\':\'[\'}[char], \'Unbalanced SNBT\'\n        elif char == \',\' and not stack:\n            fields.append(body[start:i]); start = i + 1\n    assert not stack and quoted is None and not escaped, \'Unbalanced SNBT\'\n    if body: fields.append(body[start:])\n    result = {}\n    for field in fields:\n        key, sep, raw = field.partition(\':\');key=key.strip();raw=raw.strip()\n        assert sep and re.fullmatch(r\'[A-Za-z][A-Za-z0-9_]*\', key) and raw and key not in result, \'Malformed or duplicate SNBT field\'\n        result[key] = raw\n    return result\n\n\ndef snbt_int(value, suffix=\'\'):\n    assert type(value) is str and re.fullmatch(r\'-?(?:0|[1-9][0-9]*)\' + suffix, value), (\'Invalid SNBT integer\', value)\n    return int(value[:-len(suffix)] if suffix else value)\n\n\ndef snbt_string(value):\n    if value.startswith(\'"\'):\n        parsed = json.loads(value)\n        assert type(parsed) is str\n        return parsed\n    # Minecraft\'s simple strings need no quoting; quoted forms use either quote.\n    if value.startswith("\'"):\n        assert value.endswith("\'")\n        out = \'\'; escaped = False\n        for char in value[1:-1]:\n            if escaped:\n                assert char in ("\'", \'\\\\\'), \'Invalid SNBT escape\'\n                out += char; escaped = False\n            elif char == \'\\\\\': escaped = True\n            else: out += char\n        assert not escaped\n        return out\n    assert re.fullmatch(r\'[A-Za-z0-9._+\\-]+\', value), \'Invalid SNBT string\'\n    return value\n\n\ndef diagnostics(value, exhausted):\n    assert type(value) is dict and set(value) == {\'exhausted\', \'counts\'}, \'Invalid typed diagnostics\'\n    boolean(value[\'exhausted\'], exhausted)\n    counts=value[\'counts\'];assert type(counts) is dict and set(counts) <= REASONS\n    for count in counts.values(): integer(count, 1, 10000)\n    return value\n\n\ndef authority(value):\n    keys={\'teamKey\',\'defensePoint\',\'factionId\',\'recovery\',\'retryTicks\',\'searchStep\',\'searchTicks\',\'searchElapsedTicks\',\n          \'searchCandidate\',\'terraformFallback\',\'searchAbandoned\',\'preparationTicks\',\'preparationTotalTicks\',\n          \'wave\',\'pendingWaveSpawns\',\'diagnostics\'}\n    assert type(value) is dict and set(value)==keys, \'Incomplete typed saved search authority\'\n    for key in [\'teamKey\',\'defensePoint\',\'factionId\']:text(value[key])\n    boolean(value[\'recovery\'],True);boolean(value[\'terraformFallback\'],True);boolean(value[\'searchAbandoned\'],False)\n    integer(value[\'retryTicks\'],1,1200)\n    for key in [\'searchStep\',\'searchTicks\',\'searchElapsedTicks\',\'wave\',\'pendingWaveSpawns\']:\n        assert integer(value[key])==0, (\'Reload must occur during pre-search cooldown\',key)\n    assert value[\'searchCandidate\'] is None, \'Cooldown must not select a candidate\'\n    assert integer(value[\'preparationTicks\'])==integer(value[\'preparationTotalTicks\'])==3600\n    diagnostics(value[\'diagnostics\'],False)\n    return value\n\n\ndef reconcile_authority_snbt(raw, value):\n    fields=compound(raw)\n    string_keys={\'Team\':\'teamKey\',\'DefensePoint\':\'defensePoint\',\'FactionId\':\'factionId\'}\n    bool_keys={\'CampSearchRecovery\':\'recovery\',\'CampTerraformed\':\'terraformFallback\',\'CampSearchAbandoned\':\'searchAbandoned\'}\n    int_keys={\'CampSearchRetryTicks\':\'retryTicks\',\'CampSearchStep\':\'searchStep\',\'CampSearchTicks\':\'searchTicks\',\n              \'CampSearchElapsedTicks\':\'searchElapsedTicks\',\'PreparationTicks\':\'preparationTicks\',\n              \'PreparationTotal\':\'preparationTotalTicks\',\'Wave\':\'wave\',\'PendingWaveSpawns\':\'pendingWaveSpawns\'}\n    assert set(fields)==set(string_keys)|set(bool_keys)|set(int_keys)|{\'CampSearchDiagnostics\'}, \'Unexpected/missing authority SNBT field\'\n    for key,field in string_keys.items():assert snbt_string(fields[key])==value[field],key\n    for key,field in bool_keys.items():assert snbt_int(fields[key],\'b\')==int(value[field]),key\n    for key,field in int_keys.items():assert snbt_int(fields[key])==value[field],key\n    recorded=compound(fields[\'CampSearchDiagnostics\']);counts=value[\'diagnostics\'][\'counts\']\n    assert set(recorded)==set(counts)|{\'Exhausted\'}\n    assert snbt_int(recorded[\'Exhausted\'],\'b\')==int(value[\'diagnostics\'][\'exhausted\'])\n    for key,count in counts.items():assert snbt_int(recorded[key])==count,key\n\n\ndef verify(root):\n    root=Path(root)\n    assert root.is_dir() and not root.is_symlink(), \'Unsafe evidence root\'\n    data=load(root/\'result.json\')\n    assert type(data) is dict and data[\'mode\']==\'camp-lifecycle\' and data[\'status\']==\'passed\'\n    config=data[\'fixtureConfiguration\']\n    assert type(config) is dict and set(config)=={\'siegePreparationMinutes\',\'waterDepth\',\'scoutingTimersChanged\',\'recoveryTimersChanged\',\'raidFieldsWritten\'}\n    assert integer(config[\'siegePreparationMinutes\'])==3 and integer(config[\'waterDepth\'])==24\n    for key in [\'scoutingTimersChanged\',\'recoveryTimersChanged\',\'raidFieldsWritten\']:boolean(config[key],False)\n    versions=data[\'loadedModVersions\']\n    for mod,version in {\'minecraft\':\'1.20.1\',\'forge\':\'47.4.16\',\'workers\':\'2.0.3\',\'recruits\':\'1.15.2\',\'smallships\':\'2.0.0-b1.4\',\'siegeweapons\':\'0.2.5\'}.items():\n        assert versions[mod]==version,mod\n    for mod in [\'workers\',\'recruits\',\'smallships\',\'siegeweapons\']:\n        artifact=data[\'loadedCompanionArtifacts\'][mod]\n        assert type(artifact[\'sha256\']) is str and re.fullmatch(r\'[0-9a-f]{64}\',artifact[\'sha256\']),mod\n    assert data[\'screenshots\']==SHOTS and type(data[\'screenshots\']) is list\n    cases=data[\'scenarios\'];assert type(cases) is list and len(cases)==2\n    assert [case[\'scenario\'] for case in cases]==SCENARIOS\n    for index,case in enumerate(cases):\n        assert case[\'status\']==\'passed\' and text(case[\'entry\']).startswith(\'Actual non-op client /siegeoverhaul start\')\n        for key in [\'sawNaturalSearch\',\'sawEarthworksSearch\',\'sawRecoveryCooldown\',\'sawWiderRecovery\',\'restorationExcludedProtectedCells\']:\n            boolean(case[key],True)\n        integer(case[\'searchTicksWithoutWaveOrAttackers\'],101)\n        cooldown=integer(case[\'cooldownTicksWithoutWaveOrAttackers\'],1200)\n        assert type(case[\'passes\']) is dict and set(case[\'passes\'])=={\'natural\',\'earthworks\',\'recovery\'}\n        for budget in case[\'passes\'].values():\n            assert type(budget) is dict and set(budget)=={\'maxCandidates\',\'maxElapsedTicks\'}\n            integer(budget[\'maxCandidates\'],1,200);integer(budget[\'maxElapsedTicks\'],1,4800)\n        integer(case[\'protectedCellCount\'],6144);integer(case[\'protectedChests\'],2)\n        integer(case[\'wave\'],1);integer(case[\'totalSpawned\'],1)\n        recovery_at=integer(case[\'recoveryCooldownAtGameTime\'])\n        search_at=integer(case[\'firstRecoverySearchAtGameTime\'])\n        wave_at=integer(case[\'firstWaveAtGameTime\'])\n        assert search_at-recovery_at>=1200 and cooldown<=search_at-recovery_at, \'Wider search began before full observed cooldown\'\n        assert wave_at>search_at, \'First wave preceded wider search\'\n        boolean(case[\'campSearchAbandoned\'],index==0)\n        boolean(case[\'realWorldReload\'],index==0);boolean(case[\'savedSearchAuthorityVerified\'],index==0)\n        shot=case[\'framebuffer\'];assert type(shot) is dict\n        assert type(shot[\'file\']) is str and shot[\'file\']==SHOTS[index], \'Scenario must use its exact unique framebuffer basename\'\n        integer(shot[\'readyFrames\'],8);integer(shot[\'attempts\'],1);integer(shot[\'changedPixelSamples\'],51)\n        elapsed=shot[\'elapsedSeconds\'];assert type(elapsed) in (int,float) and math.isfinite(elapsed) and 0<=elapsed<30\n        path=root/SHOTS[index]\n        assert path.is_file() and not path.is_symlink() and path.resolve().parent==root.resolve(), \'Unsafe/missing framebuffer\'\n        content=path.read_bytes()\n        assert content.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(content)>4096 and content[12:16]==b\'IHDR\'\n        width,height=struct.unpack(\'>II\',content[16:24])\n        assert 0<width<=8192 and 0<height<=8192, \'Invalid framebuffer dimensions\'\n        state=case[\'finalState\'];assert type(state) is dict\n        assert integer(state[\'scenario\'],0,1)==index and integer(state[\'gameTime\'])>=wave_at\n        boolean(state[\'searchRecovery\'],True);boolean(state[\'terraformFallback\'],True)\n        boolean(state[\'searchAbandoned\'],index==0);boolean(state[\'crewStarted\'],index==1)\n        assert integer(state[\'retryTicks\'])==0\n        integer(state[\'searchStep\'],0,200);integer(state[\'searchElapsedTicks\'],0,4800)\n        assert type(state[\'searchCandidate\']) is str\n        assert integer(state[\'wave\'],1)==case[\'wave\'] and integer(state[\'totalSpawned\'],1)==case[\'totalSpawned\']\n        integer(state[\'raiders\']);integer(state[\'pendingWaveSpawns\'])\n        assert integer(state[\'preparationTotalTicks\'])==3600\n        integer(state[\'preparationTicks\'],0,0 if index==0 else 1200)\n        assert type(state[\'campPosition\']) is str and ((state[\'campPosition\']==\'null\') if index==0 else bool(re.fullmatch(r\'BlockPos\\{x=-?\\d+, y=-?\\d+, z=-?\\d+\\}\',state[\'campPosition\'])))\n        assert text(state[\'diagnostics\'])==text(case[\'campSearchDiagnostics\'])\n        final_diagnostics=compound(state[\'diagnostics\'])\n        assert snbt_int(final_diagnostics[\'Exhausted\'],\'b\')==int(index==0)\n    impossible,recovery=cases\n    assert integer(impossible[\'establishedAtGameTime\'],-1)==-1\n    assert integer(impossible[\'fallbackAtGameTime\'])>=impossible[\'firstRecoverySearchAtGameTime\']\n    assert impossible[\'firstWaveAtGameTime\']-impossible[\'fallbackAtGameTime\']>=3600\n    saved=authority(impossible[\'savedSearchAuthority\']);loaded=authority(impossible[\'loadedSearchAuthority\'])\n    assert saved==loaded, \'Saved and loaded search authority differ\'\n    reconcile_authority_snbt(impossible[\'reloadedAuthority\'],loaded)\n    saved_at=integer(impossible[\'savedSearchAuthorityGameTime\'])\n    loaded_at=integer(impossible[\'loadedSearchAuthorityGameTime\'])\n    assert saved_at==loaded_at and impossible[\'recoveryCooldownAtGameTime\']<=saved_at<impossible[\'firstRecoverySearchAtGameTime\'], \'Reload game time changed or escaped cooldown\'\n    assert integer(recovery[\'fallbackAtGameTime\'],-1)==-1\n    assert recovery[\'firstRecoverySearchAtGameTime\']<=integer(recovery[\'establishedAtGameTime\'])<recovery[\'firstWaveAtGameTime\']\n    island=recovery[\'recoveryIsland\'];assert type(island) is dict\n    assert integer(island[\'width\'])==57 and integer(island[\'soilDepth\'])==24 and integer(island[\'fixtureWrites\'])==57*57*24+4\n    boolean(island[\'originalCandidatesCannotFitCore\'],True)\n    assert integer(island[\'recoveryCooldownAtGameTime\'])==recovery[\'recoveryCooldownAtGameTime\'], \'Duplicated cooldown times disagree\'\n    assert integer(island[\'completedAtGameTime\'])<island[\'recoveryCooldownAtGameTime\']\n    camp=recovery[\'nativeCamp\'];assert type(camp) is dict\n    assert integer(camp[\'nativeClaimChunks\'])==25\n    identifier(camp[\'claimId\']);identifier(camp[\'nativeJobOwner\']);assert camp[\'nativeJobOwner\']!=GUARD_OWNER\n    assert re.fullmatch(r\'-?\\d+, -?\\d+, -?\\d+\',text(camp[\'enemyCore\'])), \'Missing actual enemy-core coordinates\'\n    boolean(camp[\'preservedEdgesRescue\'],True);boolean(camp[\'warGateReadyAtCrewCheck\'])\n    assert integer(camp[\'ordinaryTicksSinceEstablishment\'],60)<=recovery[\'firstWaveAtGameTime\']-recovery[\'establishedAtGameTime\']\n    faction=text(camp[\'expectedEnemyFaction\'])\n    assert type(camp[\'workers\']) is list and camp[\'workers\'] and type(camp[\'guards\']) is list and len(camp[\'guards\'])==5\n    identities=set()\n    for kind in [\'workers\',\'guards\']:\n        for unit in camp[kind]:\n            ident=identifier(unit[\'uuid\']);assert ident not in identities, \'Duplicate native entity identity\';identities.add(ident)\n            boolean(unit[\'noAi\'],False);assert text(unit[\'faction\'])==faction\n            owner=identifier(unit[\'owner\']);assert owner==(camp[\'nativeJobOwner\'] if kind==\'workers\' else GUARD_OWNER)\n            if kind==\'workers\':assert unit[\'type\']==\'workers:builder\'\n            else:assert type(unit[\'type\']) is str and re.fullmatch(r\'recruits:[a-z_]+\',unit[\'type\'])\n    audit=load(root/\'native-bytecode-audit.json\')\n    assert audit[\'status\']==\'passed\';boolean(audit[\'noVendorJarsUploaded\'],True)\n    assert type(audit[\'artifacts\']) is dict and audit[\'artifacts\']\n    assert all(type(value[\'classes\']) is list for value in audit[\'artifacts\'].values())\n    assert sum(len(value[\'classes\']) for value in audit[\'artifacts\'].values())==18\n    return data\n\n\nif __name__==\'__main__\':\n    if len(sys.argv)!=2:raise SystemExit(\'usage: verify-native-camp-lifecycle-evidence.py EVIDENCE_DIRECTORY\')\n    verify(Path(sys.argv[1]))\n    print(\'Strict bounded recovery/reload/native-camp and first-wave receipts verified. Recovery first-wave muster does not imply completed preparation or combat. Review framebuffers separately.\')\n'

          HANDOFF_SOURCE = '"""Offline receipt replay only. Never evidence of a newly executed Minecraft run.\nEvery original workflow/parser assertion is preserved; strict guards add fail-closed typing and bounded reads.\nSource receipt authentication and PR/main commit/run binding remain publisher responsibilities.\n"""\n\nSOURCE_BINDINGS = {\'.github/workflows/native-staged-handoff-qa.yml\': \'993368ea7947de0d62c42b5c162afdc87058f62b7b5ada64ba430bd9134d2873\', \'docs/native-staged-handoff-qa.md\': \'65f74efc5b458ef3ebc249d4978669f274052697228d4fa440c8ce6b3767d210\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeStagedHandoffQa.java\': \'c41c1c00140ae500dc2c5ffba56af10325fa16ebd20b7aacb8b04377a00ac73f\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeStagedHandoffFixture.java\': \'e0b975d07a7b24b585d66b94bf2040259f97eaec4d67ff52a7d5d65d107c10ad\', \'build.gradle\': \'b3a6536dc336a2368d151057f7501fafe8d8f80000f12b8e20b72a1e324998af\', \'gradle.properties\': \'c8d30ed442220642bad66fdd8211db15be1bab7433982a5b7d2acfd8534825a1\', \'scripts/prepare-native-client-defaults.py\': \'40121620a03c2f7fdbd743c1f76d15b01ac44ba9a12f16b3e9bea68acbf99be1\', \'src/main/java/com/devfarinsky/siegeoverhaul/core/ConstructionReport.java\': \'00819ca5f279898ba73e4a84444f83afe5837a86a4bad7e8a067031fc62e656e\', \'scripts/audit-native-inventory-bytecode.py\': \'3d5da9136b618c03e03b26062aa581e68f837d66a843dfcbb15c3e537e33d83e\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeQaTreasury.java\': \'7e9040cc735d4cb4277a9fc4b932b4c5631203f7efb3faab43ea3ed2edbe2372\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeQaTreasuryContracts.java\': \'8db4f13d97c5c384fae6e5c08574a956a5b64b5c03c7fd5eca47223c7fa3849e\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeHollowWallOracle.java\': \'161dc2a13c1fab6cee31f27b9d2e1adbf011ecefb2c681bcb5ff9f8adffd11d9\', \'scripts/verify-native-staged-handoff.py\': \'9740d493ad00e9853e38ac5cd716828eeaf3e5696d425713d968b316f3ded545\'}\n\nSOURCE_PARSER_SHA256 = \'9740d493ad00e9853e38ac5cd716828eeaf3e5696d425713d968b316f3ded545\'\n\nAUDIT_TARGETS = {\'recruits\': (\'recruits-523860-8339846_mapped_official_1.20.1.jar\', [\'com.talhanation.recruits.entities.ai.RecruitUpkeepPosGoal\', \'com.talhanation.recruits.entities.ai.RecruitUpkeepEntityGoal\', \'com.talhanation.recruits.entities.AbstractRecruitEntity\', \'com.talhanation.recruits.entities.AbstractInventoryEntity\', \'com.talhanation.recruits.inventory.RecruitSimpleContainer\', \'com.talhanation.recruits.world.RecruitsClaimManager\', \'com.talhanation.recruits.world.RecruitsClaim\', \'com.talhanation.recruits.entities.ScoutEntity\', \'com.talhanation.recruits.entities.BowmanEntity\', \'com.talhanation.recruits.entities.ai.navigation.RecruitPathNavigation\', \'com.talhanation.recruits.pathfinding.AsyncGroundPathNavigation\', \'com.talhanation.recruits.init.ModEntityTypes\']), \'workers\': (\'workers-567450-8351157_mapped_official_1.20.1.jar\', [\'com.talhanation.workers.entities.ai.GetNeededItemsFromStorage\', \'com.talhanation.workers.entities.ai.DepositItemsToStorage\', \'com.talhanation.workers.entities.ai.RecruitStorageUpkeepGoal\', \'com.talhanation.workers.entities.ai.AbstractChestGoal\', \'com.talhanation.workers.entities.ai.BuilderWorkGoal\', \'com.talhanation.workers.entities.AbstractWorkerEntity\'])}\n\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport re\nimport stat\nimport uuid\n\n\ndef _require(condition, label):\n    if not condition:\n        raise AssertionError(label)\n\n\ndef _safe_root(root):\n    _require(isinstance(root, Path), \'verify(root) requires pathlib.Path\')\n    root = root.absolute()\n    _require(\'..\' not in root.parts, \'evidence root cannot contain parent traversal\')\n    for component in (root, *root.parents):\n        _require(not component.is_symlink(), \'symlink evidence root or ancestor\')\n    _require(root.is_dir(), \'evidence root is not a directory\')\n    return root\n\n\ndef _read(root, name, limit=32 * 1024 * 1024):\n    # Fixed leaf names only. Opening by directory descriptor + O_NOFOLLOW prevents\n    # a receipt or screenshot symlink from escaping the evidence directory.\n    _require(type(name) is str and name not in (\'\', \'.\', \'..\')\n             and \'/\' not in name and \'\\\\\' not in name, \'unsafe evidence filename\')\n    directory = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\n    try:\n        descriptor = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)\n        try:\n            metadata = os.fstat(descriptor)\n            _require(stat.S_ISREG(metadata.st_mode), \'evidence must be a regular file: \' + name)\n            _require(0 < metadata.st_size <= limit, \'evidence file size out of bounds: \' + name)\n            with os.fdopen(descriptor, \'rb\', closefd=False) as stream:\n                content = stream.read(limit + 1)\n            _require(len(content) == metadata.st_size <= limit, \'evidence changed while being read: \' + name)\n            return content\n        finally:\n            os.close(descriptor)\n    finally:\n        os.close(directory)\n\n\ndef _object_pairs(pairs):\n    value = {}\n    for key, item in pairs:\n        _require(key not in value, \'duplicate JSON key: \' + key)\n        value[key] = item\n    return value\n\n\ndef _bad_constant(value):\n    raise AssertionError(\'non-finite JSON number: \' + value)\n\n\ndef _json(root, name):\n    value = json.loads(_read(root, name).decode(\'utf-8\'),\n                       object_pairs_hook=_object_pairs, parse_constant=_bad_constant)\n    _require(type(value) is dict, name + \' must contain a JSON object\')\n    # json.loads can parse finite-looking overflow such as 1e999 into infinity.\n    def finite(item):\n        if type(item) is float:\n            _require(math.isfinite(item), \'non-finite JSON number\')\n        elif type(item) is dict:\n            for child in item.values():\n                finite(child)\n        elif type(item) is list:\n            for child in item:\n                finite(child)\n    finite(value)\n    return value\n\n\ndef _typed(value, kind, label):\n    if kind == \'number\':\n        _require(type(value) in (int, float) and math.isfinite(value), label + \' must be a finite number\')\n    else:\n        _require(type(value) is kind, label + \' has incorrect type\')\n    if kind is str:\n        _require(bool(value.strip()), label + \' cannot be blank\')\n    return value\n\n\ndef _fields(value, **fields):\n    _typed(value, dict, \'receipt object\')\n    for key, kind in fields.items():\n        _require(key in value, \'missing field: \' + key)\n        _typed(value[key], kind, key)\n\n\ndef _ints(value, names, minimum=0):\n    for name in names.split():\n        _fields(value, **{name: int})\n        _require(value[name] >= minimum, name + \' is below its allowed minimum\')\n\n\ndef _bools(value, names):\n    _fields(value, **{name: bool for name in names.split()})\n\n\ndef _strings(value, names):\n    _fields(value, **{name: str for name in names.split()})\n\n\ndef _sha(value, label):\n    _require(type(value) is str and re.fullmatch(\'[0-9a-f]{64}\', value) is not None,\n             label + \' must be a lowercase SHA-256\')\n\n\ndef _uuid(value, label):\n    _typed(value, str, label)\n    try:\n        parsed = uuid.UUID(value)\n    except ValueError:\n        raise AssertionError(label + \' must be a canonical UUID\') from None\n    _require(str(parsed) == value, label + \' must be a canonical UUID\')\n\n\ndef _list(value, kind, label, nonempty=True):\n    _typed(value, list, label)\n    _require(not nonempty or bool(value), label + \' cannot be empty\')\n    for entry in value:\n        _typed(entry, kind, label + \' entry\')\n\n\ndef _stages(data, total):\n    _fields(data, stageLayout=list, reviewedStageCount=int)\n    stages = data[\'stageLayout\']\n    _list(stages, dict, \'stageLayout\')\n    _require(len(stages) == data[\'reviewedStageCount\'], \'stage count does not match receipt\')\n    areas = set()\n    for index, stage in enumerate(stages):\n        _ints(stage, \'index targets\')\n        _strings(stage, \'area digest\')\n        _uuid(stage[\'area\'], \'stage area\')\n        _sha(stage[\'digest\'], \'stage digest\')\n        _require(stage[\'index\'] == index and stage[\'targets\'] > 0, \'invalid stage index or target count\')\n        _require(stage[\'area\'] not in areas, \'duplicate stage area\')\n        areas.add(stage[\'area\'])\n    _require(sum(stage[\'targets\'] for stage in stages) == total, \'stage target total mismatch\')\n\n\ndef _common(data, audit, root):\n    _strings(data, \'mode status\')\n    _fields(data, elapsedSeconds=\'number\', loadedModVersions=dict, loadedCompanionArtifacts=dict, screenshots=list)\n    _list(data[\'screenshots\'], str, \'screenshots\')\n    _strings(data[\'loadedModVersions\'], \'minecraft forge workers recruits smallships siegeweapons\')\n    for mod in (\'workers\', \'recruits\', \'smallships\', \'siegeweapons\'):\n        artifact = data[\'loadedCompanionArtifacts\'][mod]\n        _strings(artifact, \'sha256\')\n        _sha(artifact[\'sha256\'], mod + \' artifact hash\')\n    _fields(audit, status=str, noVendorJarsUploaded=bool, artifacts=dict)\n    _require(set(audit[\'artifacts\']) == set(AUDIT_TARGETS), \'bytecode audit must contain workers and recruits only\')\n    for mod, target in AUDIT_TARGETS.items():\n        artifact = audit[\'artifacts\'][mod]\n        _fields(artifact, fileName=str, sha256=str, classes=list)\n        _sha(artifact[\'sha256\'], mod + \' audit hash\')\n        _require(artifact[\'sha256\'] == data[\'loadedCompanionArtifacts\'][mod][\'sha256\'], \'loaded/audited artifact hash mismatch\')\n        _require(artifact[\'fileName\'] == target[0], \'unexpected audited filename\')\n        _require(data[\'loadedCompanionArtifacts\'][mod].get(\'fileName\') == target[0], \'loaded/audited filename mismatch\')\n        _list(artifact[\'classes\'], dict, mod + \' audited classes\')\n        _require([entry.get(\'class\') for entry in artifact[\'classes\']] == target[1], \'wrong or duplicate audited class roster\')\n        for entry in artifact[\'classes\']:\n            _strings(entry, \'class file sha256\')\n            _sha(entry[\'sha256\'], \'class disassembly hash\')\n            _require(entry[\'file\'] == entry[\'class\'].rsplit(\'.\', 1)[-1] + \'.javap.txt\', \'unexpected disassembly filename\')\n            folder = _safe_root(root / \'native-bytecode\')\n            content = _read(folder, entry[\'file\'])\n            _require(hashlib.sha256(content).hexdigest() == entry[\'sha256\'], \'disassembly content hash mismatch\')\n            _require(entry[\'class\'].encode() in content, \'disassembly does not name expected class\')\n\n\ndef _bank(data):\n    _fields(data, treasuryAccounting=dict)\n    bank = data[\'treasuryAccounting\']\n    _ints(bank, \'startingFunds commissionDebit initialPaidBalance expectedFinalBalance interestCredits taxCredits\')\n    _require(bank[\'initialPaidBalance\'] == bank[\'startingFunds\'] - bank[\'commissionDebit\'], \'initial Treasury balance does not match single debit\')\n    _fields(bank, singleNegativeLedgerDelta=int)\n\n\ndef _preflight(data, audit, root):\n    _common(data, audit, root)\n    _strings(data, \'geometryProfile geometrySourceCommit commissionPath manifestHash reviewFingerprint originalMarker cancellationAuthority cancellationAuthorityNbt keyboardInputScope\')\n    for name in (\'manifestHash\', \'reviewFingerprint\'):\n        _sha(data[name], name)\n    _bools(data, \'hollowCavityAirPreserved walkwayHeadroomAirPreserved nativeStageHollowReservationVerified-0 nativeStageHollowReservationVerified-1 syntheticPartition wholePlanCompleted firstSectionCompletionObserved midStageRestartVerified canceledRestartVerified betweenStageRestartVerified keyboardEscapePreservedProject\')\n    _ints(data, \'qaSectionTargetCap totalLimitSeconds constructionLimitSeconds territoryChunkCount treasuryDebit firstSectionTargetCount nextSectionNativePlaced retainedPlacedBlocks keyboardEscapeObservationTicks\')\n    _fields(data, constructionSeconds=\'number\', hollowOracle=dict, materialCounts=dict,\n            partialRestartClosedLifecycle=dict, restarts=list, nativeStageJoins=list,\n            cancellationCleanup=dict, keyboardInteractions=list, finalDiagnostics=dict,\n            nativeClaimRecords=list, treasuryObserverContracts=list)\n    _ints(data[\'hollowOracle\'], \'columns skinColumns cavityColumns targetCount cavityAirCount headroomAirCount reservedCellCount\')\n    _ints(data[\'materialCounts\'], \'minecraft:cobblestone minecraft:oak_planks\')\n    _list(data[\'nativeClaimRecords\'], str, \'nativeClaimRecords\')\n    for value in data[\'nativeClaimRecords\']:\n        _uuid(value, \'native claim\')\n    _list(data[\'treasuryObserverContracts\'], str, \'treasuryObserverContracts\')\n    _stages(data, 572)\n    closed = data[\'partialRestartClosedLifecycle\']\n    _ints(closed, \'consecutiveServerTicks minimumTicks\')\n    _bools(closed, \'cleanupJournalEmpty storageRunningProblemAbsent activeHandUse\')\n    _list(data[\'restarts\'], dict, \'restarts\')\n    for restart in data[\'restarts\']:\n        _strings(restart, \'kind projectState ledgerGeneration\')\n        _require(restart[\'kind\'] in (\'mid-stage\', \'between-stages\', \'canceled\'), \'unexpected restart kind\')\n        _uuid(restart[\'ledgerGeneration\'], \'ledger generation\')\n        _ints(restart, \'placed pending activeStage\')\n        for suffix in (\'before-shutdown\', \'final-stop\', \'after-reopen\'):\n            _strings(data, \'authority-\' + restart[\'kind\'] + \'-\' + suffix)\n    _strings(data, \'authority-commission authority-native-handoff authority-canceled-before-reopen\')\n    _list(data[\'nativeStageJoins\'], dict, \'nativeStageJoins\')\n    for entry in data[\'nativeStageJoins\']:\n        _strings(entry, \'area marker\')\n        _uuid(entry[\'area\'], \'joined native area\')\n        _bools(entry, \'loadedFromDisk\')\n    _bools(data[\'cancellationCleanup\'], \'markersGone builderDetached reservationsGone\')\n    _list(data[\'keyboardInteractions\'], dict, \'keyboardInteractions\')\n    _require(len(data[\'keyboardInteractions\']) == 6, \'wrong keyboard interaction count\')\n    for index, entry in enumerate(data[\'keyboardInteractions\']):\n        _strings(entry, \'control\')\n        if index == 3:\n            _strings(entry, \'key\')\n            _bools(entry, \'returnedWithoutCancelRequest\')\n        else:\n            _strings(entry, \'keys\')\n            _bools(entry, \'focusMoved\')\n            _ints(entry, \'tabHandlers\')\n    _bank(data)\n    _ints(data[\'treasuryAccounting\'], \'initialPaidBalance\')\n    _ints(data[\'finalDiagnostics\'], \'treasury placed placedCobble chestCobble builderCobble looseCobble placedOak chestOak builderOak looseOak\')\n\n\ndef verify(root):\n    if not __debug__:\n        raise RuntimeError(\'Receipt validators refuse optimized Python because source assertions must remain active\')\n    root = _safe_root(root)\n    data = _json(root, \'result.json\')\n    audit = _json(root, \'native-bytecode-audit.json\')\n    _preflight(data, audit, root)\n    assert audit[\'status\'] == \'passed\' and audit[\'noVendorJarsUploaded\'], audit\n    assert sum((len(value[\'classes\']) for value in audit[\'artifacts\'].values())) == 18, audit\n    assert data[\'mode\'] == \'staged-handoff\' and data[\'status\'] == \'passed\', data\n    assert data[\'geometryProfile\'] == \'hollow-five-wide-one-claim\', data\n    assert data[\'geometrySourceCommit\'] == \'acbc66025e09152db75ab419b34fad81a3dd290e\', data\n    assert data[\'hollowOracle\'] == {\'columns\': 220, \'skinColumns\': 88, \'cavityColumns\': 132, \'targetCount\': 572, \'cavityAirCount\': 396, \'headroomAirCount\': 352, \'reservedCellCount\': 1320}, data\n    assert data[\'hollowCavityAirPreserved\'] and data[\'walkwayHeadroomAirPreserved\'], data\n    assert data[\'nativeStageHollowReservationVerified-0\'] and data[\'nativeStageHollowReservationVerified-1\'], data\n    assert data[\'syntheticPartition\'] is True and data[\'qaSectionTargetCap\'] == 96, data\n    assert \'direct server commission\' in data[\'commissionPath\'], data\n    assert data[\'wholePlanCompleted\'] is False, data\n    assert data[\'totalLimitSeconds\'] == 600 and data[\'constructionLimitSeconds\'] == 540, data\n    assert 0 < data[\'elapsedSeconds\'] < 600, data\n    assert 0 < data[\'constructionSeconds\'] <= 540, data\n    assert data[\'territoryChunkCount\'] == 1 and len(data[\'nativeClaimRecords\']) == 1, data\n    assert data[\'materialCounts\'] == {\'minecraft:cobblestone\': 352, \'minecraft:oak_planks\': 220}, data\n    assert data[\'treasuryDebit\'] == 64 and len(data[\'manifestHash\']) == len(data[\'reviewFingerprint\']) == 64, data\n    stages = data[\'stageLayout\']\n    assert len(stages) == data[\'reviewedStageCount\'] > 2 and sum((part[\'targets\'] for part in stages)) == 572, stages\n    assert all((0 < part[\'targets\'] <= 96 and len(part[\'digest\']) == 64 for part in stages)), stages\n    assert [part[\'index\'] for part in stages] == list(range(len(stages))), stages\n    assert len({part[\'area\'] for part in stages}) == len(stages), stages\n    assert data[\'firstSectionCompletionObserved\'] is True and data[\'firstSectionTargetCount\'] == stages[0][\'targets\'], data\n    assert 0 < data[\'nextSectionNativePlaced\'] < stages[1][\'targets\'], data\n    assert stages[0][\'targets\'] + data[\'nextSectionNativePlaced\'] <= data[\'retainedPlacedBlocks\'] < 572, data\n    assert data[\'midStageRestartVerified\'] is True and data[\'canceledRestartVerified\'] is True, data\n    closed = data[\'partialRestartClosedLifecycle\']\n    assert closed[\'consecutiveServerTicks\'] >= closed[\'minimumTicks\'] == 40, closed\n    assert closed[\'cleanupJournalEmpty\'] and closed[\'storageRunningProblemAbsent\'] and (not closed[\'activeHandUse\']), closed\n    restarts = data[\'restarts\']\n    expected_kinds = [\'mid-stage\', \'between-stages\', \'canceled\'] if data[\'betweenStageRestartVerified\'] else [\'mid-stage\', \'canceled\']\n    assert [restart[\'kind\'] for restart in restarts] == expected_kinds, restarts\n    assert restarts[0][\'projectState\'] == \'RUNNING\' and restarts[0][\'activeStage\'] == 0, restarts\n    assert 0 < restarts[0][\'placed\'] < stages[0][\'targets\'], restarts\n    assert restarts[-1][\'projectState\'] == \'CANCELED\' and restarts[-1][\'activeStage\'] == 1, restarts\n    if data[\'betweenStageRestartVerified\']:\n        assert restarts[1][\'projectState\'] == \'WAITING_FOR_NEXT_STAGE\' and restarts[1][\'activeStage\'] == 1, restarts\n        assert restarts[1][\'placed\'] == stages[0][\'targets\'], restarts\n    for restart in restarts:\n        assert 0 < restart[\'placed\'] < 572 and restart[\'placed\'] + restart[\'pending\'] == 572, restart\n        assert len(restart[\'ledgerGeneration\']) == 36, restart\n        for suffix in [\'before-shutdown\', \'final-stop\', \'after-reopen\']:\n            assert data[\'authority-\' + restart[\'kind\'] + \'-\' + suffix], restart\n    assert data[\'authority-commission\'] and data[\'authority-native-handoff\'] and data[\'authority-canceled-before-reopen\'], data\n    joins = data[\'nativeStageJoins\']\n    assert {entry[\'area\'] for entry in joins} == {stages[0][\'area\'], stages[1][\'area\']}, joins\n    assert all((entry[\'marker\'] == data[\'originalMarker\'] for entry in joins)), joins\n    assert sum((not entry[\'loadedFromDisk\'] for entry in joins)) == 2, joins\n    assert any((entry[\'loadedFromDisk\'] and entry[\'area\'] == stages[0][\'area\'] for entry in joins)), joins\n    assert data[\'cancellationAuthority\'] == \'CANCELED compact terminal receipt\' and data[\'cancellationAuthorityNbt\'], data\n    assert data[\'cancellationCleanup\'] == {\'markersGone\': True, \'builderDetached\': True, \'reservationsGone\': True}, data\n    assert data[\'keyboardEscapeObservationTicks\'] >= 20, data\n    assert data[\'keyboardEscapePreservedProject\'] is True and \'no physical OS input\' in data[\'keyboardInputScope\'], data\n    keyboard = data[\'keyboardInteractions\']\n    assert [entry[\'control\'] for entry in keyboard] == [\'Building\', \'Construction\', \'Cancel entire perimeter\', \'Cancel confirmation\', \'Cancel entire perimeter\', \'Yes\'], keyboard\n    assert keyboard[3][\'key\'] == \'Escape\' and keyboard[3][\'returnedWithoutCancelRequest\'] is True, keyboard\n    for entry in keyboard[:3] + keyboard[4:]:\n        assert entry[\'keys\'] == \'Tab/Enter\' and entry[\'focusMoved\'] is True and (1 <= entry[\'tabHandlers\'] <= 128), entry\n    expected_shots = [\'01-direct-server-commission.png\', \'02-authenticated-core-cancel.png\', \'03-confirm-whole-project-cancel.png\', \'04-canceled-after-reopen.png\']\n    assert data[\'screenshots\'] == expected_shots, data\n    for name in expected_shots:\n        content = _read(root, name)\n        assert content.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(content) > 4096, name\n    versions = data[\'loadedModVersions\']\n    assert versions[\'workers\'] == \'2.0.3\' and versions[\'recruits\'] == \'1.15.2\', versions\n    assert versions[\'minecraft\'] == \'1.20.1\' and versions[\'forge\'] == \'47.4.16\', versions\n    assert versions[\'smallships\'] == \'2.0.0-b1.4\', versions\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert len(data[\'loadedCompanionArtifacts\'][mod][\'sha256\']) == 64, mod\n    final, bank = (data[\'finalDiagnostics\'], data[\'treasuryAccounting\'])\n    assert bank[\'startingFunds\'] == 2000 and bank[\'commissionDebit\'] == 64 and (bank[\'initialPaidBalance\'] == 1936), bank\n    assert bank[\'singleNegativeLedgerDelta\'] == -64, bank\n    assert bank[\'expectedFinalBalance\'] == 1936 + bank[\'interestCredits\'] + bank[\'taxCredits\'], bank\n    assert final[\'treasury\'] == bank[\'expectedFinalBalance\'] and final[\'placed\'] == data[\'retainedPlacedBlocks\'], final\n    assert len(data[\'treasuryObserverContracts\']) == 10, data\n    assert final[\'placedCobble\'] + final[\'chestCobble\'] + final[\'builderCobble\'] + final[\'looseCobble\'] == 352, final\n    assert final[\'placedOak\'] + final[\'chestOak\'] + final[\'builderOak\'] + final[\'looseOak\'] == 220, final\n    return data\n'

          UNLOAD_SOURCE = '"""Offline receipt replay only. Never evidence of a newly executed Minecraft run.\nEvery original workflow/parser assertion is preserved; strict guards add fail-closed typing and bounded reads.\nSource receipt authentication and PR/main commit/run binding remain publisher responsibilities.\n"""\n\nSOURCE_BINDINGS = {\'.github/workflows/native-staged-unload-qa.yml\': \'f7c5a7650ff6405b9f938b07d882f4032c371e0aafa41775d0554429c044f67f\', \'docs/native-staged-unload-qa.md\': \'e9b29a2e588c8b0c55939f9580c9fc8ce70e7990f89b85249e1554483d8b0428\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeStagedUnloadQa.java\': \'aaf93ae8f1b719fb54f66bac005b465bf4e64cc4a070158bd1c1eb4eee1d22d9\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeStagedUnloadFixture.java\': \'4fb2fb7fcd250a3a9695ac1740fbbf6740fc392e55862cb581b01e5ee3e708ce\', \'build.gradle\': \'b3a6536dc336a2368d151057f7501fafe8d8f80000f12b8e20b72a1e324998af\', \'gradle.properties\': \'c8d30ed442220642bad66fdd8211db15be1bab7433982a5b7d2acfd8534825a1\', \'scripts/prepare-native-client-defaults.py\': \'40121620a03c2f7fdbd743c1f76d15b01ac44ba9a12f16b3e9bea68acbf99be1\', \'src/main/java/com/devfarinsky/siegeoverhaul/core/ConstructionReport.java\': \'00819ca5f279898ba73e4a84444f83afe5837a86a4bad7e8a067031fc62e656e\', \'scripts/audit-native-inventory-bytecode.py\': \'3d5da9136b618c03e03b26062aa581e68f837d66a843dfcbb15c3e537e33d83e\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeQaTreasury.java\': \'7e9040cc735d4cb4277a9fc4b932b4c5631203f7efb3faab43ea3ed2edbe2372\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeQaTreasuryContracts.java\': \'8db4f13d97c5c384fae6e5c08574a956a5b64b5c03c7fd5eca47223c7fa3849e\', \'src/nativeQa/java/com/devfarinsky/siegeoverhaul/nativecompat/NativeHollowWallOracle.java\': \'161dc2a13c1fab6cee31f27b9d2e1adbf011ecefb2c681bcb5ff9f8adffd11d9\'}\n\nSOURCE_PARSER_SHA256 = \'7f73522974e77be3e72aabb55d6c86c091346ae59322f5ba36e0e0806e97248d\'\n\nAUDIT_TARGETS = {\'recruits\': (\'recruits-523860-8339846_mapped_official_1.20.1.jar\', [\'com.talhanation.recruits.entities.ai.RecruitUpkeepPosGoal\', \'com.talhanation.recruits.entities.ai.RecruitUpkeepEntityGoal\', \'com.talhanation.recruits.entities.AbstractRecruitEntity\', \'com.talhanation.recruits.entities.AbstractInventoryEntity\', \'com.talhanation.recruits.inventory.RecruitSimpleContainer\', \'com.talhanation.recruits.world.RecruitsClaimManager\', \'com.talhanation.recruits.world.RecruitsClaim\', \'com.talhanation.recruits.entities.ScoutEntity\', \'com.talhanation.recruits.entities.BowmanEntity\', \'com.talhanation.recruits.entities.ai.navigation.RecruitPathNavigation\', \'com.talhanation.recruits.pathfinding.AsyncGroundPathNavigation\', \'com.talhanation.recruits.init.ModEntityTypes\']), \'workers\': (\'workers-567450-8351157_mapped_official_1.20.1.jar\', [\'com.talhanation.workers.entities.ai.GetNeededItemsFromStorage\', \'com.talhanation.workers.entities.ai.DepositItemsToStorage\', \'com.talhanation.workers.entities.ai.RecruitStorageUpkeepGoal\', \'com.talhanation.workers.entities.ai.AbstractChestGoal\', \'com.talhanation.workers.entities.ai.BuilderWorkGoal\', \'com.talhanation.workers.entities.AbstractWorkerEntity\'])}\n\nimport hashlib\nimport json\nimport math\nimport os\nfrom pathlib import Path\nimport re\nimport stat\nimport uuid\n\n\ndef _require(condition, label):\n    if not condition:\n        raise AssertionError(label)\n\n\ndef _safe_root(root):\n    _require(isinstance(root, Path), \'verify(root) requires pathlib.Path\')\n    root = root.absolute()\n    _require(\'..\' not in root.parts, \'evidence root cannot contain parent traversal\')\n    for component in (root, *root.parents):\n        _require(not component.is_symlink(), \'symlink evidence root or ancestor\')\n    _require(root.is_dir(), \'evidence root is not a directory\')\n    return root\n\n\ndef _read(root, name, limit=32 * 1024 * 1024):\n    # Fixed leaf names only. Opening by directory descriptor + O_NOFOLLOW prevents\n    # a receipt or screenshot symlink from escaping the evidence directory.\n    _require(type(name) is str and name not in (\'\', \'.\', \'..\')\n             and \'/\' not in name and \'\\\\\' not in name, \'unsafe evidence filename\')\n    directory = os.open(root, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)\n    try:\n        descriptor = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=directory)\n        try:\n            metadata = os.fstat(descriptor)\n            _require(stat.S_ISREG(metadata.st_mode), \'evidence must be a regular file: \' + name)\n            _require(0 < metadata.st_size <= limit, \'evidence file size out of bounds: \' + name)\n            with os.fdopen(descriptor, \'rb\', closefd=False) as stream:\n                content = stream.read(limit + 1)\n            _require(len(content) == metadata.st_size <= limit, \'evidence changed while being read: \' + name)\n            return content\n        finally:\n            os.close(descriptor)\n    finally:\n        os.close(directory)\n\n\ndef _object_pairs(pairs):\n    value = {}\n    for key, item in pairs:\n        _require(key not in value, \'duplicate JSON key: \' + key)\n        value[key] = item\n    return value\n\n\ndef _bad_constant(value):\n    raise AssertionError(\'non-finite JSON number: \' + value)\n\n\ndef _json(root, name):\n    value = json.loads(_read(root, name).decode(\'utf-8\'),\n                       object_pairs_hook=_object_pairs, parse_constant=_bad_constant)\n    _require(type(value) is dict, name + \' must contain a JSON object\')\n    # json.loads can parse finite-looking overflow such as 1e999 into infinity.\n    def finite(item):\n        if type(item) is float:\n            _require(math.isfinite(item), \'non-finite JSON number\')\n        elif type(item) is dict:\n            for child in item.values():\n                finite(child)\n        elif type(item) is list:\n            for child in item:\n                finite(child)\n    finite(value)\n    return value\n\n\ndef _typed(value, kind, label):\n    if kind == \'number\':\n        _require(type(value) in (int, float) and math.isfinite(value), label + \' must be a finite number\')\n    else:\n        _require(type(value) is kind, label + \' has incorrect type\')\n    if kind is str:\n        _require(bool(value.strip()), label + \' cannot be blank\')\n    return value\n\n\ndef _fields(value, **fields):\n    _typed(value, dict, \'receipt object\')\n    for key, kind in fields.items():\n        _require(key in value, \'missing field: \' + key)\n        _typed(value[key], kind, key)\n\n\ndef _ints(value, names, minimum=0):\n    for name in names.split():\n        _fields(value, **{name: int})\n        _require(value[name] >= minimum, name + \' is below its allowed minimum\')\n\n\ndef _bools(value, names):\n    _fields(value, **{name: bool for name in names.split()})\n\n\ndef _strings(value, names):\n    _fields(value, **{name: str for name in names.split()})\n\n\ndef _sha(value, label):\n    _require(type(value) is str and re.fullmatch(\'[0-9a-f]{64}\', value) is not None,\n             label + \' must be a lowercase SHA-256\')\n\n\ndef _uuid(value, label):\n    _typed(value, str, label)\n    try:\n        parsed = uuid.UUID(value)\n    except ValueError:\n        raise AssertionError(label + \' must be a canonical UUID\') from None\n    _require(str(parsed) == value, label + \' must be a canonical UUID\')\n\n\ndef _list(value, kind, label, nonempty=True):\n    _typed(value, list, label)\n    _require(not nonempty or bool(value), label + \' cannot be empty\')\n    for entry in value:\n        _typed(entry, kind, label + \' entry\')\n\n\ndef _stages(data, total):\n    _fields(data, stageLayout=list, reviewedStageCount=int)\n    stages = data[\'stageLayout\']\n    _list(stages, dict, \'stageLayout\')\n    _require(len(stages) == data[\'reviewedStageCount\'], \'stage count does not match receipt\')\n    areas = set()\n    for index, stage in enumerate(stages):\n        _ints(stage, \'index targets\')\n        _strings(stage, \'area digest\')\n        _uuid(stage[\'area\'], \'stage area\')\n        _sha(stage[\'digest\'], \'stage digest\')\n        _require(stage[\'index\'] == index and stage[\'targets\'] > 0, \'invalid stage index or target count\')\n        _require(stage[\'area\'] not in areas, \'duplicate stage area\')\n        areas.add(stage[\'area\'])\n    _require(sum(stage[\'targets\'] for stage in stages) == total, \'stage target total mismatch\')\n\n\ndef _common(data, audit, root):\n    _strings(data, \'mode status\')\n    _fields(data, elapsedSeconds=\'number\', loadedModVersions=dict, loadedCompanionArtifacts=dict, screenshots=list)\n    _list(data[\'screenshots\'], str, \'screenshots\')\n    _strings(data[\'loadedModVersions\'], \'minecraft forge workers recruits smallships siegeweapons\')\n    for mod in (\'workers\', \'recruits\', \'smallships\', \'siegeweapons\'):\n        artifact = data[\'loadedCompanionArtifacts\'][mod]\n        _strings(artifact, \'sha256\')\n        _sha(artifact[\'sha256\'], mod + \' artifact hash\')\n    _fields(audit, status=str, noVendorJarsUploaded=bool, artifacts=dict)\n    _require(set(audit[\'artifacts\']) == set(AUDIT_TARGETS), \'bytecode audit must contain workers and recruits only\')\n    for mod, target in AUDIT_TARGETS.items():\n        artifact = audit[\'artifacts\'][mod]\n        _fields(artifact, fileName=str, sha256=str, classes=list)\n        _sha(artifact[\'sha256\'], mod + \' audit hash\')\n        _require(artifact[\'sha256\'] == data[\'loadedCompanionArtifacts\'][mod][\'sha256\'], \'loaded/audited artifact hash mismatch\')\n        _require(artifact[\'fileName\'] == target[0], \'unexpected audited filename\')\n        _require(data[\'loadedCompanionArtifacts\'][mod].get(\'fileName\') == target[0], \'loaded/audited filename mismatch\')\n        _list(artifact[\'classes\'], dict, mod + \' audited classes\')\n        _require([entry.get(\'class\') for entry in artifact[\'classes\']] == target[1], \'wrong or duplicate audited class roster\')\n        for entry in artifact[\'classes\']:\n            _strings(entry, \'class file sha256\')\n            _sha(entry[\'sha256\'], \'class disassembly hash\')\n            _require(entry[\'file\'] == entry[\'class\'].rsplit(\'.\', 1)[-1] + \'.javap.txt\', \'unexpected disassembly filename\')\n            folder = _safe_root(root / \'native-bytecode\')\n            content = _read(folder, entry[\'file\'])\n            _require(hashlib.sha256(content).hexdigest() == entry[\'sha256\'], \'disassembly content hash mismatch\')\n            _require(entry[\'class\'].encode() in content, \'disassembly does not name expected class\')\n\n\ndef _bank(data):\n    _fields(data, treasuryAccounting=dict)\n    bank = data[\'treasuryAccounting\']\n    _ints(bank, \'startingFunds commissionDebit initialPaidBalance expectedFinalBalance interestCredits taxCredits\')\n    _require(bank[\'initialPaidBalance\'] == bank[\'startingFunds\'] - bank[\'commissionDebit\'], \'initial Treasury balance does not match single debit\')\n    _fields(bank, singleNegativeLedgerDelta=int)\n\n\ndef _preflight(data, audit, root):\n    _common(data, audit, root)\n    _strings(data, \'scenarioConfiguration fixtureServerConfigSha256 outcome returnedCleanupJournal cancelAuthorityNbt\')\n    _sha(data[\'fixtureServerConfigSha256\'], \'fixture server configuration hash\')\n    _bools(data, \'recruitsChunkLoading fullCompletionClaimed nativeInventoryReloadVerified returnedConservationVerified nativePlacementResumed cancelPacketAuthenticated safeCleanupVerified\')\n    _ints(data, \'totalLimitSeconds controllerSettlingRevisions unloadedBeforeSettlingTicks confirmedUnloadTick placementsDuringDepartureBeforeConfirmedUnload returnedPlaced resumedPlaced finalPlaced\')\n    _fields(data, closedLifecycle=dict, returnedProgressReceipt=dict, unloadedPause=dict,\n            builderTrackingEndInventory=dict, unloadFinalization=dict,\n            builderUnloadInventory=dict, builderLoadInventory=dict, latestConservation=dict)\n    gate = data[\'closedLifecycle\']\n    _ints(gate, \'consecutiveServerTicks minimumTicks carriedCobble nativePlaced\')\n    _bools(gate, \'neededItemsEmpty storageRunningProblemAbsent cleanupJournalEmpty activeHandUse\')\n    _strings(gate, \'nativeGoalState\')\n    progress = data[\'returnedProgressReceipt\']\n    _ints(progress, \'returnedCompleted departureCompleted cleared\')\n    _bools(progress, \'immutableRecipeVerified everyCompletedCellMatchesExactTarget\')\n    pause = data[\'unloadedPause\']\n    _ints(pause, \'ticks activeStage completedStageReceipts\')\n    _fields(pause, serverReportPercent=int)\n    _strings(pause, \'controllerBlocker serverReportActivity\')\n    _bools(pause, \'all49ChunksUnavailable builderUnavailable markerUnavailable remoteMenuRendered\')\n    finalization = data[\'unloadFinalization\']\n    _ints(finalization, \'waitTicks limitTicks confirmedUnloadTick trackingEndTick\')\n    _strings(finalization, \'actualRemovalReason\')\n    _bools(finalization, \'trackingEndInventoryMatched serializationInvocationObservedNotFsync\')\n    for key in (\'builderTrackingEndInventory\', \'builderUnloadInventory\', \'builderLoadInventory\'):\n        inventory = data[key]\n        _ints(inventory, \'gameTime\')\n        _strings(inventory, \'main off cleanup reason\')\n        _fields(inventory, cargo=list)\n        _list(inventory[\'cargo\'], str, key + \'.cargo\')\n    _stages(data, 3900)\n    totals = data[\'latestConservation\']\n    _require(set(totals) == {\'minecraft:cobblestone\', \'minecraft:oak_planks\'}, \'exact two-material conservation coverage is required\')\n    for counts in totals.values():\n        _ints(counts, \'supplied built chests builder owner loose\')\n    _bank(data)\n\n\ndef verify(root):\n    if not __debug__:\n        raise RuntimeError(\'Receipt validators refuse optimized Python because source assertions must remain active\')\n    root = _safe_root(root)\n    data = _json(root, \'result.json\')\n    audit = _json(root, \'native-bytecode-audit.json\')\n    _preflight(data, audit, root)\n    assert audit[\'status\'] == \'passed\' and audit[\'noVendorJarsUploaded\'], audit\n    assert data[\'mode\'] == \'staged-unload\' and data[\'status\'] == \'passed\', data\n    assert data[\'recruitsChunkLoading\'] is False and \'RecruitsChunkLoading=false\' in data[\'scenarioConfiguration\'], data\n    assert len(data[\'fixtureServerConfigSha256\']) == 64, data\n    assert data[\'outcome\'] == \'unloaded pause/resume/cancel\' and (not data[\'fullCompletionClaimed\']), data\n    assert 0 < data[\'elapsedSeconds\'] <= data[\'totalLimitSeconds\'] == 600, data\n    gate = data[\'closedLifecycle\']\n    assert gate[\'consecutiveServerTicks\'] >= gate[\'minimumTicks\'] == 40, gate\n    assert gate[\'carriedCobble\'] >= 32 and gate[\'nativePlaced\'] > 0, gate\n    assert gate[\'neededItemsEmpty\'] and gate[\'storageRunningProblemAbsent\'] and gate[\'cleanupJournalEmpty\'], gate\n    assert not gate[\'activeHandUse\'] and gate[\'nativeGoalState\'] == \'PLACE_BLOCKS\', gate\n    assert data[\'controllerSettlingRevisions\'] in [0, 1] and 0 <= data[\'unloadedBeforeSettlingTicks\'] < 40, data\n    progress = data[\'returnedProgressReceipt\']\n    assert progress[\'returnedCompleted\'] >= progress[\'departureCompleted\'] > 0 and progress[\'cleared\'] == 0, progress\n    assert progress[\'immutableRecipeVerified\'] and progress[\'everyCompletedCellMatchesExactTarget\'], progress\n    pause = data[\'unloadedPause\']\n    assert pause[\'ticks\'] >= 100 and pause[\'all49ChunksUnavailable\'], pause\n    assert pause[\'builderUnavailable\'] and pause[\'markerUnavailable\'] and (not pause[\'remoteMenuRendered\']), pause\n    assert pause[\'activeStage\'] == 0 and pause[\'completedStageReceipts\'] == 0, pause\n    assert \'load the original owned builder\' in pause[\'controllerBlocker\'], pause\n    assert pause[\'serverReportActivity\'] == pause[\'controllerBlocker\'] and pause[\'serverReportPercent\'] < 0, pause\n    tracking = data[\'builderTrackingEndInventory\']\n    finalization = data[\'unloadFinalization\']\n    assert 0 <= finalization[\'waitTicks\'] <= finalization[\'limitTicks\'] == 200, finalization\n    assert finalization[\'confirmedUnloadTick\'] - finalization[\'trackingEndTick\'] == finalization[\'waitTicks\'], finalization\n    assert finalization[\'confirmedUnloadTick\'] == data[\'confirmedUnloadTick\'], finalization\n    assert finalization[\'actualRemovalReason\'] == \'UNLOADED_TO_CHUNK\' and finalization[\'trackingEndInventoryMatched\'], finalization\n    assert finalization[\'serializationInvocationObservedNotFsync\'], finalization\n    removed, loaded = (data[\'builderUnloadInventory\'], data[\'builderLoadInventory\'])\n    assert tracking[\'gameTime\'] == finalization[\'trackingEndTick\'] and removed[\'gameTime\'] == finalization[\'confirmedUnloadTick\'], finalization\n    for key in [\'cargo\', \'main\', \'off\', \'cleanup\']:\n        assert tracking[key] == removed[key], key\n    assert removed[\'reason\'] == \'UNLOADED_TO_CHUNK\' and loaded[\'reason\'] == \'loadedFromDisk\', (removed, loaded)\n    for key in [\'cargo\', \'main\', \'off\']:\n        assert removed[key] == loaded[key], key\n    assert loaded[\'cleanup\'] == \'{}\' and data[\'returnedCleanupJournal\'] == \'{}\', data\n    assert data[\'nativeInventoryReloadVerified\'] and data[\'returnedConservationVerified\'], data\n    assert data[\'placementsDuringDepartureBeforeConfirmedUnload\'] >= 0, data\n    assert 0 < data[\'returnedPlaced\'] < data[\'resumedPlaced\'] <= data[\'finalPlaced\'] < 3900, data\n    assert data[\'nativePlacementResumed\'] and data[\'cancelPacketAuthenticated\'] and data[\'safeCleanupVerified\'], data\n    assert data[\'cancelAuthorityNbt\'] and data[\'reviewedStageCount\'] >= 1, data\n    assert sum((stage[\'targets\'] for stage in data[\'stageLayout\'])) == 3900, data\n    for material, totals in data[\'latestConservation\'].items():\n        expected = 2400 if material == \'minecraft:cobblestone\' else 1500\n        assert totals[\'supplied\'] == expected, totals\n        assert sum((totals[k] for k in [\'built\', \'chests\', \'builder\', \'owner\', \'loose\'])) == expected, totals\n    bank = data[\'treasuryAccounting\']\n    assert bank[\'startingFunds\'] == 2000 and bank[\'commissionDebit\'] == 64 and (bank[\'singleNegativeLedgerDelta\'] == -64), bank\n    assert bank[\'expectedFinalBalance\'] == 1936 + bank[\'interestCredits\'] + bank[\'taxCredits\'], bank\n    versions = data[\'loadedModVersions\']\n    assert versions[\'workers\'] == \'2.0.3\' and versions[\'recruits\'] == \'1.15.2\', versions\n    assert versions[\'minecraft\'] == \'1.20.1\' and versions[\'forge\'] == \'47.4.16\', versions\n    for mod in [\'workers\', \'recruits\', \'smallships\', \'siegeweapons\']:\n        assert len(data[\'loadedCompanionArtifacts\'][mod][\'sha256\']) == 64, mod\n    assert data[\'screenshots\'] == [\'01-returned-permission-pause.png\'], data\n    image = _read(root, data[\'screenshots\'][0])\n    assert image.startswith(b\'\\x89PNG\\r\\n\\x1a\\n\') and len(image) > 4096\n    return data\n'


          SIZEABLE_SOURCE = '#!/usr/bin/env python3\n"""Validate actual addon evidence; synthetic parser tests do not establish gameplay."""\nimport hashlib\nimport json\nimport os\nfrom pathlib import Path\nimport sys\n\nMOD = \'sizeable_foliage\'\nVERSION = \'m2kFJSUs\'\nCLASS = \'com.craisinlord.sizeablefoliage.content.block.VeryShortGrassBlock\'\nORIGINAL_SHA512 = \'2edb316ea862cd0e7c9e748a2ccc05c363590f6e05a67eeee765ba559345104637e3134abc049f164b95123797ed7beea679ddc4322fb1ab1fb26a4962f45b92\'\nORIGINAL_SHA256 = \'19224fa993d92e605855261dc846d95239f05c3d4a74f1d199d025c918566e0a\'\nEXCLUDED = [MOD + \':\' + name for name in [\'very_tall_grass\', \'very_large_fern\', \'big_bush\', \'big_bush_part\',\n    \'big_sweet_berry_bush\', \'big_sweet_berry_bush_part\', \'fern_wall\', \'torchflower_bush\']]\nEXCLUDED += [\'minecraft:\' + name for name in [\'wheat\', \'oak_sapling\', \'chest\', \'water\', \'stone_bricks\']]\nPLANT_PROOFS = [\'supportOutsideMutationPlan\', \'survivedFreePreview\', \'survivedUnpaidConfirmation\',\n    \'paidAcceptanceRecorded\', \'nativeClearedReceipt\', \'receiptsSurvivedReload\',\n    \'nativePlacedExpectedBlock\', \'supportPreserved\', \'exactMaterialConservation\']\n\n\ndef verify(data):\n    gameplay = data[\'gameplay\']\n    assert data[\'status\'] == gameplay[\'status\'] == \'passed\', data\n    runtime = data[\'sizeableFoliageRuntime\']\n    assert runtime[\'modId\'] == MOD and runtime[\'version\'] == \'1.2.1\', runtime\n    assert runtime[\'officialVersionId\'] == VERSION and runtime[\'runtimeClass\'] == CLASS, runtime\n    assert runtime[\'noDeclaredRemovalOrMultipartOverrides\'] is True, runtime\n    assert len(runtime[\'sha256\']) == 64 and all(c in \'0123456789abcdef\' for c in runtime[\'sha256\']), runtime\n    assert runtime[\'fileName\'].endswith(\'.jar\'), runtime\n    assert \'remapped runtime JAR\' in runtime[\'artifactScope\'], runtime\n    forbidden = {\'onRemove\', \'playerDestroy\', \'playerWillDestroy\', \'neighborChanged\', \'onPlace\',\n                 \'updateShape\', \'createBlockStateDefinition\'}\n    assert not forbidden.intersection(runtime[\'declaredMethods\']), runtime\n    review = gameplay[\'sizeableFoliageReviews\']\n    for key in [\'shortGrassTargetAndClearanceAccepted\', \'runtimeStateSafetyVerified\',\n                \'plantsPreservedDuringReview\', \'shortGrassStandingSiteAccepted\', \'exactWorkerInventoryAndReceipts\', \'fixtureTerrainRestored\']:\n        assert review[key] is True, (key, review)\n    assert review[\'treasuryDebit\'] == 0, review\n    assert \'production prepare and standing-site checks only\' in review[\'scope\'], review\n    assert set(review[\'rejections\']) == set(EXCLUDED), review\n    for key, problem in review[\'rejections\'].items():\n        assert key in problem and review[\'targetCell\'] in problem, (key, problem)\n    plant = gameplay[\'singleCellPlant\']\n    assert plant[\'plant\'] == MOD + \':very_short_grass\', plant\n    for key in PLANT_PROOFS:\n        assert plant[key] is True, (key, plant)\n    assert gameplay[\'completedManualBlocks\'] == 83 and gameplay[\'manualTreasuryDebit\'] == 8, gameplay\n    assert gameplay[\'manualPaidTreasury\'] == 992 and gameplay[\'completedManualRestart\'][\'treasury\'] == 992, gameplay\n    assert \'18-completed-manual-wall-and-builder.png\' in data[\'screenshots\'], data\n    return {\'status\': \'passed\', \'runtime\': runtime, \'reviews\': review, \'plant\': plant,\n            \'scope\': \'Actual-addon bounded native wall fixture; no complete territory or dedicated multiplayer claim\'}\n\n\ndef audit_original(cache):\n    directory = cache / \'modules-2/files-2.1/maven.modrinth/sizeable-foliage\' / VERSION\n    candidates = sorted(directory.glob(\'*/*.jar\'))\n    assert candidates, \'Original pinned Modrinth artifact is absent from the resolved Gradle module cache\'\n    for path in candidates:\n        content = path.read_bytes()\n        assert hashlib.sha512(content).hexdigest() == 