      - if: steps.guard.outputs.publish == 'true'
        name: Verify exact PR to main payload and all testcase identities
        run: |
          python3 - <<'CHECK'
          """Local-only reobfuscation evidence check; never executes or rebuilds a JAR.

          The class parser is inherited unchanged from the 4.52.3 publisher, originally
          copied from the independent PR261 artifact review.
          Use against exact downloaded merged-main bytes during the independent final gate.
          This is an evidence check, not a reproducible-build attestation or gameplay test.
          """
          import argparse
          import hashlib
          import json
          from pathlib import Path
          import re
          import struct
          import zipfile


          def class_info(b):
              assert b[:4] == b"\xca\xfe\xba\xbe"
              minor, major, size = struct.unpack_from(">HHH", b, 4)
              cp = [None]
              pos = 10
              while len(cp) < size:
                  tag = b[pos]
                  pos += 1
                  if tag == 1:
                      length = struct.unpack_from(">H", b, pos)[0]
                      pos += 2
                      value = b[pos:pos + length].decode("utf-8", "replace")
                      pos += length
                  elif tag in (3, 4):
                      value = b[pos:pos + 4]
                      pos += 4
                  elif tag in (5, 6):
                      value = b[pos:pos + 8]
                      pos += 8
                  elif tag in (7, 8, 16, 19, 20):
                      value = struct.unpack_from(">H", b, pos)[0]
                      pos += 2
                  elif tag in (9, 10, 11, 12, 17, 18):
                      value = struct.unpack_from(">HH", b, pos)
                      pos += 4
                  elif tag == 15:
                      value = struct.unpack_from(">BH", b, pos)
                      pos += 3
                  else:
                      raise AssertionError(f"Unknown class constant tag {tag}")
                  cp.append((tag, value))
                  if tag in (5, 6):
                      cp.append(None)
              refs = []
              for entry in cp:
                  if entry and entry[0] in (9, 10, 11):
                      klass, nt = entry[1]
                      owner = cp[cp[klass][1]][1]
                      name, desc = cp[nt][1]
                      refs.append({"kind": "field" if entry[0] == 9 else "method", "owner": owner, "name": cp[name][1], "descriptor": cp[desc][1]})
              flags, this_class, superclass, interface_count = struct.unpack_from(">HHHH", b, pos)
              assert cp[this_class][0] == 7
              return {"minor": minor, "major": major, "thisClass": cp[cp[this_class][1]][1], "references": refs}

          def verify(path, expected_sha256):
              assert re.fullmatch(r'[0-9a-f]{64}', expected_sha256), 'Expected SHA-256 is required'
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == expected_sha256, 'JAR hash does not match the independently pinned artifact'
              screens = ('CoreHireScreen', 'ProtectedConstructionScreen',
                         'SiegeCommandScreen', 'SiegeOverhaulConfigScreen')
              evidence = {}
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert len(archive.namelist()) == len(set(archive.namelist()))
                  for screen in screens:
                      name = 'com/devfarinsky/siegeoverhaul/client/' + screen + '.class'
                      info = class_info(archive.read(name))
                      assert info['major'] == 61 and info['minor'] == 0, name
                      assert info['thisClass'] + '.class' == name, name
                      refs = [r for r in info['references'] if r['owner'].startswith('net/minecraft/')
                              and re.fullmatch(r'[mf]_\d+_', r['name'])]
                      assert refs, 'No SRG-remapped Minecraft member references: ' + screen
                      evidence[screen] = refs
              return {'status': 'srg-remapped-screen-reference-check-passed',
                      'sha256': digest, 'screens': evidence,
                      'limit': 'Necessary reobfuscation evidence only; requires exact Build/source/artifact provenance and complete JAR verification.'}


          """Compare complete PR/main JAR payloads and regression case identities honestly.

          The build explicitly embeds Implementation-Timestamp. Exact byte differences are
          recorded; only that manifest value and ZIP metadata may differ. XML execution
          metrics/runner identities/stdout/stderr are separately retained as diagnostics,
          never mistaken for changed or omitted testcase outcomes.
          """
          import hashlib
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile


          def sha(raw):return hashlib.sha256(raw).hexdigest()


          def compare_jars(pr_path,main_path):
              with zipfile.ZipFile(pr_path) as p,zipfile.ZipFile(main_path) as m:
                  assert p.testzip() is None and m.testzip() is None
                  pn=p.namelist();mn=m.namelist();assert len(pn)==len(set(pn)) and len(mn)==len(set(mn))
                  assert set(pn)==set(mn),'PR/main JAR entry sets differ'
                  changed=[];metadata=[];classes=0
                  for name in sorted(pn):
                      pb=p.read(name);mb=m.read(name)
                      if name.endswith('.class'):classes+=1
                      if pb!=mb:
                          assert name=='META-INF/MANIFEST.MF','PR/main payload differs: '+name
                          pl=pb.decode().splitlines();ml=mb.decode().splitlines()
                          strip=lambda lines:[line for line in lines if not line.startswith('Implementation-Timestamp: ')]
                          assert strip(pl)==strip(ml),'Manifest differs beyond declared build timestamp'
                          pt=[line.split(': ',1)[1] for line in pl if line.startswith('Implementation-Timestamp: ')]
                          mt=[line.split(': ',1)[1] for line in ml if line.startswith('Implementation-Timestamp: ')]
                          assert len(pt)==len(mt)==1
                          changed.append({'entry':name,'pr_sha256':sha(pb),'main_sha256':sha(mb),'reason':'Source build.gradle deliberately embeds Implementation-Timestamp','pr_timestamp':pt[0],'main_timestamp':mt[0]})
                      pi=p.getinfo(name);mi=m.getinfo(name)
                      fields=['date_time','compress_type','create_system','external_attr','extra','comment']
                      differs=[key for key in fields if getattr(pi,key)!=getattr(mi,key)]
                      if differs:metadata.append({'entry':name,'changed_zip_metadata_fields':differs})
                  return {'pr_jar_sha256':sha(Path(pr_path).read_bytes()),'main_jar_sha256':sha(Path(main_path).read_bytes()),'entry_count':len(pn),'class_count':classes,'all_class_bytes_identical':True,'payload_differences':changed,'zip_metadata_differences':metadata,'identical_entry_order':pn==mn}


          def canonical_xml(path):
              root=ET.parse(path).getroot();assert root.tag=='testsuite'
              assert set(root.attrib)<={'name','tests','skipped','failures','errors','timestamp','hostname','time'}
              attrs={key:value for key,value in root.attrib.items() if key not in {'timestamp','hostname','time'}}
              assert all(attrs[k]=='0' for k in ['skipped','failures','errors'])
              cases=[];properties=[];diagnostics=[]
              for child in root:
                  if child.tag=='testcase':
