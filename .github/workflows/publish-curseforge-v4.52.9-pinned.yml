jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require complete immutable 4.52.9 pins
        run: |
          python3 - <<'CHECK'
          """Fail locally before any API read unless every immutable 4.52.9 pin is filled."""
          import os
          import re


          def main():
              assert os.environ['GITHUB_REPOSITORY'] == 'boostbar9/Faction-Raids'
              assert os.environ['GITHUB_REF'] == 'refs/heads/publish/curseforge-v4.52.9'
              assert os.environ['GITHUB_EVENT_NAME'] == 'push'
              for key in ('REVIEWED_SOURCE_SHA', 'MERGED_SOURCE_SHA', 'SOURCE_TREE_SHA', 'HUD_CHECKOUT_SHA', 'BUILDING_CHECKOUT_SHA', 'SERVER_CHECKOUT_SHA', 'CAMP_CHECKOUT_SHA', 'LIFECYCLE_CHECKOUT_SHA', 'HANDOFF_CHECKOUT_SHA', 'UNLOAD_CHECKOUT_SHA'):
                  assert re.fullmatch(r'[0-9a-f]{40}', os.environ[key]), 'Unfilled source pin: ' + key
              for key in ('COPILOT_REVIEW_BODY_SHA256', 'INDEPENDENT_REVIEW_BODY_SHA256', 'ARTIFACT_SHA256', 'REGRESSION_SUITE_SHA256', 'HUD_EVIDENCE_SHA256', 'BUILDING_EVIDENCE_SHA256', 'SERVER_EVIDENCE_SHA256', 'CAMP_EVIDENCE_SHA256', 'LIFECYCLE_EVIDENCE_SHA256', 'HANDOFF_EVIDENCE_SHA256', 'UNLOAD_EVIDENCE_SHA256'):
                  assert re.fullmatch(r'[0-9a-f]{64}', os.environ[key]), 'Unfilled digest pin: ' + key
              for key in ('COPILOT_REVIEW_ID', 'INDEPENDENT_REVIEW_COMMENT_ID', 'PULL_REQUEST_NUMBER', 'REVIEWED_BUILD_RUN_ID', 'REVIEWED_JAR_ARTIFACT_ID',
                          'REVIEWED_REGRESSION_ARTIFACT_ID', 'BUILD_RUN_ID',
                          'BUILD_RUN_ATTEMPT', 'JAR_ARTIFACT_ID', 'REGRESSION_ARTIFACT_ID',
                          'REGRESSION_TEST_COUNT', 'REGRESSION_SUITE_COUNT', 'REVIEWED_BUILD_RUN_ATTEMPT',
                          'HUD_RUN_ID', 'HUD_RUN_ATTEMPT', 'HUD_ARTIFACT_ID',
                          'BUILDING_RUN_ID', 'BUILDING_RUN_ATTEMPT', 'BUILDING_ARTIFACT_ID',
                          'SERVER_RUN_ID', 'SERVER_RUN_ATTEMPT', 'SERVER_ARTIFACT_ID',
                          'CAMP_RUN_ID', 'CAMP_RUN_ATTEMPT', 'CAMP_ARTIFACT_ID',
                          'LIFECYCLE_RUN_ID', 'LIFECYCLE_RUN_ATTEMPT', 'LIFECYCLE_ARTIFACT_ID',
                          'HANDOFF_RUN_ID', 'HANDOFF_RUN_ATTEMPT', 'HANDOFF_ARTIFACT_ID',
                          'UNLOAD_RUN_ID', 'UNLOAD_RUN_ATTEMPT', 'UNLOAD_ARTIFACT_ID'):
                  assert re.fullmatch(r'[1-9][0-9]*', os.environ[key]), 'Unfilled or invalid pin: ' + key
              assert os.environ['BUILD_RUN_ID'] != os.environ['REVIEWED_BUILD_RUN_ID'], 'PR Build is not a merged-main release Build'
              artifact_ids = [os.environ[key] for key in (
                  'REVIEWED_JAR_ARTIFACT_ID', 'REVIEWED_REGRESSION_ARTIFACT_ID',
                  'JAR_ARTIFACT_ID', 'REGRESSION_ARTIFACT_ID')]
              assert len(set(artifact_ids)) == 4, 'PR/main JAR/XML artifact IDs must all be distinct'
              assert len({os.environ[key] for key in ('BUILD_RUN_ID', 'REVIEWED_BUILD_RUN_ID', 'HUD_RUN_ID', 'BUILDING_RUN_ID', 'SERVER_RUN_ID', 'CAMP_RUN_ID', 'LIFECYCLE_RUN_ID', 'HANDOFF_RUN_ID', 'UNLOAD_RUN_ID')}) == 9, 'All nine gate runs must be distinct'
              assert len(set(artifact_ids + [os.environ[prefix + '_ARTIFACT_ID'] for prefix in ('HUD', 'BUILDING', 'SERVER', 'CAMP', 'LIFECYCLE', 'HANDOFF', 'UNLOAD')])) == 11, 'All eleven artifact IDs must be distinct'
              assert int(os.environ['REGRESSION_TEST_COUNT']) >= int(os.environ['REGRESSION_SUITE_COUNT'])
              for key, value in {'CAMP_ARTIFACT_ID': '11326611602', 'CAMP_CHECKOUT_SHA': 'd16052ae084067b43c81fff2dc9536af45492462', 'CAMP_EVIDENCE_SHA256': '0d4b9122dc85e50fcb8dce24d541bf57505a32daf8eb17149ba32f34755868f0', 'CAMP_RUN_ATTEMPT': '1', 'CAMP_RUN_ID': '37265282600', 'HUD_ARTIFACT_ID': '11325883534', 'HUD_CHECKOUT_SHA': 'd16052ae084067b43c81fff2dc9536af45492462', 'HUD_EVIDENCE_SHA256': '97283cb3c1e73164597fc2ddda5c14040f831d8a0a0559fa8c9899e1d1f06f5d', 'HUD_RUN_ATTEMPT': '1', 'HUD_RUN_ID': '37265282546', 'LIFECYCLE_ARTIFACT_ID': '11320914488', 'LIFECYCLE_CHECKOUT_SHA': '0bc7715ecc72dbbf2bd01810fc247592a9658d22', 'LIFECYCLE_EVIDENCE_SHA256': '5a144ae5c4b3493f28c1615080aada8342156a105f4f2f8a51d015e8de39a970', 'LIFECYCLE_RUN_ATTEMPT': '1', 'LIFECYCLE_RUN_ID': '37249819787'}.items():
