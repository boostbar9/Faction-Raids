name: Publish tested 4.9.3 beta to CurseForge
on:
  push:
    branches: [publish/curseforge-v4.9.3]
permissions:
  contents: read
  actions: read
concurrency:
  group: curseforge-1364352-v4.9.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 34204280940
          github-token: ${{ github.token }}
          path: dist
      - name: Verify tested bytes and metadata
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          jar = Path('dist/siegeoverhaul-4.9.3.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == '65f477e7f7063b778e281ca252c2aa0b6be23cb56afd8b662a995a029e2cf32d'
          with zipfile.ZipFile(jar) as z:
              data = tomllib.loads(z.read('META-INF/mods.toml').decode())
          assert data['mods'][0]['modId'] == 'siegeoverhaul'
          assert data['mods'][0]['version'] == '4.9.3'
          dependencies = {x['modId']: x for x in data['dependencies']['siegeoverhaul']}
          for mod in ['recruits', 'workers', 'smallships', 'siegeweapons']:
              assert dependencies[mod]['mandatory'], mod
          print('Verified', jar.name, digest)
          CHECK
      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.9.3.jar
          name: The Siege Overhaul v4.9.3 beta - Ready-built War Gates and Builder Recovery
          version: v4.9.3
          version-type: beta
          changelog: |
            ## 4.9.3 beta
            
            - War Gates and their graded access roads assemble when the camp is established. Builders work on ordinary camp structures instead of the gate crest.
            - Recover unfinished gates in existing saves and rescan active native work orders without adding supplies or replacing dead builders.
            - Gate assembly validates terrain and occupants, preserves the cleanup ledger and rolls back rejected placements.
            - Use ASCII punctuation in the copy-ready Markdown description to prevent encoding problems when pasting.
            - Network protocol remains 11. Update server and clients together.
            
            REQUIRED on server and every client: Villager Recruits 1.15.2+, Villager Workers 2 2.0.3+, Small Ships and Siege Weapons. Minecraft 1.20.1 Forge, Java 17. Match Siege Overhaul versions.
            
            Validation: Java 17 clean build and 139 regression tests passed. No interactive Minecraft playtest; published as beta.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          dependencies: |
            recruits(required)
            workers(required)
            smallships(required)
            siegeweapons(required)
          fail-mode: fail
      - name: Record published file
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os
          result = {'version': '4.9.3', 'file_id': os.environ['RELEASE_FILE_ID'], 'url': os.environ['RELEASE_URL']}
          assert result['file_id'] and result['url'], 'CurseForge did not return a published file'
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Published The Siege Overhaul 4.9.3 beta: {result['url']}\n")
          RECEIPT
