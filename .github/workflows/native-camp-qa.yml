name: Native Camp Spawn QA

# Actual non-op command and production scouting in three fresh integrated-server worlds.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: native-camp-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-camp-client:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'native-camp-qa'))
    runs-on: ubuntu-24.04
    timeout-minutes: 43
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Check out exact integrated source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Install virtual display and software OpenGL from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libopenal1
      - name: Prepare new isolated camp directory
        run: |
          set -euo pipefail
          test ! -e build/native-camp-qa/client
          test ! -e build/native-camp-qa/evidence
          python3 -B -m unittest discover -s scripts/tests -p 'test_prepare_native_client_defaults.py'
          python3 -B -m unittest discover -s scripts/tests -p 'test_native_camp_capture_readiness.py'
          python3 scripts/prepare-native-client-defaults.py --mode camp-spawn --smallships-version 2.0.0-b1.4
          mkdir -p build/native-camp-qa/evidence
          cp build/native-camp-qa/client/.native-smallships-defaults.json build/native-camp-qa/evidence/smallships-default-config-provenance.json
          test ! -e build/native-camp-qa/client/config/siegeoverhaul-common.toml
          printf '[playerRaids]\nallowedRaiderFactions = ["wilds_marauders"]\n' > build/native-camp-qa/client/config/siegeoverhaul-common.toml
          printf 'onboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:5\nmaxFps:30\nvsync:false\n' > build/native-camp-qa/client/options.txt
          git rev-parse HEAD > build/native-camp-qa/evidence/source-commit.txt
          java -version 2> build/native-camp-qa/evidence/java-version.txt
      - name: Run real natural, shallow-water and rocky camp establishment
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            set -euo pipefail
            glxinfo -B | tee build/native-camp-qa/evidence/opengl.txt
            timeout --signal=TERM --kill-after=60s 37m ./gradlew --no-daemon --console=plain --max-workers=2 -PnativeQa=true -PnativeQaMode=camp-spawn runClient 2>&1 | tee build/native-camp-qa/evidence/client-console.log
          '
      - name: Audit exact loaded native guard and inventory bytecode
        if: always()
        run: python3 scripts/audit-native-inventory-bytecode.py build/native-camp-qa/evidence
      - name: Verify real camp evidence contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/native-camp-qa/evidence')
          data = json.loads((root / 'result.json').read_text())
          assert data['mode'] == 'camp-spawn' and data['status'] == 'passed', data
          audit = json.loads((root / 'native-bytecode-audit.json').read_text())
          assert audit['status'] == 'passed' and audit['noVendorJarsUploaded'], audit
          assert sum(len(v['classes']) for v in audit['artifacts'].values()) == 22, audit
          versions = data['loadedModVersions']
          for mod, version in {'minecraft': '1.20.1', 'forge': '47.4.16', 'workers': '2.0.3',
                               'recruits': '1.15.2', 'smallships': '2.0.0-b1.4', 'siegeweapons': '0.2.5'}.items():
              assert versions[mod] == version, versions
          for mod in ['workers', 'recruits', 'smallships', 'siegeweapons']:
              assert len(data['loadedCompanionArtifacts'][mod]['sha256']) == 64, mod
          scenarios = data['scenarios']
          assert len(scenarios) == 3, scenarios
          assert [case['scenario'] for case in scenarios] == ['natural-flat', 'controlled-shallow-water-forest', 'controlled-rocky-water-forest']
          for index, case in enumerate(scenarios):
              assert case['status'] == 'passed' and case['nativeClaimChunks'] == 25, case
              capture = case['framebufferCapture']
              assert all(capture[key] for key in ['worldReady', 'observerReady', 'coreReceived', 'terrainCompiled', 'cameraReady']), capture
              assert 0 <= capture['elapsedSeconds'] < 30 and capture['changedPixelSamples'] > 50, capture
              assert capture['framebufferAttempts'] > capture['blankFrames'], capture
              assert case['terraformFallback'] == bool(index) and case['crewStarted'], case
              assert case['enemyCore'] and case['claimId'] != 'null', case
              assert case['workers'] and case['guards'], case
              assert len(case['guards']) == case['registeredGuardRoleCount'], case
              assert case['ordinaryTicksSinceEstablishment'] >= 60, case
              assert case['unregisteredGuardRoles'] == ['assassin'], case
              recovered = [guard for guard in case['guards'] if guard['type'] == 'recruits:scout' and guard['scoutSpawnTailRecovered']]
              assert len(recovered) == 2 and len(case['guards']) == 5, case
              for unit in case['workers'] + case['guards']:
                  assert not unit['noAi'] and unit['faction'] == case['expectedEnemyFaction'], unit
              assert case['nativeJobOwnershipVerified'] and case['nativeJobOwner'] != case['guardOwner'], case
              assert case['nativeWorkAreaAccessVerified'] and case['nativeBuilderStorageEnabled'], case
              for worker in case['workers']:
                  assert worker['owner'] == case['nativeJobOwner'] and worker['owned'] and not worker['listening'], worker
              for guard in case['guards']:
                  assert guard['owner'] == case['guardOwner'] == 'fac10000-4a1d-4e75-8a1d-000000000001', guard
              assert all(case['nativeJobAreas'][key] == case['nativeJobOwner']
                         for key in ['buildOwner', 'storageOwner', 'supplyOwner']), case
              assert all(unit['type'].startswith('recruits:') for unit in case['guards']), case
              assert case['protectedCellCount'] >= 6144 and case['protectedChests'] >= 2, case
              assert case['entry'].startswith('Actual non-op client /siegeoverhaul start'), case
          hostile = scenarios[1]['controlledHostileTerrain']
          assert hostile['waterDepth'] == 3 and hostile['dryLandingWidth'] == 3 and hostile['fixtureWrites'] < 300
          assert scenarios[1]['hostileTerrainPrepared'], scenarios[1]
          assert all(scenarios[1]['recordedOriginalTerrainCounts'][block] > 0
                     for block in ['minecraft:water', 'minecraft:oak_log', 'minecraft:oak_leaves']), scenarios[1]
          rocky = scenarios[2]
          assert rocky['controlledHostileTerrain']['rockyRise'] and rocky['controlledHostileTerrain']['fixtureWrites'] < 300, rocky
          assert rocky['raisedCampPlane'] and rocky['unchangedRockSupportVerified'], rocky
          assert rocky['campPlaneAboveOriginalSurface'] == 1 and rocky['protectedCellCount'] >= 6147, rocky
          assert all(rocky['recordedOriginalTerrainCounts'][block] > 0
                     for block in ['minecraft:water', 'minecraft:oak_log', 'minecraft:oak_leaves']), rocky
          expected = ['01-established-flat-camp.png', '02-established-shallow-water-forest-camp.png', '03-established-rocky-water-forest-camp.png']
          assert data['screenshots'] == expected, data['screenshots']
          for name in expected:
              content = (root / name).read_bytes()
              assert content.startswith(b'\x89PNG\r\n\x1a\n') and len(content) > 4096, name
          print('All three actual camp-establishment scenarios passed. Review raw framebuffers and bounded fixture coverage.')
          PY
      - name: Collect diagnostics without companion JARs or worlds
        if: always()
        run: |
          mkdir -p build/native-camp-qa/evidence/logs
          if [ -d build/native-camp-qa/client/logs ]; then
            find build/native-camp-qa/client/logs -maxdepth 1 -type f -name '*.log' -exec cp {} build/native-camp-qa/evidence/logs/ \;
          fi
          if [ -d build/native-camp-qa/client/crash-reports ]; then
            cp -R build/native-camp-qa/client/crash-reports build/native-camp-qa/evidence/
          fi
      - name: Upload actual framebuffers and diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-camp-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/native-camp-qa/evidence/
          if-no-files-found: error
          retention-days: 7
