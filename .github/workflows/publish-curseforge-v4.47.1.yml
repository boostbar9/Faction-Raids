name: Publish tested 4.47.1 beta to CurseForge

on:
  push:
    branches: [publish/curseforge-v4.47.1]

permissions:
  contents: read
  actions: read

concurrency:
  group: curseforge-1364352-v4.47.1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify successful merged-main build and identical PR tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, urllib.request

          def get(path):
              request = urllib.request.Request(
                  'https://api.github.com/repos/boostbar9/Faction-Raids/' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'},
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          source_sha = 'bf1c949ac0fed2e56b68a3f3c3de3f3da534f8e0'
          source_tree = '74d613271b37e02c4cd1bc0c76bb897563b5b677'
          pr_head_sha = '5a9cbe24d1e969aaa0eb0684bff8abe843889a00'
          run = get('actions/runs/35495249911')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['event'] == 'push' and run['head_branch'] == 'main'
          assert run['head_sha'] == source_sha
          pr = get('pulls/167')
          assert pr['merged'] and pr['merge_commit_sha'] == source_sha
          assert pr['head']['sha'] == pr_head_sha
          for sha in (run['head_sha'], pr['merge_commit_sha'], pr_head_sha):
              assert get('git/commits/' + sha)['tree']['sha'] == source_tree
          CHECK

      - name: Download exact tested JAR
        uses: actions/download-artifact@v4
        with:
          name: Faction-Raids-Forge-1.20.1
          run-id: 35495249911
          github-token: ${{ github.token }}
          path: dist

      - name: Download regression results
        uses: actions/download-artifact@v4
        with:
          name: regression-test-results
          run-id: 35495249911
          github-token: ${{ github.token }}
          path: regression

      - name: Verify tested bytes, metadata, dependencies, and regressions
        run: |
          python3 - <<'CHECK'
          from pathlib import Path
          import hashlib, zipfile, tomllib
          import xml.etree.ElementTree as ET

          jar = Path('dist/siegeoverhaul-4.47.1.jar')
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          assert digest == 'be2857153439201c3e6890850085f70f5ff52b081c28e0b7a94f7dddea5af927'
          Path('verified-sha256.txt').write_text(digest)
          with zipfile.ZipFile(jar) as archive:
              assert archive.testzip() is None
              entries = set(archive.namelist())
              for entry in (
                  'com/devfarinsky/siegeoverhaul/client/CoreHireScreen.class',
                  'com/devfarinsky/siegeoverhaul/client/EntityPortrait.class',
                  'com/devfarinsky/siegeoverhaul/core/HeroTraits.class',
                  'com/devfarinsky/siegeoverhaul/core/FactionBank.class',
              ):
                  assert entry in entries, entry
              assert 'com/devfarinsky/siegeoverhaul/client/CommandIcon.class' not in entries
              assert 'com/devfarinsky/siegeoverhaul/client/RolePortrait.class' not in entries
              data = tomllib.loads(archive.read('META-INF/mods.toml').decode())
          mod = data['mods'][0]
          assert mod['modId'] == 'siegeoverhaul' and mod['version'] == '4.47.1'
          assert mod['displayTest'] == 'MATCH_VERSION'
          dependencies = {entry['modId']: entry for entry in data['dependencies']['siegeoverhaul']}
          for mod_id in ('recruits', 'workers', 'smallships', 'siegeweapons'):
              assert dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          assert dependencies['recruits']['versionRange'] == '[1.15.2,)'
          assert dependencies['workers']['versionRange'] == '[2.0.3,)'
          for mod_id in ('ftbchunks', 'openpartiesandclaims', 'corpse', 'magistuarmory', 'musketmod'):
              assert not dependencies[mod_id]['mandatory'] and dependencies[mod_id]['side'] == 'BOTH', mod_id
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          reports = list(Path('regression').rglob('TEST-*.xml'))
          assert reports
          for report in reports:
              result = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(result.get(key, 0))
          assert totals == {'tests': 435, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          print('Verified', jar.name, digest, totals)
          CHECK

      - name: Publish to CurseForge
        id: curseforge
        uses: Kir-Antipov/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: 1364352
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: dist/siegeoverhaul-4.47.1.jar
          name: The Siege Overhaul v4.47.1 beta - Command Center Clarity
          version: v4.47.1
          version-type: beta
          changelog: |
            # 4.47.1 beta

            - Restore real, continuously visible Recruits and Workers previews to all four Army offer cards. The equipped models follow the cursor again instead of being replaced by flat procedural avatars.
            - Correct preview entity selection for all twenty Olympian heroes and reuse the production equipment paths, including supported Epic Knights and Musket equipment when installed.
            - Remove unclear equipment glyphs, large corner emblems and decorative icons throughout the Command Center while retaining literal Minecraft emerald and revealed-loot sprites.
            - Reduce per-frame Command Center work with bounded text-layout caches and by removing continuous motes, additive glows and obsolete hidden widgets.
            - Improve text flow and headings across Army, Loot, Treasury, Territory and Intel without changing gameplay balance or save data.
          loaders: forge
          game-versions: 1.20.1
          java: 17
          curseforge-dependencies: |
            recruits(required)
            workers(required)
            small-ships(required)
            siegeweapons(required)
            ftb-chunks-forge(optional)
            open-parties-and-claims(optional)
            corpse(optional)
            epic-knights-armor-and-weapons(optional)
            ewewukeks-musket-mod(optional)
          fail-mode: fail

      - name: Record accepted upload
        env:
          RELEASE_URL: ${{ steps.curseforge.outputs.curseforge-url }}
          RELEASE_FILE_ID: ${{ steps.curseforge.outputs.curseforge-version }}
        run: |
          python3 - <<'RECEIPT'
          import json, os, hashlib
          from pathlib import Path
          digest = hashlib.sha256(Path('dist/siegeoverhaul-4.47.1.jar').read_bytes()).hexdigest()
          assert digest == Path('verified-sha256.txt').read_text()
          result = {
              'version': '4.47.1',
              'file_id': os.environ['RELEASE_FILE_ID'],
              'url': os.environ['RELEASE_URL'],
              'source': 'bf1c949ac0fed2e56b68a3f3c3de3f3da534f8e0',
              'source_tree': '74d613271b37e02c4cd1bc0c76bb897563b5b677',
              'pr_head': '5a9cbe24d1e969aaa0eb0684bff8abe843889a00',
              'build_run': 35495249911,
              'tests': 435,
              'sha256': digest,
          }
          assert result['file_id'] and result['url']
          print(json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Accepted upload (moderation/public availability separate): ' + json.dumps(result) + '\n')
          RECEIPT
