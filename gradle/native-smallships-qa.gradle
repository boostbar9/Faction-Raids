// Isolated exact-binary compatibility probe. Never part of production output.
if (providers.gradleProperty('nativeShipsQa').map { it.toBoolean() }.getOrElse(false)) {
    if (providers.gradleProperty('nativeQa').map { it.toBoolean() }.getOrElse(false)
            || providers.gradleProperty('nativeServerQa').map { it.toBoolean() }.getOrElse(false)) {
        throw new GradleException('Native Ships QA must run independently of existing native suites.')
    }
    def shipsRelease = providers.gradleProperty('nativeShipsRelease').getOrElse('final')
    if (!(shipsRelease in ['final', 'legacy'])) throw new GradleException('Unsupported Small Ships fixture release')
    def shipsFile = shipsRelease == 'final' ? '9061578' : '5566900'
    def runDir = "build/native-ships-${shipsRelease}-qa/server"
    configurations { nativeShipsQaCompanions }
    dependencies {
        nativeShipsQaCompanions fg.deobf('curse.maven:workers-567450:8351157')
        nativeShipsQaCompanions fg.deobf('curse.maven:recruits-523860:8339846')
        nativeShipsQaCompanions fg.deobf("curse.maven:small-ships-450659:${shipsFile}")
        nativeShipsQaCompanions fg.deobf('curse.maven:siegeweapons-1259343:7906096')
    }
    configurations.runtimeOnly.extendsFrom(configurations.nativeShipsQaCompanions)
    sourceSets {
        nativeShipsQa {
            java.srcDir 'src/nativeShipsQa/java'
            resources.srcDir 'src/nativeServerQa/resources'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    minecraft.runs.gameTestServer {
        workingDirectory project.file(runDir)
        property 'forge.enabledGameTestNamespaces', mod_id
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
        property 'siegeoverhaul.nativeShipsQa', 'true'
        property 'siegeoverhaul.nativeShipsQa.release', shipsRelease
        property 'siegeoverhaul.nativeShipsQa.directory', project.file(runDir).absolutePath
        args '--universe', project.file("${runDir}/worlds").absolutePath,
                '--world', 'siege-native-ships-fixture', '--nogui'
        jvmArgs '-Xms512m', '-Xmx3G'
        mods { "${mod_id}" { source sourceSets.nativeShipsQa } }
    }
    tasks.matching { it.name == 'runGameTestServer' }.configureEach {
        dependsOn tasks.named('nativeShipsQaClasses')
        doFirst {
            if (project.file("${runDir}/worlds/siege-native-ships-fixture").exists()
                    || project.file("${runDir}/eula.txt").exists()
                    || project.file("build/native-ships-${shipsRelease}-qa/evidence/result.json").exists()) {
                throw new GradleException('Refusing existing Ships QA world, EULA file, or evidence.')
            }
        }
    }
}
